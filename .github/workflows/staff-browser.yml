name: Staff continuity browser checks
on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'tools/staff53*'
      - 'tools/world36-check.cjs'
      - 'tools/world36-regression.cjs'
      - 'tools/browser-runtime.cjs'
      - 'tools/current-opening-fixture.cjs'
      - 'tools/world-scale66-audit.cjs'
      - 'tools/neighbor66*.cjs'
      - 'tools/neighbor66.js'
      - 'tools/pill67-*.cjs'
      - 'tools/economy68*.cjs'
      - 'tools/save-r1-check.cjs'
      - 'tools/closeout65-browser-check.cjs'
      - 'tools/opening61-browser-check.cjs'
      - 'tools/save-r1-browser-check.cjs'
      - 'tools/no-root64-check.cjs'
      - 'tools/breakthrough65-check.cjs'
      - 'tools/build-review-bundle.py'
      - 'tools/test_review_bundle.py'
      - '.github/workflows/staff-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test runtime
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Check bundle guards
        run: python -m unittest discover -s tools -p test_review_bundle.py -v
      - name: Check game logic
        run: node --test tools/staff53-check.cjs
      - name: Check real desktop and mobile browser
        run: node tools/staff53-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-browser-results
          path: .screenshots/staff53/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check mortal opening, breakthrough and save recovery
        run: |
          node --test tools/no-root64-check.cjs tools/breakthrough65-check.cjs tools/save-r1-check.cjs
          node tools/closeout65-browser-check.cjs
          node tools/opening61-browser-check.cjs
          node tools/save-r1-browser-check.cjs
          node --test tools/neighbor66-check.cjs
          node tools/neighbor66-browser-check.cjs
      - name: Check existing world and relationship regressions
        run: |
          node tools/world36-check.cjs
          node tools/world36-regression.cjs
      - name: Audit current world scale without changing rules
        run: |
          node tools/world-scale66-audit.cjs
          node --test tools/neighbor66-study-check.cjs tools/pill67-settlement-check.cjs tools/pill67-study-check.cjs
          node tools/pill67-study.cjs
          node --test tools/economy68-check.cjs
          node tools/economy68-browser-check.cjs
          node tools/economy68-audit.cjs
          node tools/neighbor66-study.cjs
      - name: Build complete review bundle
        run: python tools/build-review-bundle.py --commit "$REVIEW_COMMIT"
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: xiantu-review-bundle
          path: .artifacts/xiantu-review.zip
          if-no-files-found: error
