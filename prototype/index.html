/* =========================================================
   名声（软身份）
   ---------------------------------------------------------
   你在哪些圈子里有了名字：修士圈 / 凡人圈 / 本地。
   名声不是数值门槛，不卡任何进度——它只当「事件的门」：
   有了名字，某些事才自己找上门（被引荐、被求上门、被忌惮）。

   三圈各是一个档位（0/1/2），再挂一个「打响处」：
     · 档 0 = 无名
     · 档 1 = 闻名——只在打响处这一带有人认得
     · 档 2 = 扬名——打响处之外，相邻的地方也听说过
   所以「名气大，走得远；名气小，就只在本地」。跨的只是邻处，
   不是整个世界——青石县扬了名，府城照样没人认得你。
   ========================================================= */
const FAME_CIRCLES = ['修士','凡人','本地'];
const FAME_MAX = 2;

function fameInit(){
  const o={};
  FAME_CIRCLES.forEach(c=>o[c]={ v:0, at:null });
  return o;
}
/* 涨名声：dv 是档位增量，place 是这名声在哪儿打下的。 */
function addFame(s, circle, place, dv){
  s=s||G; if(!s) return;
  s.fame=s.fame||fameInit();
  const f=s.fame[circle]||{ v:0, at:null };
  f.v=Math.min(FAME_MAX, Math.max(0, (f.v|0)+dv));
  if(place) f.at=place;
  s.fame[circle]=f;
}
/* 你在 place 处、这个圈子有多少名：
   本处满档；扬名后相邻处也算有一名；再远就没人认得。 */
function fameReach(s, circle, place){
  s=s||G; if(!s||!s.fame) return 0;
  const f=s.fame[circle];
  if(!f || !f.v) return 0;
  if(!place || !f.at || place===f.at) return f.v;
  if(f.v>=2 && isAdjacent(f.at, place)) return 1;
  return 0;
}
function isAdjacent(a, b){
  if(a===b) return true;
  return ROUTES.some(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
}
/* 名气总览：给界面用的软提示。 */
function fameText(s){
  s=s||G;
  const parts=[];
  FAME_CIRCLES.forEach(c=>{
    const f=(s.fame&&s.fame[c])||{v:0};
    if(f.v>=2) parts.push('在'+c+'间扬了名');
    else if(f.v>=1) parts.push('在'+c+'间有些名字');
  });
  return parts.length ? parts.join('；') : '';
}

function weightedPick(items, wf){
  let total=0;
  for(const it of items) total+=wf(it);
  let r=Math.random()*total;
  for(const it of items){ r-=wf(it); if(r<=0) return it; }
  return items[items.length-1];
}

function randMateRoot(s){
  // 道侣灵根：略高于玩家一档或同档
  const t=TIER_OF[s.root]||1;

  return Math.random()<0.35?TIER_ROOT[up]:TIER_ROOT[t];
}

function rollOrigin(origin){
  const d=ORIGINS[origin];
  let r=Math.random()*100, acc=0;
  for(const [k,v] of d.dist){ acc+=v; if(r<=acc) return k; }
  return d.dist[d.dist.length-1][0];
}

  const discount=G.localQuest && G.localQuest.ending==='aid' && G.place==='prefecture'?0.9:1;

  if(!G || G.mode!=='idle') return false;
  if(G.age>=G.lifespan){ovHide();die('寿元耗尽');return false;}
  return true;

function runSystemDays(days,act){
  ovHide();
  const r=advanceDays(days,{act,rate:0,incomeMul:0},{stopOnEvent:true});
  if(r.died || r.event || r.days<days){
    addLog('事务中断，已过 '+r.days+' 日，尚未取得产物。','mute');
    save();
    if(r.died) die('寿元耗尽');
    else if(r.event) startEvent(r.event);
    else render();
    return false;

function wirePrimaryNav(){

function render(){
  document.body.classList.toggle('start-screen',!G);
  if(!G) return;
  const quiet=(G.mode==='child'||G.mode==='awaken'||G.mode==='prologue');
  document.body.classList.toggle('wide', quiet);
  if(quiet) closeLogDrawer();
  renderHUD(); renderScene(); renderActions(); renderLog();
}

function renderHUD(){
  const el=document.getElementById('hud');
  if(!G || !G.root){ el.innerHTML=''; return; }
  const need=needOf(G.layer)||1;
  const pct=Math.min(100, G.cult/need*100);
  const agePct=G.age/G.lifespan;
  const ageCls=agePct>0.85?'danger':(agePct>0.7?'warn':'');
  const realmTxt = curRealmTxt();
  const btReady = realmBrim() && canBreak();
  const rootCls = G.cap>=5?'gold':(G.cap>=3?'':'dull');
  const nextRealm = REALM_NAMES[realmOf()+1]||'飞升';
  el.innerHTML =
    '<div class="hud-brand"><strong>仙途</strong><span class="vermilion-seal">修行纪</span></div><div class="hud-left">'+
      '<div class="name-row">'+
        '<span class="name">'+G.name+'</span>'+
        '<span class="tag">'+G.origin+'</span>'+
        '<span class="tag root '+rootCls+'">'+G.root+'</span>'+
        (G.generation>1?'<span class="tag">第 '+G.generation+' 代</span>':'')+
        (btReady?'<span class="tag warn">可冲'+nextRealm+'</span>':'')+
      '</div>'+
      '<div class="realm-row">'+
        '<span class="realm">'+realmTxt+'</span>'+
        '<div class="bar"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>'+
        '<span class="bar-text">'+Math.floor(G.cult)+' / '+need+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="hud-right">'+
      '<div class="stat"><span class="k">年龄</span><span class="v '+ageCls+'">'+G.age+'</span></div>'+
      '<div class="stat"><span class="k">寿元</span><span class="v">'+G.lifespan+'</span></div>'+

/* =========================================================

function renderChild(){
  const el=document.getElementById('scene');
  const o=ORIGINS[G.origin];
  let html='<div class="prologue">';
  html+='<div class="pro-kicker">序 · 童 年 经 历　·　'+G.origin+'</div>';
  html+='<div class="pro-num">身<small>世由你择定</small></div>';

  html+='<div class="scene-head" style="margin-top:34px">你的童年是在哪里度过的</div>';
  html+='<div class="choices">'+o.variants.map((v,i)=>
      '<button class="choice" data-v="'+i+'">'+
        '<span class="num">'+(i+1)+'</span>'+
        '<span class="body">'+v.t+
          '<span class="hint">'+v.intro.split('\n')[0].split('。')[0]+'。</span>'+
          '<span class="hint"><span class="cost">'+v.hint+'</span></span>'+
        '</span>'+
      '</button>').join('')+'</div>';
  html+='<div class="pro-meta" style="margin-top:26px">这一选定的是测灵以前的童年经历。<br>'+

    b.addEventListener('click',()=>chooseChild(parseInt(b.dataset.v,10)));

}

function chooseChild(i){
  if(G.mode!=='child') return;
  const o=ORIGINS[G.origin];
  const v=o.variants[i]||o.variants[0];
  G.variantIdx=i;
  G.variant=v.name;
  G.mark=v.mark||'';
  stoneSet(G,v.home||0,'事件与修行');
  buildFamily();                    // 这一世的几个人，由这个身世定下
  if(v.mod&&v.mod.attr){
    for(const k in v.mod.attr) G.attr[k]=Math.max(1,Math.min(12,G.attr[k]+v.mod.attr[k]));
  }
  // 八岁测灵
  const root=rollOrigin(G.origin);
  G.root=root; G.coef=ROOTS[root].coef; G.cap=ROOTS[root].cap;
  if(G.cap>=4){ G.attr.wu=Math.min(12,G.attr.wu+1); G.attr.qi=Math.min(12,G.attr.qi+1); }
  G.mode='awaken';
  save(); render();
}

function renderAwaken(){
  const el=document.getElementById('scene');
  const o=ORIGINS[G.origin];
  const v=o.variants[G.variantIdx];
  const capTxt='修炼效率 '+Math.round(G.coef/0.97*100)+'%（三灵根为基准）';
  let html='<div class="prologue">';
  html+='<div class="pro-kicker">'+(G.measureAge||CFG.startAge)+'岁 · 测灵</div>';

  html+='<div class="pro-body" style="margin-top:18px">'+fillFate(v.past).replace(/不到八岁/g,'测灵以前').replace(/七岁那年/g,'测灵之前')+'</div>';
  html+='<div class="pro-body" style="margin-top:24px">'+fillFate(o.awaken).replace(/八岁/g,(G.measureAge||CFG.startAge)+'岁')+'</div>';
  html+='<div class="pro-body" style="margin-top:24px">石上浮起一层薄光，很淡，散得也慢。</div>';
  html+='<div class="pro-meta">'+
      '灵根 <b class="g" style="font-size:16px;letter-spacing:.08em">'+G.root+'</b>　·　资质评估 <b>'+capTxt+'</b><br>'+
      '身世 <b>'+G.variant+'</b>　·　家底 <b>'+G.stones+'</b> 灵石'+(G.mark?'　·　随身 '+G.mark:'')+

function beginCultivation(){
  if(G.mode!=='awaken') return;
  G.age=G.qiAge||CFG.startAge;
  G.layer=CFG.startLayer;
  G.cult=0;
  addLog('　'+(G.measureAge||CFG.startAge)+'岁测灵，得灵根 '+G.root+'。','hi');
  if(G.qiAge){G.lifeEvents.push({age:G.qiAge,kind:'引气入体',place:G.place,note:'炼气一层'});}
  addLog('　引气入体，入炼气一层。','up');
  G.lastResult={
    title:'炼 气 一 层',
    text:'你把那口气咽下去。\n\n它没有停在喉咙，也没有散——它往下沉了一寸，落在丹田里，'+
      '像一颗种子落进湿土。\n\n这就是引气入体。\n\n'+
      '<span class="mute">从今往后，每一年都要你自己安排：走出去，或关起门。</span>'
  };
  G.mode='result';
  save(); render();
}

function renderScene(){
  const el=document.getElementById('scene');
  if(!G){ el.innerHTML=''; return; }

  if(G.mode==='dead'){ renderDead(); return; }
  if(G.mode==='child'){ renderChild(); return; }
  if(G.mode==='awaken'){ renderAwaken(); return; }
  if(G.mode==='event' && G.curEvent){ renderEvent(); return; }
  if(G.mode==='result'){ renderResult(); return; }

  // idle
  const need=needOf(G.layer);
  const out=yearOutput();
  const full=realmFull();
  const brim=realmBrim();          // 修为真的满了（冲关失败后会掉下来，得重新攒）
  const remain=Math.max(0, need-G.cult);
  const perWalk=out*CFG.walkRate;
  const yWalk=Math.max(1, Math.ceil(remain/perWalk));
  const yRt=Math.max(1, Math.ceil(remain/out));
  const costRt=yRt*CFG.retreatCost;
  const pct=Math.min(100, G.cult/need*100);
  const rname=REALM_NAMES[realmOf()];
  const nxt=nextRealmIdx();
  const nxtName=nxt==null?'飞升':REALM_NAMES[nxt];

  let html='<div class="scene-head">'+rname+' · '+eraLabel()+' '+
    monthName(G.month||0)+cnDay((G.day||0)+1)+
    '　·　'+G.age+' 岁'+'　·　'+placeName(G.place)+'</div>';
  let body='';

  if(full){
    if(canBreak()){
      body='修为已至'+rname+'圆满，丹田中那股气满得发胀，再往前一步，就是'+nxtName+'。\n\n'+
           '只是那一步跨出去，未必能落在地上。';
    }else{
      body='<span class="mute">那一步没踏稳，气散了。</span>\n\n'+
           '丹田空了一截，得从头补回来。补多久，看你还有多少年，'+
           '也看你肯拿多少灵石去换。\n\n'+
           '这一次会更容易些，也未必。';
    }
  }else{
    body=AMBIENT[Math.floor(G.age/3)%AMBIENT.length];
  }
  html='<div class="scene-vista"><div class="vista-copy"><small>山河入卷 · 一念问道</small><h2>'+placeName(G.place||'village')+'</h2><p>'+curRealmTxt()+'　·　'+eraLabel()+'</p></div><span class="vista-chapter">仙途 · 修行纪</span></div>'+html;
  html+='<div class="scene-text">'+body+'</div>';

  html+='<div class="stat-panel">'+
    '<div class="hd">'+
      '<span>'+(brim?rname+'圆满':(full?realmLayerName(realmOf(), curLayerCount())+'　补修':curRealmTxt()+'　→　'+realmLayerName(realmOf(), G.layer+1)))+'</span>'+
      '<span><b>'+Math.floor(G.cult)+'</b> / '+need+'</span>'+
    '</div>'+
    '<div class="bar"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';

  if(full){
    html+='<div class="calc">'+
      (canBreak()
        ? '修为已满。<b>可以冲关了。</b>'
        : '冲关打散的修为还得补：闭关 <b>'+yRt+'</b> 年，耗 <span class="amber">'+costRt+'</span> 灵石')+
      '</div>';
  }else{
    html+='<div class="calc">'+
      '离下一层　·　行走 <b>'+yWalk+'</b> 年'+
      '<span class="sep">|</span>'+
      '闭关 <b>'+yRt+'</b> 年，耗 <span class="amber">'+costRt+'</span> 灵石'+
      '</div>';
  }
  html+='</div>';

  // 状态摘要
  const bits=[];
  if(G.injured>0) bits.push('<span class="bad">伤势未愈（剩 '+G.injured+' 年）</span>');
  if(G.flag && G.flag.heartDemon) bits.push('<span class="bad">心魔缠身（闭关效率 -20%，可通过心性事件化解）</span>');
  if(G.buff.haste>0) bits.push('<span class="good">苦修（剩 '+G.buff.haste+' 年）</span>');
  if(G.buff.vein>0) bits.push('<span class="good">灵眼洞府（剩 '+G.buff.vein+' 年）</span>');
  if(G.buff.fertile>0) bits.push('<span class="good">灵田滋养（剩 '+G.buff.fertile+' 年）</span>');
  if(G.buff.dan>0) bits.push('<span class="good">聚气（剩 '+G.buff.dan+' 年）</span>');
  if(G.karma>=20) bits.push('<span class="bad">业力缠身（'+G.karma+'）</span>');
  if(G.hasMate) bits.push('道侣在侧');
  if(G.ward) bits.push('阿宁已成人');
  if(G.beast) bits.push(G.beast+'随行');
  /* 关键警示：寿元将尽、有账未了。这些不是坏事，是「该拿主意了」的提示。
     寿元线压在 85%——过了这个坎，再想冲关就只剩孤注一掷。 */
  if(G.lifespan>0 && G.age/G.lifespan>=0.85) bits.push('<span class="bad">寿元将尽（余 '+(G.lifespan-G.age)+' 年）</span>');
  if(pendingRel(G,'怨').length>0) bits.push('<span class="warn">有旧怨未了（'+pendingRel(G,'怨').length+' 桩）</span>');
  else if(pendingRel(G,'恩').length>0) bits.push('<span class="warn">有旧恩未报（'+pendingRel(G,'恩').length+' 桩）</span>');
  if(bits.length) html+='<div class="scene-sub">'+bits.join('　·　')+'</div>';


  el.innerHTML=html;
}

function renderEvent(){
  const el=document.getElementById('scene');
  const ev=G.curEvent;
  const evText = ev.dyn ? ev.dyn(G) : ev.text;
  let html='<div class="scene-head">'+ev.name+'</div>';
  html+='<div class="scene-text">'+fillFate(evText)+'</div>';
  html+='<div class="choices">';
  ev.opts.forEach((o,i)=>{
    /* 术法出路：选项带 need（遁/护/攻），没练对应术法就不给这条出路——手段是「得」来的，不是人人都有。 */
    if(o.need && !hasRoute(G,o.need)) return;
    const disabled=o.cost&&G.stones<o.cost;
    const hint=[];
    if(o.cost) hint.push('<span class="cost">需 '+o.cost+' 灵石</span>');
    if(o.d) hint.push('<span class="cost">多 '+o.d+' 日</span>');
    if(o.cancel) hint.push('<span class="cost">这一趟白走</span>');
    if(o.hint) hint.push(o.hint);
    if(o.need) hint.push('<span class="cost">赖「'+(routeName(o.need))+'」</span>');
    html+='<button class="choice" data-i="'+i+'"'+(disabled?' disabled':'')+'>'+
          '<span class="num">'+(i+1)+'</span>'+
          '<span class="body">'+fillFate(o.l)+(hint.length?'<span class="hint">'+hint.join('　')+'</span>':'')+'</span>'+
          '</button>';
  });
  html+='</div>';
  el.innerHTML=html;
  el.querySelectorAll('.choice').forEach(b=>{
    b.addEventListener('click',()=>chooseOption(parseInt(b.dataset.i,10)));
  });
}

function renderResult(){
  const el=document.getElementById('scene');
  const r=G.lastResult;
  if(!r){ G.mode='idle'; renderScene(); return; }
  let html='<div class="scene-head">'+(r.title||'结 果')+'</div>';
  html+='<div class="scene-text">'+fillFate(r.text)+'</div>';
  html+='<div class="choices"><button class="choice" id="contBtn">'+
        '<span class="num">›</span><span class="body">继续</span></button></div>';
  el.innerHTML=html;
  document.getElementById('contBtn').addEventListener('click',()=>{
    G.lastResult=null;
    if(G.road){ finishRoad(); return; }     // 路上的事还没走完
    if(G.age>=G.lifespan){ die('寿元耗尽'); return; }
    G.mode='idle'; render();
  });
}

function renderActions(){
  const el=document.getElementById('actions');
  if(!G){ el.innerHTML=''; return; }
  if(G.mode==='dead'){ el.innerHTML=''; return; }
  if(G.mode==='event'||G.mode==='result'||G.mode==='child'||G.mode==='awaken'||G.mode==='prologue'){ el.innerHTML=''; return; }

  const maxR=Math.floor(G.lifespan*CFG.retreatMaxPct);
  const canBreakNow=canBreak();
  let html='';
  const nxt=nextRealmIdx();
  const nxtName = nxt==null ? '飞升' : REALM_NAMES[nxt];

  const brim = realmBrim();   // 修为真的满了（冲关失败会掉下来）
  const leftDays = monthsLeft()*CFG.daysPerMonth - (G.day||0);
  const left = Math.ceil(leftDays/CFG.daysPerMonth);   // 不足一月的零头也算一月，写给人看
  const lblWalk = left>=CFG.monthsPerYear ? '修行一年' : ('修行 '+left+' 月');
  const lblIdle = left>=CFG.monthsPerYear ? '谋生一年' : ('谋生 '+left+' 月');
  html+='<section class="action-group action-main"><div class="action-caption">修 行</div><div class="action-buttons">';
  if(!realmFull() || !brim){
    html+='<button class="act primary" id="btnYear"><span class="act-mark">☯</span><span>'+lblWalk+'</span></button>';
    html+='<button class="act" id="btnAuto"><span class="act-mark">⟳</span><span>连续修行</span></button>';
    html+='<button class="act" id="btnIdle"><span class="act-mark">◇</span><span>'+lblIdle+'</span></button>';
    html+='<button class="act" id="btnRetreat"><span class="act-mark">☷</span><span>闭关</span></button>';
  }else{
    html+='<button class="act primary" id="btnYear"><span class="act-mark">◇</span><span>'+lblIdle+'</span></button>';
    html+='<button class="act" id="btnAuto"><span class="act-mark">⟳</span><span>连续谋生</span></button>';
    if(canBreakNow) html+='<button class="act primary" id="btnBreak"><span class="act-mark">✦</span><span>'+(nxt==null?'渡劫飞升':'突破'+nxtName)+'</span></button>';
  }
  html+='</div></section><section class="action-group action-world"><div class="action-caption">行 走 江 湖</div><div class="action-buttons">';
  html+='<button class="act" id="btnGo"><span class="act-mark">⌖</span><span>山河地图</span><small>寻路 · 行程</small></button>';
  html+='<button class="act" id="btnHere"><span class="act-mark">⌂</span><span>此地事务</span><small>人物 · 事件 · 营生</small></button>';
  html+='</div></section><section class="action-group action-tools"><div class="action-caption">杂 务</div><div class="action-buttons">';
  html+='<button class="act ghost log-open" id="btnLog">修行录</button>';
  html+='<button class="act ghost" id="btnSelf">自身</button>';
  html+='<button class="act ghost" id="btnGuide">门道</button>';
  html+='<button class="act ghost" id="btnSaves">存档</button>';
  html+='<button class="act ghost" id="btnSettings">设置</button>';
  if(G.generation>1) html+='<button class="act ghost" id="btnLineage">族谱</button>';
  html+='</div></section>';
  el.innerHTML=html;

  const y=document.getElementById('btnYear');
  if(y) y.addEventListener('click',()=>stepYear(false));

/* =========================================================
   核心循环
   ========================================================= */
/* =========================================================
   规则层：一年的结算
   只改 G，不碰 DOM、不弹窗、不渲染。
   界面与无头模拟器共用这一处——数值只在这里算一次。
   ========================================================= */
function currentPlaceQi(s){
  s=s||G;
  const place=(typeof PLACES!=='undefined' && PLACES) ? PLACES[s.place||'village'] : null;
  return place && Number.isFinite(place.qi) ? place.qi : 1;
}
function qiGateStatus(s){
  s=s||G;
  const info=realmInfo(realmOf(s));
  const qi=currentPlaceQi(s);
  return {qi, gate:info.qiGate, enough:qi>=info.qiGate, realm:info.name, place:(PLACES[s.place||'village']||PLACES.village).name};
}

/* 第20批：货币价格按设定总表每百年通胀 8%。
   以世界历年号计算，不按角色年龄重置；收入、药材售价与闭关年耗同倍率变化，
   避免只涨价格不涨收入导致旧存档随时间自然破产。基础配置值仍是璇玑元年口径。 */
function economyFactor(){
  const y = (typeof eraYear==='function') ? Math.max(0, eraYear()) : CFG.eraStart;
  return Math.pow(1.08, Math.floor(y/100));
}
function currentRetreatCost(){ return Math.round(CFG.retreatCost * economyFactor() * XTEconomy40.rule(G).retreatCostMultiplier); }
function currentWalkIncome(){ return Math.round(CFG.walkIncome * economyFactor() * XTEconomy40.rule(G).incomeMultiplier); }
function currentIdleIncome(){ return Math.round(CFG.idleIncome * economyFactor() * XTEconomy40.rule(G).incomeMultiplier); }

function yearOutput(s){
  s = s||G;
  // 年产基准取自《问道长生》设定总表「寿元平衡模拟」的“段内年产灵气”列。
  // 注意：REALMS.pace 是日行里数，只影响赶路，不是修炼倍率。
  // 表中炼气三灵根基准为 100 灵/年；以 0.97 作为三灵根速度系数归一化，保持该基准。
  const info=realmInfo(realmOf(s));
  const realmBase=Number.isFinite(info.cultivationBase) ? info.cultivationBase : CFG.baseOutput;
  let base=realmBase*(s.coef/0.97);
  // 阶段1·修行闭环：环境正式参与修为产出。
  // 已拍板的基准地点倍率：村庄×1.3、县城×1.0、断云崖×2.0。
  // 其它地点若设定表尚未给出专属倍率，则沿用灵气浓度的温和系数，避免擅自编造数值。
  const place=(typeof PLACES!=='undefined' && PLACES) ? PLACES[s.place||'village'] : null;
  const placeKey=s.place||'village';
  const explicitCultivationMul={ village:1.30, county:1.00, cliff:2.00 };
  const qi=(place && Number.isFinite(place.qi)) ? place.qi : 1;
  const environmentMul=Number.isFinite(explicitCultivationMul[placeKey])
    ? explicitCultivationMul[placeKey]
    : Math.max(0.8, 0.8 + 0.2 * qi);
  base *= environmentMul;
  if(s.buff.haste>0) base*=1.25;
  if(s.buff.vein>0) base*=1.15;
  if(s.buff.fertile>0) base*=1.1;
  if(s.buff.dan>0) base*=1.3;          // 聚气散：炼气期修炼速率 +30%（设计案 v1.1「丹药法宝表」）
  base *= (1 + artMindSum(s).absorb);
  if(s.learned && s.learned.qiManual) base *= 1.08; // 引气篇研读效果
  if(s.equipment && s.equipment.weapon==='ironSword') base *= 1.02; // 青钢短剑仅提供轻微护身与专注加成   // 心法：吸收灵气更利，修行更快（每本心法效果不同）
  if(s.injured>0) base*=0.65;
  return base;
}

/**
 * 过一年。
 * ctx.act        'walk' | 'retreat' | 'idle' | 'travel'
 * ctx.rate       修为产出系数（行走 0.5；闭关为效率值；营生不产修为）
 * ctx.incomeMul  灵石收入倍率（闭关为 0）
 * ctx.cost       每年耗灵石（闭关 = retreatCost）
 * ctx.eventRate  本年事件概率（undefined = 用该 act 的默认值；0 = 不抽）
 * ctx.retreat    true 时用闭关事件池
 * 返回 { act, gain, income, cost, level0, level1, levelUp, full, event, died, broke }
 * 渲染、日志、startEvent、die 都由调用方处理。
 */
/* 时间的唯一入口。
   以前是 advanceMonths——按月推，月是最小单位。可是赶路只有几天，按月推等于
   「走两天」和「走三十天」同一个价，里数就成了装饰。所以底层换成日，月由日累加出来。

   推进按「段」算而不是逐日：每一段只走到本月底，段数最多等于跨过的月数，
   与原来的按月循环同量级，sim 跑一千局不会变慢。

   例：第 8 载三月初十 + 15 日 = 三月廿五；再 + 10 日才进四月。

   out.months 只在真的跨月时 ++，所以它是「跨过了几道月末」，不是精确月数；
   要精确值读 out.days。 */
function advanceDays(n, ctx, opt){
  stoneAccount(G);
  ctx = ctx||{}; opt = opt||{};
  const stopOnEvent = opt.stopOnEvent!==false;
  const rate      = ctx.rate!=null ? ctx.rate : CFG.walkRate;
  const incomeMul = ctx.incomeMul!=null ? ctx.incomeMul : 1;
  const DPM = CFG.daysPerMonth;
  const out={ act:ctx.act||'walk', gain:0, income:0, cost:0,
              level0:G.layer, level1:G.layer, levelUp:false, full:false,
              event:null, died:false, broke:false, days:0, months:0, years:0 };

  if(ctx.cost>0){
    if(G.stones<ctx.cost){ out.broke=true; return out; }
    stoneChange(G,-ctx.cost,'行动费用'); out.cost=ctx.cost;
  }

  let left = Math.max(0, n|0);
  while(left>0){
    if(G.age>=G.lifespan){ out.died=true; break; }
    if(G.day==null) G.day=0;
    const seg = Math.min(left, DPM - G.day);   // 走到本月底，不多跨

    if(realmBrim() || ctx.idle){
      out.full = out.full || ctx.idle;
      
      out.income+=stoneAccrue(G,Math.round(currentIdleIncome()*incomeMul)*seg,CFG.monthsPerYear*DPM,'日常营生');
    }else{
      const gate=qiGateStatus(G);
      if(gate.enough){
        const gain=yearOutput(G)*rate/CFG.monthsPerYear*seg/DPM;
        gainCult(G,gain);
        out.gain+=gain;
      }
      // 灵气不足不妨碍谋生，但不能正常积累修为。
      
      out.income+=stoneAccrue(G,Math.round(currentWalkIncome()*incomeMul)*seg,CFG.monthsPerYear*DPM,'行走营生');
    }

    G.day+=seg; left-=seg; out.days+=seg;
    if(G.day>=DPM){
      G.day=0;
      if(G.t==null) G.t=rebaseT();   // 旧档兜底
      G.t++;                        // 世界钟与你的岁月同走一步，但不会随换代回头
      G.month=(G.month||0)+1;
      out.months++;
      worldTick();                  // 世上走一格：该散的散，该起的起。与玩家无关
      if(G.month>=CFG.monthsPerYear){
        G.month=0; out.years++;
        yearTurn(out,ctx);
        if(out.died) break;
        if(out.event && stopOnEvent) break;
      }
    }
  }
  expireLocalQuest();
  out.level1=G.layer;
  out.levelUp=G.layer>out.level0;
  out.gain=Math.round(out.gain);
  out.income=Math.round(out.income);
  return out;
}

/* 整月只是「30 日」的写法。留着它，是因为大多数动作本来就是按月计的。 */
function advanceMonths(n, ctx, opt){ return advanceDays((n|0)*CFG.daysPerMonth, ctx, opt); }

/* 跨年那一瞬：年龄、旧债、世界演化、遇事。
   与「按月结算」分开，是因为修为是月的事，寿元是年的事。 */
function yearTurn(out, ctx){
  // 设定总表「闭关与时间」：连续行走满一年，闭关效率递减重置。
  // 只对明确的行走回合累计；闭关、营生、旅行或其他动作都会打断连续行走。
  if(ctx && ctx.act==='walk'){
    G.walkYearsSinceRetreat=(G.walkYearsSinceRetreat||0)+1;
    if(G.walkYearsSinceRetreat>=1){
      if((G.rtCount||0)>0){
        G.rtCount=0;
        addLogTo(G,'行走一年，心气渐复。下一次闭关可恢复全效。','up');
      }
      G.walkYearsSinceRetreat=0;
    }
  }else{
    G.walkYearsSinceRetreat=0;
  }
  // 设定总表规则：所在地点灵气低于当前境界门槛，修为不增且每年损耗1%。
  // 只损耗当前已积累的修为，不改变已完成的小境界；圆满冲关前的补修同样受影响。
  const gateAtYearEnd=qiGateStatus(G);
  if(!gateAtYearEnd.enough && G.cult>0){
    const before=G.cult;
    G.cult=Math.max(0,Math.floor(G.cult*0.99));
    out.qiPenalty=(out.qiPenalty||0)+(before-G.cult);
  }
  G.age++;
  tickBuffs(G);
  familyTurn();                       // 家里的人也在老——你在不在家，都在老
  if(G.age>=G.lifespan){ out.died=true; return; }

  if(G.debt){
    G.debt.years--;
    if(G.debt.years<=0){
      if(Math.random()<0.6){ stoneChange(G,G.debt.amt,'事件与修行'); addLogTo(G,'李师兄还了 '+G.debt.amt+' 灵石。','up'); }
      else addLogTo(G,'李师兄没有还钱，人也不见了。','dn');
      G.debt=null;
    }
  }

  if(ctx.retreat){
    const er=ctx.eventRate!=null?ctx.eventRate:CFG.retreatEventRate;
    if(er>0 && Math.random()<er){
      const ev=pickRetreatEvent();
      if(ev) out.event=ev;
    }
  }else if(ctx.eventRate!==0){
    const ev=tryEvent(ctx.eventRate);
    if(ev) out.event=ev;
  }
}

/* sim 与旧调用方仍按「一年」叫我：一年 = 十二个月，遇事不打断（结算完再处理）。 */
function tickYear(ctx){
  return advanceMonths(CFG.monthsPerYear, ctx, {stopOnEvent:false});
}

function stepYear(silent){
  if(G.mode!=='idle') return;
  /* 推到年底为止，不是「推十二个月」——年中出过门的话，那一年已经短了一截 */
  const left = monthsLeft()*CFG.daysPerMonth - (G.day||0);
  const r=advanceDays(Math.max(1,left), {act:'walk'}, {stopOnEvent:true});
  if(r.died){ die('寿元耗尽'); return; }
  if(!silent){
    if(r.full && !r.gain) addLog('谋生 '+r.months+' 月，得 '+r.income+' 灵石。');
    else addLog('修行 '+r.months+' 月，修为 +'+r.gain+'，灵石 +'+r.income+'。');
  }
  if(r.event){ startEvent(r.event); return; }
  if(!silent) render();
  return;
}

/* 专心挣钱：放下修行，把这一年的力气都换成灵石。
   修为分毫不涨，但一年进账比「行走」高得多（idleIncome 110 vs walkIncome 40）。
   这是炼气段攒闭关钱的正路——要往上走，先得有灵石。 */
function stepIdle(silent){
  if(G.mode!=='idle') return;
  const left = monthsLeft()*CFG.daysPerMonth - (G.day||0);
  const r=advanceDays(Math.max(1,left), {act:'idle', idle:true}, {stopOnEvent:true});
  if(r.died){ die('寿元耗尽'); return; }
  if(!silent){
    addLog('你放下修行，专心谋生 '+r.months+' 月，得 '+r.income+' 灵石。修为未进分毫。','');
  }
  if(r.event){ startEvent(r.event); return; }
  if(!silent) render();
  return;
}

function tickBuffs(s){
  s = s||G;
  for(const k of Object.keys(s.buff)){
    s.buff[k]--;
    if(s.buff[k]<=0) delete s.buff[k];
  }
  if(s.injured>0) s.injured--;
  if(s.karma>0 && Math.random()<0.06) s.karma--;
}

function gainCult(s, amount){
  s = s||G;
  const r=realmOf(s);
  const lc=realmLayerCount(r);
  if(s.layer>=lc){
    // 圆满之后修为仍可慢慢补回来（冲关失败会倒扣，得重新攒）
    const cap=realmFullNeed(s);
    if(s.cult<cap) s.cult=Math.min(cap, s.cult+amount);
    return 0;
  }
  const from=s.layer;
  s.cult+=amount;
  while(s.layer<lc){
    const need=(r===0)?LAYER_NEED[Math.min(s.layer,CFG.layerCount)-1]:realmNeed(r, s.layer);
    if(s.cult<need) break;
    s.cult-=need;
    s.layer++;
    addLogTo(s,'　修为精进，晋'+realmLayerName(r, s.layer)+'。','up');
    if(s.layer>=lc){
      s.cult=realmFullNeed(s);
      addLogTo(s,'　气满周天，'+REALM_NAMES[r]+'圆满。','up');
      break;
    }
  }
  return s.layer-from;
}

function autoRun(){
  let guard=0;
  const wasFull=realmBrim();
  const cap=wasFull?5:300;                    // 道尽后只稳步营生，不一口气推到死
  const age0=G.age, layer0=G.layer, realm0=realmOf(), stone0=G.stones;
  while(G.mode==='idle' && guard++<cap){
    const ageBefore=G.age;
    const layerBefore=G.layer;
    const realmBefore=realmOf();
    stepYear(true);
    if(G.mode!=='idle') return;               // 触发事件或死亡
    if(G.age===ageBefore) return;
    if(!wasFull && (realmBefore<realmOf() || (realmBefore===realmOf() && layerBefore<curLayerCount() && G.layer>=curLayerCount()))){
      addLog('连行 '+(G.age-age0)+' 年，'+REALM_NAMES[realmOf()]+'圆满。','up');
      render(); return;
    }
  }
  const dy=G.age-age0;
  if(dy>0) addLog('连行 '+dy+' 年，灵石 '+(G.stones>=stone0?'+':'')+(G.stones-stone0)+'。');
  render();
}

/* =========================================================
   世 事
   ---------------------------------------------------------
   事件以前只有一条路：年底掷一次骰子，掷中就当场弹出来。
   那等于说，事情是为了玩家才发生的——玩家不来，世上就没有事。

   这一层反过来。事先在世上发生，有地方、有期限，玩家去不去它都在走：
     起  —— 每月一格，起不起看「事力」（人口与修士数），不看玩家。
     留  —— 两三个月，过了就散，散的时候只有你正好在那儿才看得见。
     遇  —— 你在那儿做事的一月里，才撞得上。路过往不算。
     闻  —— 打听能听到邻处的事，听说了才知道该往哪儿走。
     迟  —— 赶到了事却没了，会有一句话交代。这就是「世界先行」唯一给的交代。

   ★ 这一层不替玩家决定，只决定「此刻世上有什么」。
     去处、走不走、赶不赶得上，仍旧是玩家的事。
   ========================================================= */
/* 世界钟：自璇玑元年正月起，走到第几个月。它与你的岁数同一步走，
   但不随换代回头——你死，钟接着走。这就是「大时间」。 */
function rebaseT(){
  /* 旧档没有 G.t，只有岁数：把岁数折算回璇玑纪年。八岁测灵那年＝璇玑 eraStart 年。 */
  const a=Math.max(CFG.startAge, G.age||0);
  return CFG.eraStart*CFG.monthsPerYear + (a-CFG.startAge)*CFG.monthsPerYear + (G.month||0);
}
function absMonth(){
  if(G.t!=null) return G.t;
  return rebaseT();
}
function eraYear(){ return Math.floor(absMonth()/CFG.monthsPerYear); }
function eraLabel(){ return CFG.eraName + cnYear(eraYear()) + '年'; }
function eraDate(){ return eraLabel() + ' ' + monthName(G.month||0) + cnDay((G.day||0)+1); }

/* 一个地方每月起事的概率：底子看「这是个什么样的地方」，再按修士数略加。
   不要拿人口去除——一村三百人、一县两万四，除出来差八十倍，村子就死了。
   底子（每月）：村 6% · 野地 5% · 市 13% · 山门 15% · 城 28%。
   修士加成封顶 10%：人多的地方事多，但不该让人口把村子压成零。 */
const LIVE_BASE = { '村':0.06, '野地':0.05, '市':0.13, '山门':0.15, '城':0.28 };
function spawnChanceOf(p){
  const base = LIVE_BASE[p.tier]!=null ? LIVE_BASE[p.tier] : 0.05;
  return Math.min(0.40, base + Math.min(0.10, (p.cult||0)*0.004));
}
/* 一地同时挂几桩：县城与山门挂两桩，其余一桩。
   不以人口定——坊市人不多，可它是消息集散处。 */
function liveCapOf(p){ return (p.cult>=12) ? 2 : 1; }

function liveName(id){
  const e=EVENTS.find(x=>x.id===id);
  return e ? e.name : '事';
}
/* 家事起在你家，不该当作「别处的新闻」传出去——
   「听说那边出了事」后面接一句「家中捎话」，读起来就散了。 */
function isHomeEvent(id){
  const e=EVENTS.find(x=>x.id===id);
  return !!(e && e.place==='home');
}
function liveAt(k){ return G.live && G.live[k] ? G.live[k] : []; }
function liveLeft(a){ return Math.max(0, a.until - absMonth()); }

function neighborsOf(k){
  return ROUTES.filter(r=>r.a===k||r.b===k)
    .map(r=>({ to:(r.a===k?r.b:r.a), li:r.li, road:r.road, risk:r.risk }))
    .filter(x=>placeAvailable(x.to) && routeAvailable(routeOf(k,x.to)));
}

/* 这地方此刻起得起来的事：不是闭关事、路上事、随处事；没发生过；不在冷却；还没在这里挂着。 */
function liveEligible(k){
  const here=(G.live[k]||[]).map(x=>x.id);
  return EVENTS.filter(e=>{
    if(e.retreat || e.road) return false;
    /* place:'home' 的事只起在你家（G.home）——出身不同，家在的地方就不同。 */
    if(e.place==='home'){ if(k!==(G.home||k)) return false; }
    else if(!e.place || e.place==='any' || e.place!==k) return false;
    if(e.once && G.eventsDone[e.id]) return false;
    if(e.cond && !e.cond(G)) return false;
    const cd=G.evtCd[e.id];
    if(cd && G.age<cd) return false;
    if(here.indexOf(e.id)>=0) return false;
    return true;
  });
}

/* 起一桩事。until 记的是绝对月，不是「还剩几月」——账要记死的，「还剩」是给人看的。 */
function worldSpawn(k){
  const p=PLACES[k];
  if(!p || !placeAvailable(k)) return null;
  if((G.live[k]||[]).length >= liveCapOf(p)) return null;
  const pool=liveEligible(k);
  if(!pool.length) return null;
  const e=weightedPick(pool,x=>x.w||8);
  const life=CFG.liveLifeMin + ri(0, CFG.liveLifeMax-CFG.liveLifeMin);
  G.live[k]=G.live[k]||[];
  G.live[k].push({ id:e.id, until:absMonth()+life, born:absMonth() });
  return e;
}

/* 每月走一格：先送走该散的，再看有没有新的起来。玩家在不在都一样。 */
function worldTick(){
  const now=absMonth();
  Object.keys(G.live||{}).forEach(k=>{
    const keep=[];
    (G.live[k]||[]).forEach(a=>{
      if(a.until>now){ keep.push(a); return; }
      G.gone[k]=G.gone[k]||[];
      G.gone[k].push({ id:a.id, at:now, name:liveName(a.id) });
      /* 只有你正好在那儿，才看得见它散。不在，这件事等于没发生过。 */
      if(k===G.place) addLogTo(G,'　「'+liveName(a.id)+'」到底散了，没能等到你。','dn');
    });
    G.live[k]=keep;
  });
  Object.keys(G.gone||{}).forEach(k=>{
    G.gone[k]=(G.gone[k]||[]).filter(x=>now-x.at<=CFG.liveTrace);
    if(!G.gone[k].length) delete G.gone[k];
  });
  Object.keys(PLACES).forEach(k=>{
    const p=PLACES[k];
    if(!placeAvailable(k)) return;
    if(Math.random()>=spawnChanceOf(p)) return;
    worldSpawn(k);
  });
}

/* 开局先铺一铺。不然头一个月全图空着，「找事」这个玩法从第一天就是假的。 */
function worldSeed(){
  G.live={}; G.gone={}; G.know={};
  ['county','temple','market'].forEach(k=>worldSpawn(k));
  worldSpawn(G.place||'village');
}

/* 你在这儿做事的一月里，撞上了这儿正在发生的事。
   概率不低——事是明摆着的，只是你得在这儿待够一个月。路过往不算。 */
function meetLive(k){
  const arr=G.live[k]||[];
  if(!arr.length) return null;
  if(Math.random()>CFG.liveMeet) return null;
  const a=pick(arr);
  G.live[k]=arr.filter(x=>x!==a);
  const e=EVENTS.find(x=>x.id===a.id);
  if(e) addLogTo(G,'　你赶上了「'+e.name+'」。','');
  return e||null;
}

/* 你听说这儿有事，赶到了，事没了。这一句是「世界先行」唯一会给的交代。 */
function checkMissed(to){
  const kn=(G.know||{})[to];
  if(!kn) return;
  if(liveAt(to).some(a=>a.id===kn.id)) return;    // 还在，就没错过
  delete G.know[to];
  if(absMonth()-kn.at > 6) return;                // 半年前的旧话，不必再提
  addLogTo(G,'　你为「'+liveName(kn.id)+'」来的，到了才知道前些日子已经了了。','dn');
}

function tryEvent(rate){
  if(G.age<=(G.evtGap||0)) return null;      // 事不过年，至少隔一年
  const p = rate!=null ? rate : CFG.eventRate;
  if(Math.random()>p) return null;
  const pool=EVENTS.filter(e=>{
    if(e.retreat) return false;
    /* 年度抽签只管「随身」的事：心魔、自身、路上遇见的人。
       地点上的事一律不从这里出——它们由世事层起，先发生，你去撞、去赶，才遇得上。
       这一行是「世界先行」的分界：会自己找上门的，只有你自己的事。 */
    if(e.place && e.place!=='any') return false;
    if(e.road) return false;
    if(e.cond && !e.cond(G)) return false;
    if(e.once && G.eventsDone[e.id]) return false;
    const cd=G.evtCd[e.id];
    if(cd && G.age<cd) return false;
    return true;
  });
  if(!pool.length) return null;
  return weightedPick(pool,e=>e.w||8);
}

function pickRetreatEvent(){
  const pool=EVENTS.filter(e=>{
    if(!e.retreat) return false;
    if(e.cond && !e.cond(G)) return false;
    if(e.once && G.eventsDone[e.id]) return false;
    const cd=G.evtCd[e.id];
    if(cd && G.age<cd) return false;
    return true;
  });
  if(!pool.length) return null;
  return weightedPick(pool,e=>e.w||8);
}

function startEvent(ev){
  G.curEvent=ev;
  G.mode='event';
  save();render();
}

/* 结算一个选项：只改 G，不渲染。界面与模拟器共用。 */
function applyOption(ev, i){
  const o=ev.opts[i];
  if(!o) return null;
  if(o.cost && G.stones<o.cost) return null;
  if(o.need && !hasRoute(G,o.need)) return null;   // 术法出路：没练对应手段，就没这条路

  let res, succ=null;
  if(typeof o.chance==='function'){
    const p=Math.max(0.05,Math.min(0.92,o.chance(G)));
    succ=Math.random()<p;
    if(o.cost) stoneChange(G,-(o.cost),'事件与修行');
    res=succ?o.ok(G):o.no(G);
  }else{
    if(o.cost) stoneChange(G,-(o.cost),'事件与修行');
    res=o.run(G);
  }

  G.eventsDone[ev.id]=true;
  if(ev.cd) G.evtCd[ev.id]=G.age+ev.cd;
  G.evtCount++;
  /* 路上的事与一年一度的事各走各的：路上的不占「事不过年」的名额。 */
  if(!ev.road) G.evtGap=G.age+1;
  /* 路上：选项可以多花几日，也可以让这一趟整个作废。 */
  if(G.road){
    if(o.d) G.road.extra=(G.road.extra||0)+o.d;
    if(o.cancel) G.road.cancel=true;
  }
  if(res.log) addLogTo(G,res.log, succ===false?'dn':'');
  clampState();
  return { res, succ };
}

function chooseOption(i){
  const ev=G.curEvent;
  if(!ev) return;
  const r=applyOption(ev,i);
  if(!r) return;
  G.curEvent=null;
  G.lastResult={ title:ev.name, text:r.res.t };
  G.mode='result';
  save();
  render();
}

function clampState(){
  stoneSet(G,Math.max(0,G.stones),'事件与修行');
  G.cult=Math.max(0,G.cult);
  G.karma=Math.max(0,G.karma);
  for(const k of ['gen','wu','qi','xin']) G.attr[k]=Math.max(1,Math.min(12,G.attr[k]));
  G.lifespan=Math.max(G.age,G.lifespan);
}

/* =========================================================
   闭关
   ========================================================= */
function retreatMax(){ return Math.floor(G.lifespan*CFG.retreatMaxPct); }

function retreatEfficiency(){
  // 大境界内共享递减；连续行走满一年后，yearTurn 会将 rtCount 归零。
  const used=G.rtCount||0;
  const base=Math.max(CFG.decayFloor, 1-CFG.decayPerUse*used);
  // 设定总表：心魔使后续闭关效率 -20%，直到事件中化解。
  return base * (G.flag && G.flag.heartDemon ? 0.8 : 1);
}

   地 图
   ---------------------------------------------------------
   三层，全挂在这一屏（由「去哪…」里一个「看地图」进来）：
   ① 脚下——县内六点八路，去过实、没去过虚，点一下就走。
     这一张是「已知图」：只画去过与听过的，不画没听过的。
   ② 凡界——九州三朝九灵眼，全貌图，只给轮廓与远方。
   ③ 灵界——五域四十宗门，全貌图，结丹渡界前只是传闻里的词。

 Object.keys(WORLD['灵界'].states).forEach(k=>{const s=WORLD['灵界'].states[k],p=coords[k];content+=atlasMarker(p[0],p[1],s.name,s.terrain+' · 八大宗门',{attr:'data-state="'+k+'"',cls:'mapstate',kind:k==='中州'?'temple':k==='南疆'?'leaf':'mountain',width:176});});
 return atlasFrame('spirit','灵界 · 五域','须弥山为枢 / 四十宗门，四十七洞天',content)+realmStrip()+'<div class="mapnote">北原寒地、西漠沙海、中州须弥、东荒荒古、南疆密林。结丹后开放图册查阅；跨界与洞天行程仍须后续玩法接入。</div>';
}
function eyeNetSvg(){
 const cx=500,cy=360,R=213,ring=EYES.filter(e=>e.name!=='空关');let content='';
 content+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#f7f8e4" fill-opacity=".55" stroke="#b9c89e" stroke-width="1" stroke-dasharray="3 7"/><circle cx="'+cx+'" cy="'+cy+'" r="150" fill="#f7f8e4" fill-opacity=".3" stroke="#c6d1ae" stroke-width="1"/>';
 ring.forEach((e,i)=>{const angle=(-90+i*45)*Math.PI/180,x=cx+R*Math.cos(angle),y=cy+R*Math.sin(angle);content+='<path d="M'+cx+' '+(cy+35)+' Q'+((x+cx)/2)+' '+((y+cy)/2)+' '+x+' '+(y+35)+'" class="atlas-route"/>';content+=atlasMarker(x,y,e.name,e.state+'州 · '+(e.own==='共管'?'万宝楼共管':'道统镇守'),{width:146,kind:'gate'});});
 content+=atlasMarker(cx,cy,'须弥山','三界枢纽',{width:150,kind:'temple',current:true,cls:'is-current'});
 content+=atlasMarker(800,118,'空关','无主 · 偷渡险途',{width:150,kind:'gate',cls:'is-locked'});
 return atlasFrame('spirit','九灵眼 · 渡界网','七道统镇守 / 一处共管，一处无主',content,750)+'<div class="mapnote">灵眼是渡界关隘，连线只示意关系。空关无主，是偷渡之门，也是杀局之地；具体跨界行程尚未开放。</div>';
}

/* 三级下钻：界 → 州/域 → 县。地图取代「去哪」，点地方就走。
   默认停在第三层（县内，可走）；往上能看到州、界——那是「远方」，随境界才走得上去。 */
let mapNav = { level:'local', world:'凡界', state:atlasRegion().stateKey };

function openMap(){
  mapNav = { level:'local', world:'凡界', state:atlasRegion().stateKey };
  showMap();
}

function showMap(){
  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  /* 面包屑：凡界 › 青州 › 青石县。点上层回退。 */
  const crumb = [
    mapNav.world==='灵界' ? '灵界' : mapNav.world==='渡界' ? '九灵眼渡界网' : '凡界',
    mapNav.world==='灵界' ? (mapNav.level==='界'?'':mapNav.state) : (mapNav.level==='界'?'':((WORLD['凡界'].states[mapNav.state]||WORLD['凡界'].states['青']).name)),
    mapNav.level==='local' ? atlasRegion().county : ''
  ].filter(Boolean);
  const crumbHtml = crumb.map((c,i)=>{
    const isLast = i===crumb.length-1;
    return isLast ? '<span class="on">'+c+'</span>' : '<a href="#" data-crumb="'+i+'">'+c+'</a>';
  }).join('<span class="sep">›</span>');
  ov.classList.add('map-overlay');
  md.classList.add('map-page');
  const near=(ROUTES||[]).filter(r=>r.a===(G.place||'village')||r.b===(G.place||'village')).length;
  md.innerHTML='<div class="map-page-head"><div class="map-heading"><span class="vermilion-seal">仙途图志</span><div><h3>山 河 图 志</h3><p>一县烟火，九州山河。行至何处，便识何处。</p></div></div><button class="map-page-close" id="mapClose">返回修行</button></div>'+ 
    '<div class="map-statusbar"><div><small>当前所在</small><b>'+placeName(G.place||'village')+'</b></div><div><small>当前境界</small><b>'+curRealmTxt()+'</b></div><div><small>年岁</small><b>'+G.age+' 岁</b></div><div><small>可走相邻路段</small><b>'+near+' 条</b></div></div>'+ 
    '<div class="map-topline"><div class="mapcrumb">'+crumbHtml+'</div><div class="map-layers" aria-label="地图层级"><button data-map-level="local" class="'+(mapNav.level==='local'?'active':'')+'">县内</button><button data-map-level="state" class="'+(mapNav.level==='state'?'active':'')+'">州域</button><button data-map-level="界" class="'+(mapNav.level==='界'?'active':'')+'">世界</button></div></div>'+ 
    '<div class="mapwrap" id="mapBody"></div>'+ 
    '<div class="map-dock"><div class="map-dock-current"><small>当前落脚处</small><b>'+placeName(G.place||'village')+'</b><span>行程按实际路线与境界脚程结算</span></div><div class="map-dock-actions"><button class="act ghost" id="mapCloseBottom">返回</button><button class="act primary" id="mapTravelNow">查看可走路线　›</button></div></div>';
  ov.classList.remove('hidden');
  const leaveMap=()=>{ov.classList.add('hidden');ov.classList.remove('map-overlay');md.classList.remove('map-page');setNavActive('cult');render();};
  document.getElementById('mapClose').onclick=leaveMap;
  document.getElementById('mapCloseBottom').onclick=leaveMap;
  document.getElementById('mapTravelNow').onclick=()=>{ov.classList.remove('map-overlay');md.classList.remove('map-page');openTravel();};
  renderMap();
  bindAtlasControls();
  md.scrollTop=0;
  md.querySelectorAll('[data-map-level]').forEach(b=>b.onclick=()=>{const level=b.dataset.mapLevel;mapNav=level==='local'?{level:'local',world:'凡界',state:atlasRegion().stateKey}:level==='state'?{level:'state',world:mapNav.world==='灵界'?'灵界':'凡界',state:mapNav.world==='灵界'?(mapNav.state in WORLD['灵界'].states?mapNav.state:'中州'):(mapNav.state in WORLD['凡界'].states?mapNav.state:'青')}:{level:'界',world:mapNav.world,state:mapNav.state};showMap();});
  md.querySelectorAll('[data-crumb]').forEach(a=>{
    a.onclick=(e)=>{ e.preventDefault();
      const i=parseInt(a.dataset.crumb,10);
      if(i===0) mapNav={ level:'界', world:mapNav.world, state:mapNav.state };
      else if(i===1) mapNav={ level:'state', world:mapNav.world, state:mapNav.state };
      showMap();
    };
  });
}

/* 第十二批：地图境界门槛。未达结丹时灵界/渡界网保持可见但不可进入；结丹开放的是地图查看，实际跨界旅行仍需后续系统。 */
function renderMap(){
  const body=document.getElementById('mapBody');
  if(!body) return;
  if(mapNav.level==='界'){
    /* 第一层：凡界 / 灵界 / 渡界网，三张可切 */
    const view = (mapNav.world==='灵界'||mapNav.world==='渡界') ? mapNav.world : '凡界';
    body.innerHTML = view==='凡界' ? mortalMapSvg() : (view==='灵界' ? spiritMapSvg() : eyeNetSvg());
    /* 切换界 */
    const sw = document.createElement('div');
    sw.className='mapswitch';
    const canEnterSpirit = realmOf() >= 2; // 结丹及以上，才能正式进入灵界探索
    const canUseEyeNet = realmOf() >= 2;    // 九灵眼渡界网：结丹及以上开放
    sw.innerHTML = '<button class="mini'+(view==='凡界'?' on':'')+'" data-world="凡界">凡界</button>'+
                    '<button class="mini'+(view==='灵界'?' on':'')+'" data-world="灵界" '+(!canEnterSpirit?'disabled title="结丹后方可进入灵界"':'')+'>灵界'+(!canEnterSpirit?' · 未开放':'')+'</button>'+
                    '<button class="mini'+(view==='渡界'?' on':'')+'" data-world="渡界" '+(!canUseEyeNet?'disabled title="结丹后方可查阅九灵眼渡界网"':'')+'>渡界网'+(!canUseEyeNet?' · 未开放':'')+'</button>';
    body.appendChild(sw);
    const gateNote=document.createElement('div');
    gateNote.className='mapnote';
    gateNote.textContent=realmOf()<1?'当前为炼气境：可查看凡界地图，筑基后开启跨域探索。':realmOf()<2?'已入筑基：可查看凡界区域；结丹后方可进入灵界、查阅九灵眼渡界网。':'境界已达结丹：灵界与九灵眼渡界网已开放查看，具体跨界行程仍需后续玩法接入。';
    body.appendChild(gateNote);
    sw.querySelectorAll('[data-world]').forEach(b=>{
      b.onclick=()=>{ if(b.disabled) return; mapNav.world=b.dataset.world; showMap(); };
    });
    /* 点州下钻（第二层） */
    body.querySelectorAll('.mapstate[data-state]').forEach(n=>{
      n.onclick=()=>{ mapNav={ level:'state', world:mapNav.world, state:n.dataset.state }; showMap(); };
    });
    return;
  }
  if(mapNav.level==='state'){
    /* 第二层：州/域，看到府城县城山 */
    body.innerHTML = stateMapSvg(mapNav.world, mapNav.state);
    body.querySelectorAll('.mapstate[data-state]').forEach(n=>{
      n.onclick=()=>{ mapNav.state=n.dataset.state; showMap(); };
    });
    /* 点「你的县」下钻到第三层 */
    body.querySelectorAll('.maplocal').forEach(n=>{
      n.onclick=()=>{ mapNav={ level:'local', world:mapNav.world, state:mapNav.state }; showMap(); };
    });
    return;
  }
  /* 第三层：脚下县内，点地方就走。没去过的先「听说」，去过的直接走。 */
  body.innerHTML=localMapSvg();
  body.querySelectorAll('.mapnode[data-to]').forEach(n=>{
    n.onclick=()=>{
      const to=n.dataset.to;
      if(!placeAvailable(to)){ showPlaceLocked(to); return; }
      const been=!!(G.been&&G.been[to]);
      const leg=routeOf(G.place||'village',to);
      if(!leg || !routeAvailable(leg)){ openTravel(to); return; }
      if(been){ ovHide(); departTo(to); }
      else openTravel(to);           // 没去过：先听路况凶险，再决定去不去
    };
  });
}

/* 第二层：州/域视图。青州做实，其余留名（远方轮廓）。 */
function showPlaceLocked(key){
  const p=PLACES[key]; if(!p) return;
  document.getElementById('overlay').classList.remove('map-overlay'); document.getElementById('modal').classList.remove('map-page');
  const need=REALMS[p.needRealm||0]?.name||'更高境界';
  const md=document.getElementById('modal');
  const ov=document.getElementById('overlay');
  md.innerHTML='<h3>前路未开</h3><div class="sub">'+p.name+'：'+(p.note||'前路尚远。')+'\n\n至少达到'+need+'，并找到相应道路或引荐，才能真正前往。地图上的距离不会因为境界解锁而消失。</div><div class="modal-actions"><button class="act ghost" id="lockedBack">返回地图</button></div>';
  ov.classList.remove('hidden');
  document.getElementById('lockedBack').onclick=()=>showMap();
}

function cultivationEnvironmentLabel(placeKey){
  const place=(PLACES&&PLACES[placeKey])||PLACES.village;
  const explicit={village:1.30,county:1.00,cliff:2.00};
  const mul=Number.isFinite(explicit[placeKey])?explicit[placeKey]:Math.max(0.8,0.8+0.2*((place&&Number.isFinite(place.qi))?place.qi:1));
  const pct=Math.round((mul-1)*100);
  const gate=qiGateStatus(G);
  return {mul, text:(pct>=0?'+':'')+pct+'%', name:place?place.name:'当前地点', qi:gate.qi, qiGate:gate.gate, gateEnough:gate.enough, gateHint:gate.enough?'灵气足以支撑当前境界':'灵气不足：修为停滞，且每年损耗1%'};
}

/* 凡界全貌图：九州照世界图的方位摆——冀北、雍西北、梁西、豫中、兖中北、青东海之滨（起始地）、
   徐东南、荆中南、扬南。四周是海。点州下钻。 */
function realmStrip(){
  const stages=[
    ['炼气','一县',0],['筑基','跨域探索',1],['结丹','灵界·九灵眼',2],
    ['元婴','灵界深处',3],['化神','洞天·宗门高层',4],['渡劫','三界之外',8]
  ];
  let cur=0;
  stages.forEach((s,i)=>{ if(G.realm>=s[2]) cur=i; });
  return '<div class="mapcrumb" style="margin-top:10px">'+
    stages.map((s,i)=>
      (i?'<span class="sep">›</span>':'')+
      '<span class="'+(i===cur?'on':'')+'" style="'+(i<cur?'':'opacity:'+(i===cur?1:.45))+'">'+
      s[0]+' · '+s[1]+'</span>'
    ).join('')+'</div>';
}

/* 九灵眼·渡界网络：八方八眼拱卫，须弥山居中为枢纽，空关一处无主宰。 */
function openTravel(to){
  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  ov.classList.remove('map-overlay'); md.classList.remove('map-page');
  const here=G.place||'village';
  const allRows=ROUTES.filter(r=>r.a===here||r.b===here)
    .map(r=>({ to:(r.a===here?r.b:r.a), li:r.li, road:r.road, risk:r.risk }))
    .filter(x=>placeAvailable(x.to) && routeAvailable(routeOf(here,x.to)));
  /* 从地图点了一个没去过的地方 → 只看那一个；否则看全部相邻。 */
  const direct = to && routeOf(here,to) && routeAvailable(routeOf(here,to));
  const rows = direct ? allRows.filter(x=>x.to===to) : allRows;
  const routeHint = to && !direct ? '<div class="say">'+placeName(to)+'不与此地直接相连。修仙界路途遥远，请沿官道、山径或灵道逐站前往；每一段都会单独消耗日程并可能触发途中事件。</div>' : '';

  let html='<h3>听 说</h3>';
  html+=routeHint;
  html+='<div class="sub">你在'+placeName(here)+'。\n'+
        '没去过的地方，你只知道路怎么走、旁人怎么说。\n'+
        '去过的地方，你才真的知道那是个什么地方。\n'+
        '<span class="mute">出门按脚程算日子；官道少事，山径多事。</span></div>';

  if(!rows.length){
    html+='<div class="sub">四面不通。</div>';
  }else{
    html+=rows.map(x=>{
      const p=PLACES[x.to];
      const been=!!(G.been&&G.been[x.to]);
      const d=travelDays(x.li);
      const head='<div class="nm">'+placeName(x.to)+
        '　<span class="tag">'+p.tier+'</span>'+
        (been?'　<span class="tag">去过</span>':'')+'</div>';
      const road='<div class="meta">'+
        (been ? (d+' 日 · '+x.li+' 里') : ('约 '+d+' 日 · 距离 '+x.li+' 里'))+
        ' · '+x.road+' · '+riskWord(x.risk)+
        '　<span class="dim">'+
          (been ? ('灵气 '+p.qi.toFixed(2)+' · '+(p.pop?('凡人 '+p.pop):'无人烟')+' · 修士 '+p.cult)
                : '没去过')+
        '</span></div>';
      const say = been ? '' :
        '<div class="say">据说——'+(HEAR[x.to]||p.note.split('。')[0]+'。')+'</div>';
      /* 打听来的事挂在这儿。这不是「此地」——是「那边此刻正有事」，一个期限，一个方向。 */
      const kn=(G.know||{})[x.to];
      const ka=kn ? liveAt(x.to).find(a=>a.id===kn.id) : null;
      const news = ka
        ? '<div class="say news">听说「'+liveName(ka.id)+'」还没了——还剩 '+liveLeft(ka)+' 月。</div>'
        : '';
      return '<div class="slot">'+
        '<div class="info">'+head+road+say+news+'</div>'+
        '<div class="ops"><button class="mini" data-to="'+x.to+'">'+
          (been?'去':'去看看')+'</button></div>'+
      '</div>';
    }).join('');
  }

  html+='<div class="modal-actions">'+
    '<button class="act ghost" id="tvMap">返回地图</button>'+
    '<button class="act ghost" id="tvCancel">不去了</button></div>';
  md.innerHTML=html;
  ov.classList.remove('hidden');

  md.querySelectorAll('[data-to]').forEach(b=>{
    b.onclick=()=>{
      ov.classList.add('hidden');
      departTo(b.dataset.to);
    };
  });
  document.getElementById('tvMap').onclick=()=>showMap();
  document.getElementById('tvCancel').onclick=()=>ov.classList.add('hidden');
}

/* =========================================================
   出门：一趟一事
   ---------------------------------------------------------
   路不是背景，是这一趟要冒的险。
   risk 越大、路越长，越容易在半路碰上事；碰上了就先把事
   了结，再接着走——或者折回去。
   ========================================================= */

/* 每一日的遇事概率：官道 3%，常有人迹 7%，山径 12%。
   封顶 0.55——再长的路，也不该必然出事。 */
const ROAD_RATE = [0.03, 0.07, 0.12];

function tryRoadEvent(risk, days, from, to){
  if(!ROAD_EVENTS.length) return null;
  const per=ROAD_RATE[Math.max(0,Math.min(2,risk|0))];
  const dest=PLACES[to||'']||{};
  const origin=PLACES[from||G.place||'']||{};
  /* 先按原设定的路况与天数抽是否遇事；人口、修士密度只改变事件类型，不凭空抬高总遭遇率。 */
  if(Math.random() > Math.min(0.55, per*Math.max(1,days))) return null;
  const pool=ROAD_EVENTS.filter(e=>{
    if(e.cond && !e.cond(G)) return false;
    if(e.once && G.eventsDone[e.id]) return false;
    const cd=G.evtCd[e.id];
    if(cd && G.age<cd) return false;
    return true;
  });
  if(!pool.length) return null;
  return weightedPick(pool,e=>{
    let w=e.w||8;
    const name=(e.name||'');
    const urban=Math.max(origin.pop||0,dest.pop||0);
    const cultivators=Math.max(origin.cult||0,dest.cult||0);
    const wilderness=(!origin.pop&&!dest.pop) || origin.tier==='野地' || dest.tier==='野地';
    /* 商旅、消息更容易出现在人多的路段；劫道、妖兽、遗物更容易出现在荒野。
       不改原事件文本与基础权重，只在地点生态上做轻量修正。 */
    if(/骡队|商队|同路|行商|消息/.test(name)) w*=urban>=10000?1.65:(urban>=1000?1.25:0.8);
    if(/劫|妖|尸首|遗物|断刃|山/.test(name)) w*=wilderness?1.45:0.9;
    if(/修士|灵材|坊市|宗门/.test(name)) w*=cultivators>=100?1.35:(cultivators>=20?1.12:0.85);
    return Math.max(0.1,w);
  });
}

/* 只认相邻两点——路网就是这么画的，绕路不在这一版里。 */
function routeOf(a,b){
  return ROUTES.find(r=>(r.a===a&&r.b===b)||(r.b===a&&r.a===b));
}

/* 出门。先看路上有没有事，有就停在半路。 */
function departTo(to){
  const from=G.place||'village';
  const row=routeOf(from,to);
  if(!row || !routeAvailable(row)){ addLog('　此路尚未开通，或你的境界还不足以抵达。','dn'); render(); return; }
  const days=travelDays(row.li);
  const risk=row?row.risk:1;
  const ev=tryRoadEvent(risk,days,from,to);
  if(ev){
    G.road={ from:from, to:to, days:days, extra:0, cancel:false };
    startEvent(ev);
    return;
  }
  arriveAt(from,to,days);
}

/* 到了。日子在这一刻一次结清——路上涨的修为、跨过的年，都在里面。 */
function arriveAt(from,to,days){
  const first=!(G.been&&G.been[to]);
  G.mode='idle';
  const mv=advanceDays(days,{act:'travel',rate:CFG.walkRate},{stopOnEvent:true});
  if(mv.died){G.road=null;ovHide();die('寿元耗尽');return;}
  if(mv.event){
    G.road={from,to,days:Math.max(0,days-mv.days),extra:0,cancel:false};
    save();startEvent(mv.event);return;
  }
  G.place=to;G.spot=null;G.been=G.been||{};G.been[to]=1;
  addLog('　从'+placeName(from)+'抵达'+placeName(to)+'，路上走了 '+mv.days+' 日。','mute');
  if(first)addLog('　'+placeName(to)+'，你头一回来。','mute');
  checkMissed(to);save();render();
}

/* 路上那件事了了：接着走，或者折回原处。
   折回按走了半程算——路已经走了一半，回头也要一半。 */
function finishRoad(){
  const r=G.road;
  G.road=null;
  if(!r){ G.mode='idle'; render(); return; }
  if(r.cancel){
    const back=Math.max(1,Math.ceil(r.days/2));
    G.mode='idle';
    const mv=advanceDays(back,{act:'walk'},{stopOnEvent:true});
    addLog('　你折回'+placeName(r.from)+'。这一趟白走，耗去 '+back+' 日。','mute');
    save();
    if(mv.died){ die('寿元耗尽'); return; }
    if(mv.event){ startEvent(mv.event); return; }
    render(); return;
  }
  arriveAt(r.from, r.to, r.days+(r.extra||0));
}

/* =========================================================
   此 地
   「听说」答的是别处有什么；这一屏答的是脚下是什么。
   三个动作各耗一月——月从这里开始有花处。
   ========================================================= */
function localsAt(k){ k=k||G.place; return NPCS.filter(n=>n.place===k); }

/* 分区里的人：人落在一处，不是整片地儿匀着摆。站在哪一处，才见得到哪一处的人。
   别的分区的人不会消失——你得挪过去才碰得上。这就是「找」，不是把名单换个格子。 */
function spotNpcs(k, spot){
  const all=localsAt(k);
  if(!spot) return all;                      // 旧档没站到任何一处，就还看整片的人
  return all.filter(n=>!n.spot || n.spot===spot);
}

/* 分区里的事：事也落在一处。你站在这一处，只看得见这一处正在发生的事。 */
function eventSpotOf(a){
  const e=EVENTS.find(x=>x.id===a.id);
  return e ? e.spot : null;
}

/* 这地方够修到哪一境。低于门槛修为不增还要倒扣，所以必须当面说清。 */
function qiVerdict(q){
  if(q>=QI_GATE['结丹']) return '够结丹';
  if(q>=QI_GATE['筑基']) return '够筑基';
  if(q>=QI_GATE['炼气']) return '只够炼气';
  return '不够修行';
}

function npcRealm(n){
  if(n.realm==='凡人') return '凡人';
  if(n.stage) return n.realm+n.stage;
  return n.realm+(n.layer?CN_NUM[n.layer]+'层':'');
}

/* 采药只认「有草的地方」与「灵田」。城里没有。 */
function placeHas(p, capability){ return !!p && (p.facilities||[]).includes(capability); }
function canHerbAt(p){ return placeHas(p,'gather'); }
function canWorkAt(p){ return placeHas(p,'work'); }
function canTradeAt(p){ return placeHas(p,'trade'); }

function ovHide(){ const ov=document.getElementById('overlay'), md=document.getElementById('modal'); const wasMap=ov.classList.contains('map-overlay')||md.classList.contains('map-page'); ov.classList.add('hidden'); ov.classList.remove('map-overlay'); md.classList.remove('map-page'); if(wasMap) setNavActive('cult'); }

/* 做完一件事的统一收尾：死了就死，遇事就停，否则回到此地。 */
function afterAct(r){
  if(r.died){ ovHide();die('寿元耗尽'); return; }
  if(r.event){ ovHide();save();startEvent(r.event); return; }
  /* 你在这儿做了一月事，才看得见这儿正在发生什么。这一句是「找事」的真正入口。 */
  const lv=meetLive(G.place||'village');
  save();
  if(lv){ startEvent(lv); return; }
  render(); openHere();
}

/* --- 赴事：放下手里的事，专门去看一眼。耗一月，必碰得上——
       前提是这一月里它还没散。事不长，两三个月，你只能挑一件。 --- */
function actChase(id){
  if(!systemReady())return;
  const k=G.place||'village';
  if(!(G.live[k]||[]).some(x=>x.id===id)) return;
  const e=EVENTS.find(x=>x.id===id);
  if(!e) return;
  ovHide();
  const r=advanceMonths(1,{act:'chase',rate:0,incomeMul:0},{stopOnEvent:true});
  addLog('　你放下手里的事，去看「'+e.name+'」。','mute');
  if(r.died){ die('寿元耗尽'); return; }
  if(r.event){ save(); startEvent(r.event); return; }   // 这一个月里先撞上别的，事还挂着
  if(!(G.live[k]||[]).some(x=>x.id===id)){
    addLog('　等你腾出手，事已经了了。','dn');         // 就这一月之差
    save(); render(); openHere(); return;
  }
  G.live[k]=(G.live[k]||[]).filter(x=>x.id!==id);
  save();
  startEvent(e);
}

/* 地点生态不是装饰文案：同一套分类同时供探索提示与采药产出使用。
   不把局部地点数相加冒充全县/全界人口；PLACES 是当前可交互地点样本。 */
function placeEcology(p){
  const qi=Number(p.qi)||0, pop=Number(p.pop)||0, cult=Number(p.cult)||0;
  if(p.tier==='秘境') return {label:'封闭遗址',detail:'入口与开放期受世事影响；灵气不等于安全，进入前先确认境界门槛。'};
  if(p.tier==='宗门'||p.tier==='山门') return {label:'灵脉与传承',detail:'修士与资源集中，适合寻师、求法、接宗门差事；没有引荐时不代表能进入内门。'};
  if(p.tier==='野地') return {label:qi>=1.6?'高灵气荒野':'荒野采集地',detail:'凡人稀少，采集机会与风险并存；路上遇到的更可能是危险、遗物或独行修士。'};
  if(pop>=10000) return {label:'人口与交易中心',detail:'人多、消息和营生机会较多，但人气聚集不代表灵气浓；修行仍按此地灵气与境界门槛结算。'};
  if(cult>=100) return {label:'修士聚集地',detail:'修士密度高于普通城镇，交易、委托与修行消息更集中；灵气浓度仍以地点数值为准。'};
  if(qi>=1.5) return {label:'灵气较厚',detail:'灵气高于村野基准，适合满足门槛的修行与灵材采集；高灵气不会取消地点风险。'};
  if(pop>0) return {label:'小型聚落',detail:'凡人生活与零散消息为主；可交易的种类、修士数量与灵气浓度各自独立计算。'};
  return {label:'人迹稀少',detail:'缺少稳定市集与人口支撑；主要依赖采集、探索与路途遭遇。'};
}

function openHere(){
  if(!G || G.mode!=='idle') return;
  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  const k=G.place||'village';
  const p=PLACES[k]||PLACES.village;
  const heard=G.heard||{};
  const rumors=p.rumor||[];
  const leftAsk=rumors.filter((t,i)=>!heard['p:'+k+':'+i]).length;
  const liveAll=liveAt(k);
  const gone=(G.gone||{})[k]||[];
  /* 分区：人和事都落在一处。你站哪一处，就见哪一处的人和事；
     其余分区的还在原地，只是得你挪过去才碰得上。 */
  const subs=p.sub||[];
  /* cur=null 表示「还没站定哪一处」，整片看；点了一个分区，才收窄到那一处。 */
  const cur=(subs.length && G.spot && subs.indexOf(G.spot)>=0) ? G.spot : null;
  const ppl=spotNpcs(k, cur);
  const live=cur ? liveAll.filter(a=>{
    const sp=eventSpotOf(a);
    return !sp || sp===cur;               // 没挂分区的（any/随身），仍处处可见
  }) : liveAll;
  /* 打听能听到的不只是本地旧话，还有邻处此刻正在发生的事。
     后者才是「要不要走一趟」的依据——所以本地话问完了，也未必问不出东西。 */
  const farNews=[];
  neighborsOf(k).forEach(n=>liveAt(n.to).forEach(a=>{
    if(!isHomeEvent(a.id)) farNews.push({place:n.to,id:a.id});
  }));
  const canAsk = leftAsk>0 || farNews.length>0;

  let html='<h3>此 地</h3>';
  html+='<div class="sub">'+placeName(k)+'　[ '+p.tier+' ]\n'+p.note+'</div>';

  html+='<div class="stats">'+
    '<div><b>灵气</b>'+p.qi.toFixed(2)+'　'+qiVerdict(p.qi)+'</div>'+
    '<div><b>凡人</b>'+(p.pop||'—')+'</div>'+
    '<div><b>修士</b>'+p.cult+'</div>'+
    '<div><b>这里产</b>'+((p.goods||[]).join('·')||'—')+'</div>'+
  '</div>';
  const ecology=placeEcology(p);
  html+='<div class="sub ecology"><b>地势与人气</b>　'+ecology.label+'<br>'+ecology.detail+'</div>';

  /* 分区：这个地点的内部结构（放置江湖式）。点一个，站到那一处；
     人和事落在分区里，才知道该去哪一处找。 */
  if(subs.length){
    html+='<div class="sect">这 一 处</div>';
    html+='<div class="spots">'+subs.map(s=>{
      const npcN=localsAt(k).filter(n=>!n.spot||n.spot===s).length;
      const evN=liveAll.filter(a=>{const sp=eventSpotOf(a); return !sp||sp===s;}).length;
      const tag=(npcN?'人×'+npcN:'')+(evN?'　事×'+evN:'');
      return '<button class="mini spot'+(s===cur?' on':'')+'" data-spot="'+s+'" title="'+tag+'">'+s+
        (tag?'<span class="spottag">'+tag+'</span>':'')+'</button>';
    }).join('')+'</div>';
    html+='<div class="sub spotnote">'+(cur?('你在「'+cur+'」。'):'你刚到这里，还没站定——点上面一处，落脚去看。')+'</div>';
  }


  /* 世上正在发生的事。它不为你而来，也不会等你——所以先给它一块地方。
     落在分区里的，你站在这处才看得见；落在别处的，得挪过去。 */
  if(live.length){
    html+='<div class="sect">'+(cur?'这 一 处 正 在 发 生':'这 里 正 在 发 生')+
      (cur&&live.length<liveAll.length?'<span class="dim">（另有 '+(liveAll.length-live.length)+' 桩在别处）</span>':'')+'</div>';
    html+=live.map(a=>{
      const left=liveLeft(a);
      return '<div class="slot"><div class="info">'+
        '<div class="nm">「'+liveName(a.id)+'」</div>'+
        '<div class="meta">还没了结<span class="dim">　还剩 '+left+' 月</span></div>'+
      '</div><div class="ops">'+
        '<button class="mini" data-chase="'+a.id+'">去看</button></div></div>';
    }).join('');
  } else if(cur && liveAll.length){
    html+='<div class="sect">这 一 处 正 在 发 生</div>'+
      '<div class="sub" style="margin-bottom:0">这一处眼下没事。'+(liveAll.length?('另有 '+liveAll.length+' 桩落在别处——点上面的地方，挪过去看看。'):'')+'</div>';
  }
  if(!live.length && gone.length){
    html+='<div class="sect">前 些 日 子</div>';
    html+=gone.map(g=>'<div class="saying done">· 「'+g.name+'」——你到时，已经了了。</div>').join('');
  }

  html+='<div class="sect">能 做 的 事</div>';
  html+='<div class="slot"><div class="info">'+
    '<div class="nm">打 听</div>'+
    '<div class="meta">耗一月 · 坐在人堆里听，听这一带，也听邻处'+
      '<span class="dim">　'+(canAsk?(leftAsk?('还剩 '+leftAsk+' 条旧话'):'本地话问尽了，邻处还有事'):'问不出新的了')+'</span></div>'+
    '</div><div class="ops">'+
    '<button class="mini" data-act="ask"'+(canAsk?'':' disabled')+'>去问</button></div></div>';

  const hb=canHerbAt(p);
  html+='<div class="slot"><div class="info">'+
    '<div class="nm">采 药</div>'+
    '<div class="meta">耗一月 · 进山采一月，背下山换钱'+
      '<span class="dim">　'+(hb?('灵气 '+p.qi.toFixed(2)+'，出产看天'):'此地无药可采')+'</span></div>'+
    '</div><div class="ops">'+
    '<button class="mini" data-act="herb"'+(hb?'':' disabled')+'>去采</button></div></div>';

  const wb=canWorkAt(p);
  html+='<div class="slot"><div class="info">'+
    '<div class="nm">营 生</div>'+
    '<div class="meta">耗一月 · 在市井里卖力气、跑腿、抄写，换钱'+
      '<span class="dim">　'+(wb?'只赚灵石，不涨修为':'此地无市可营')+'</span></div>'+
    '</div><div class="ops">'+
    '<button class="mini" data-act="work"'+(wb?'':' disabled')+'>去做</button></div></div>';

  /* 家。不另开一屏——就摆在「这一带的人」前头。
     你在家处才见得到活着的家人；不在，家里的事只剩一道痕。 */
  const home=G.home||k;
  const atHome=(k===home);
  const fam=G.family||[];
  const famLive=atHome?fam.filter(f=>f.alive):[];
  const famDead=atHome?fam.filter(f=>!f.alive):[];
  if(fam.length){
    html+='<div class="sect">家'+(famLive.length?('（'+famLive.length+'）'):'')+'</div>';
    if(!atHome){
      html+='<div class="sub" style="margin-bottom:0">你的家不在这里。要见他们，得回'+placeName(home)+'。</div>';
    }else if(!famLive.length){
      html+='<div class="sub" style="margin-bottom:0">家里没有人了。</div>';
    }
    html+=famLive.map(f=>{
      const st=(G.met||{})[f.id]||0;
      const note = st>=2 ? '<span class="dim">　话已说尽</span>'
                 : st===1 ? '<span class="dim">　你听过他说的了</span>' : '';
      const btn = st>=2 ? '<button class="mini" disabled>已尽</button>'
                        : '<button class="mini" data-visit="'+f.id+'">访</button>';
      return '<div class="slot"><div class="info">'+
        '<div class="nm">'+personName(f)+'　<span class="tag dull">'+npcRealm(f)+'</span>'+
          (f.rel?'<span class="dim" style="letter-spacing:.02em">　'+fillFate(f.rel)+'</span>':'')+'</div>'+
        '<div class="meta">'+fillFate(f.look)+note+'</div>'+
      '</div><div class="ops">'+btn+'</div></div>';
    }).join('');
    if(atHome && famDead.length){
      html+='<div class="sect">牌 位</div>';
      html+=famDead.map(f=>'<div class="saying done">· '+personName(f)+'——'+fillFate(f.how||'已经去了。')+'</div>').join('');
    }
  }

  const totalPpl=localsAt(k).length;
  html+='<div class="sect">'+(cur?('这 一 处 的 人'):'这 一 带 的 人')+(ppl.length?('（'+ppl.length+(cur&&ppl.length<totalPpl?'/'+totalPpl:'')+'）'):'')+'</div>';
  if(!ppl.length){
    html+='<div class="sub" style="margin-bottom:0">'+(cur?'这一处没有谁。'+(totalPpl?'人都在别处——点上面的地方，挪过去才碰得上。':'这一带只有草、石头和风。'):'没有谁。这一带只有草、石头和风。')+'</div>';
  }else{
    html+=ppl.map(n=>{
      const st=(G.met||{})[n.id]||0;
      const note = st>=2 ? '<span class="dim">　话已说尽</span>'
                 : st===1 ? '<span class="dim">　你听过他说的了</span>' : '';
      const btn = st>=2 ? '<button class="mini" disabled>已尽</button>'
                        : '<button class="mini" data-visit="'+n.id+'">访</button>';
      return '<div class="slot"><div class="info">'+
        '<div class="nm">'+fillFate(n.name)+'　<span class="tag dull">'+npcRealm(n)+'</span>'+
          '<span class="dim" style="letter-spacing:.02em">　'+n.title+'</span></div>'+
        '<div class="meta">'+fillFate(n.look)+note+'</div>'+
      '</div><div class="ops">'+btn+'</div></div>';
    }).join('');
  }

  html+='<div class="sect">这 里 在 传</div>';
  if(!rumors.length){
    html+='<div class="sub" style="margin-bottom:0">没有风声。</div>';
  }else{
    html+=rumors.map((t,i)=>'<div class="saying'+(heard['p:'+k+':'+i]?' done':'')+'">· '+t+'</div>').join('');
    html+='<div class="sub" style="margin:8px 0 0"><span class="mute">暗下去的是已经听过的。</span></div>';
  }

  html+='<div class="modal-actions"><button class="act ghost" id="hereClose">收 起</button></div>';
  md.innerHTML=html;
  ov.classList.remove('hidden');

  md.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.act==='ask') actAsk();
      else if(b.dataset.act==='herb') actHerb();
      else if(b.dataset.act==='work') actWork();
    };
  });
  md.querySelectorAll('[data-visit]').forEach(b=>{
    b.onclick=()=>actVisit(b.dataset.visit);
  });
  md.querySelectorAll('[data-chase]').forEach(b=>{
    b.onclick=()=>actChase(b.dataset.chase);
  });
  md.querySelectorAll('[data-spot]').forEach(b=>{
    b.onclick=()=>{ G.spot=b.dataset.spot; openHere(); };
  });
  document.getElementById('hereClose').onclick=ovHide;
}

/* --- 打听：耗一月，换一条话，外加邻处的动静。
       本地旧话问完就问完了；邻处的事却天天在换——所以这一项不会真的「问不出」。 --- */
function actAsk(){
  if(!systemReady())return;
  const k=G.place||'village';
  const p=PLACES[k]||PLACES.village;
  G.heard=G.heard||{};
  const cands=(p.rumor||[]).map((t,i)=>({ i:i, t:t }))
                           .filter(x=>!G.heard['p:'+k+':'+x.i]);
  ovHide();
  const r=advanceMonths(1,{act:'ask',rate:0,incomeMul:0},{stopOnEvent:true});
  if(r.died || r.event || r.days<CFG.daysPerMonth){afterAct(r);return;}
  addLog('　你在'+placeName(k)+'盘桓一月。','mute');
  /* 话要在走动之后才取。先取再走，月末世上散了一桩，你还照着旧账说「还剩两月」——
     那就成了假话。听说的规矩只是「不全」，从来不许「不真」。 */
  const news=[];
  neighborsOf(k).forEach(n=>{
    liveAt(n.to).forEach(a=>{
      if(isHomeEvent(a.id)) return;
      news.push({ place:n.to, id:a.id, name:liveName(a.id), left:liveLeft(a) });
    });
  });
  if(news.length){
    const n=pick(news);
    G.know=G.know||{};
    G.know[n.place]={ id:n.id, at:absMonth() };
    addLog('　听说'+placeName(n.place)+'那边出了事：「'+n.name+'」，还剩 '+n.left+' 月。','');
  }
  if(cands.length){
    const c=pick(cands);
    G.heard['p:'+k+':'+c.i]=true;
    addLog('　'+(news.length?'又听见一句：':'听见一句：')+c.t+'。','');
  }
  if(!news.length && !cands.length) addLog('　问了一圈，都是旧话。','mute');
  afterAct(r);
}

/* --- 采药：耗一月，按此地灵气出产。修为只给行走的四成。 --- */
function actHerb(){
  if(!systemReady())return;
  const k=G.place||'village';
  const p=PLACES[k]||PLACES.village;
  if(!canHerbAt(p)){ toast('此地无药可采'); return; }
  ovHide();
  const r=advanceMonths(1,{act:'herb',rate:CFG.walkRate*0.4,incomeMul:0},{stopOnEvent:true});
  if(r.died || r.event || r.days<CFG.daysPerMonth){afterAct(r);return;}
  const q=p.qi;
  addLog('　你在'+placeName(k)+'一带采了一月药。','mute');
  /* 灵气影响药材品质；已有修士会竞争采集点，人口稀少处则更难找到稳定销路。
     这是地点层面的轻量修正，不改变世界总量，也不把修士存量当成每月刷新资源。 */
  const competition=Math.min(0.12,(Number(p.cult)||0)/2000);
  const miss=Math.max(0.08, Math.min(0.62, 0.42-q*0.15+competition));
  let got=0;
  if(Math.random()<miss){
    addLog('　转了一月，背回来的只够抵鞋钱。'+(competition>0.04?'这片地方常有人采，能找到的药也少了。':''),'mute');
  }else{
    const n=ri(1,3);
    const per=Math.round((1+q*1.6)*economyFactor());
    /* 灵气厚的地方，偶尔能碰上一株值钱的；人烟稀少的野地更有机会，但风险也在。 */
    const extra = (q>=1.4 && Math.random()<(p.tier==='野地'?0.10:0.06)) ? Math.round(ri(25,40)*economyFactor()) : 0;
    got=n*per+extra;
    stoneChange(G,got,'事件与修行');
    addLog('　得药 '+n+' 味'+(extra?('，另有一株少见的，单卖了 '+extra):'')+
           '，共换 '+got+' 灵石。','up');
  }
  if(p.tier==='野地' && Math.random()<0.12){
    const loss=Math.min(G.stones, Math.max(3, Math.round(got*0.6)));
    if(loss>0){
      stoneChange(G,-(loss),'事件与修行');
      addLog('　下山撞见一伙人，丢下 '+loss+' 灵石才脱身。','dn');
    }
  }
  afterAct(r);
}

/* --- 营生：耗一月，只在交易场（城/市）。拿时间换钱，修为分文不涨。
       这是「城市是交易场」的落地——进城修炼慢三成，但进城能营生。 --- */
function actWork(){
  if(!systemReady())return;
  const k=G.place||'village';
  const p=PLACES[k]||PLACES.village;
  if(!canWorkAt(p)){ toast('此地无市可营'); return; }
  ovHide();
  const r=advanceMonths(1,{act:'work',rate:0,incomeMul:0},{stopOnEvent:true});
  if(r.died || r.event || r.days<CFG.daysPerMonth){afterAct(r);return;}
  /* 城里的活计比坊市稳、给得也多：城 10–15，市 8–12。 */
  const city=p.tier==='城'||p.tier==='府城';
  const lo = city ? 10 : 8;
  const hi = city ? 15 : 12;
  /* 人口多的城里活计稳定但竞争也大；小坊市单笔收入略低，不按修士数量凭空涨薪。 */
  let got=ri(lo,hi);
  if(city && (p.pop||0)>=50000 && Math.random()<0.18) got+=2;
  if((p.tier==='市'||p.tier==='大型坊市') && (p.cult||0)>=100 && Math.random()<0.12) got+=2;
  got=Math.round(got*economyFactor());
  stoneChange(G,got,'事件与修行');
  addLog('　你在'+placeName(k)+'卖了一月力气，到手 '+got+' 灵石。修为，却分毫未动。','up');
  afterAct(r);
}

/* --- 拜访：第一次听他知道什么，第二次听他要什么。 --- */
function actVisit(id){
  if(!systemReady())return;
  const n=NPCS.filter(x=>x.id===id)[0] || (G.family||[]).filter(x=>x.id===id)[0];
  if(!n) return;
  G.met=G.met||{};
  const st=G.met[id]||0;
  ovHide();
  const r=advanceMonths(1,{act:'visit',rate:0,incomeMul:0},{stopOnEvent:true});
  if(r.died || r.event || r.days<CFG.daysPerMonth){afterAct(r);return;}
  const nm=personName(n);
  addLog('　你去访'+nm+'。','mute');
  if(st===1){
    G.met[id]=2;
    addLog('　'+nm+'要的东西，你听出来了：'+fillFate(n.want)+'。','');
  }else if(st===0){

    addLog('　他说：'+fillFate(n.knows)+'。','');
  }else{
    addLog('　他没什么要说的了。','mute');
  }
  afterAct(r);
}

function openRetreat(){
  const maxY=Math.min(retreatMax(), G.lifespan-G.age-1);
  if(maxY<1){ toast('已无暇闭关'); return; }
  const eff=retreatEfficiency();
  const perYear=yearOutput()*eff;
  const needNow = Math.max(0, needOf(G.layer)-G.cult);
  const sug = needNow>0 ? Math.max(4, Math.ceil(needNow/perYear)) : 6;
  let val = Math.max(1, Math.min(maxY, sug));

  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  md.innerHTML=
    '<h3>闭 关</h3>'+
    '<div class="sub">封门落锁，不问春秋。\n修为尽数入丹田——行走只得其半。\n每岁耗灵石 '+currentRetreatCost()+' 枚，囊中一空，自会醒来。\n闭关效率随次数递减；连续行走满一年，可恢复全效。\n门闭得住，世道闭不住；出关时，外头已过了这些年。</div>'+
    '<div class="slider-row">'+
      '<input type="range" id="rtRange" min="1" max="'+maxY+'" value="'+val+'">'+
      '<div class="slider-val" id="rtVal">'+val+' 年</div>'+
    '</div>'+
    '<div class="preview" id="rtPrev"></div>'+
    '<div class="modal-actions">'+
      '<button class="act ghost" id="rtCancel">再想想</button>'+
      '<button class="act primary" id="rtGo">入 定</button>'+
    '</div>';
  ov.classList.remove('hidden');

  const range=document.getElementById('rtRange');
  const valEl=document.getElementById('rtVal');
  const prev=document.getElementById('rtPrev');

  function upd(){
    const n=parseInt(range.value,10);
    valEl.textContent=n+' 年';
    const need=Math.max(0,needOf(G.layer)-G.cult);
    const gain=perYear*n;
    const cost=currentRetreatCost()*n;
    const short=G.stones<cost;
    let rows=[];
    rows.push('本次效率　<b>'+Math.round(eff*100)+'%</b>　（本境第 '+((G.rtCount||0)+1)+' 次闭关）');
    rows.push('效率恢复　'+((G.rtCount||0)>0?'连续行走满一年可恢复基础效率':'当前已是本境基础全效／首次闭关'));
    if(G.flag && G.flag.heartDemon) rows.push('<span class="bad">心魔影响　效率额外 ×0.8；需通过相关事件化解</span>');
    rows.push('闭关规则　单次上限 '+maxY+' 年；寿元不足10%或修为圆满时提前出关。');
    rows.push('预计修为　<b class="good">+' + Math.floor(gain).toLocaleString() + '</b>' + (need?('　/　距下一层 '+Math.floor(need).toLocaleString()):''));
    rows.push('预计消耗　<b class="'+(short?'bad':'')+'">'+cost+' 灵石</b>　现有 '+G.stones);
    rows.push('出关年龄　<b class="'+(G.age+n>G.lifespan*0.85?'bad':'amber')+'">'+(G.age+n)+' 岁</b>');
    rows.push('世道物价　<b>×'+economyFactor().toFixed(3)+'</b>　（每百年 +8%，收入与闭关年耗同步折算）');
    if(short) rows.push('<span class="bad">灵石不足，闭关将提前中断。</span>');
    prev.innerHTML=rows.join('<br>');
  }
  range.addEventListener('input',upd);
  upd();

  document.getElementById('rtCancel').onclick=()=>{ ov.classList.add('hidden'); };
  document.getElementById('rtGo').onclick=()=>{
    ov.classList.add('hidden');
    doRetreat(parseInt(range.value,10), eff);
  };
}

function doRetreat(years, eff){
  let done=0, gained=0, spent=0, shortYear=false, interrupted='';
  const wasBrim=realmBrim();
  const startLifespan=Math.max(1,G.lifespan);
  for(let i=0;i<years;i++){
    // 强制打断：寿元低于当前寿元上限的10%，不再继续闭关。
    if(G.lifespan-G.age < G.lifespan*0.10){ interrupted='寿元所剩不足一成'; break; }
    if(G.age>=G.lifespan-1) break;
    if(realmBrim()){ interrupted='修为已满'; break; }
    const annualCost=currentRetreatCost();
    const canPay=G.stones>=annualCost;
    // 资源门槛（闭关与时间表为建议稿）：足额则正常效率；不足时用剩余灵石结算一年半效，随后出关。
    const paid=canPay?annualCost:Math.max(0,G.stones);
    const actualRate=canPay?eff:eff*0.5;
    const r=tickYear({ act:'retreat', rate:actualRate, incomeMul:0,
                       cost:paid, retreat:true,
                       eventRate:(i===0?0:CFG.retreatEventRate) });
    if(r.broke){ interrupted='灵石不足'; break; }
    spent+=r.cost||0;
    if(r.died) break;
    done++; gained+=r.gain;
    if(!canPay){ shortYear=true; interrupted='灵石不足，半效结算后出关'; break; }
    if(!wasBrim && realmBrim()){ interrupted='修为已满'; break; }
    if(G.cult>=realmFullNeed()){ interrupted='修为已满'; break; }
    // 可实现的强制打断条件：寿元危险、修为已满；亲近者垂危/宗门遭袭待相应系统接入后启用。
    if(G.lifespan-G.age < G.lifespan*0.10){ interrupted='寿元所剩不足一成'; break; }
    if(r.event){
      G.rtCount=(G.rtCount||0)+1;
      addLog('闭关 '+done+' 年后被世事打断。','dn');
      startEvent(r.event);
      save();
      return;
    }
  }
  if(done>0){
    G.rtCount=(G.rtCount||0)+1;
    addLog('闭关 '+done+' 年（效率 '+Math.round(eff*100)+'%'+(shortYear?'，资源不足按半效':'')+'），修为 +'+Math.floor(gained)+'。','up');
  }

  // 出关简报：明确记录实际消耗、效率惩罚、强制打断原因和当下灵气档位。
  if(done>0){
    const brief=[];
    brief.push('你推开洞门。外面已经过了 '+done+' 年。');
    if(done>=8){
      brief.push(pick([
        '山下的村子换了名字，村口那棵老槐被雷劈了，还剩半截。',
        '当年给你指路的那个老人，坟头的草已经长到腰。',
        '坊市里多了几家新铺子，从前那家卖符纸的关了门。',
        '听说青云观换了掌门，老一辈的执事死了两个。'
      ]));
    }
    if(interrupted) brief.push('<span class="amber">提前出关：'+interrupted+'。</span>');
    if(shortYear) brief.push('<span class="bad">资源不足：最后一年效率减半，并耗尽剩余灵石。</span>');
    if(G.age>G.lifespan*0.8) brief.push('<span class="bad">你摸了摸鬓角，指腹上沾了几根白。寿元不多了。</span>');
    const gate=qiGateStatus(G);
    brief.push('出关灵气：'+gate.place+'，灵气 '+gate.qi+'（当前境界门槛 '+gate.gate+'，'+(gate.enough?'满足':'不足')+'）。');
    brief.push('当前物价倍率：×'+economyFactor().toFixed(3)+'。');
    G.lastResult={ title:'出 关', text:brief.join('\n\n')+
      '\n\n<span class="mute">修为 +'+Math.floor(gained)+'　灵石 -'+Math.floor(spent)+'</span>' };
    G.mode='result';
    save(); render(); return;
  }

  if(G.age>=G.lifespan){ die('寿元耗尽'); return; }
  if(interrupted) addLog('闭关未开始或已中止：'+interrupted+'。','dn');
  G.mode='idle'; render();
}

/* =========================================================
   突破
   ---------------------------------------------------------
   阶段 B：突破从「筑基即结局」改成「九境逐境突破、飞升终局」。
   - canBreak   当前境圆满 + 修为满 + 尚存寿元，不受灵根硬锁
   - breakRate  基础成功率 × 修正项；基础取「下一境首阶」的 bt；渡劫九重圆满后取渡劫末阶 bt
                （不再以 CFG.btBase 对境界表二次缩放）
   - doBreak    成功 → 进入下一境继续修；失败 → 修为倒退可再冲
                渡劫九重圆满后再突破 = 飞升（终局）
   ========================================================= */
/* 下一境下标。渡劫（8）之后没有下一境，返回 null 表示「再突破即飞升」 */
function nextRealmIdx(){ const r=realmOf(); return r>=REALMS.length-1 ? null : r+1; }

/* 当前境圆满突破的基础成功率：按扩展方案读取「下一境首阶」bt。
   例如炼气圆满冲筑基，读取筑基 bt[0]；渡劫九重圆满冲飞升，读取渡劫末阶 bt。
   这样境界跃迁使用目标境界的基础难度，不把当前境最后一阶误当成跨境基础率。 */
function nextBtBase(){
  const r=Math.max(0,Math.min(REALMS.length-1,realmOf()));
  const nxt=nextRealmIdx();
  if(nxt==null){
    const last=REALMS[r];
    return last.bt[Math.max(0,last.bt.length-1)];
  }
  const target=REALMS[nxt];
  return target.bt[0];
}

function canBreak(){ return !!G && G.mode==='idle' && G.age<G.lifespan && realmBrim(); }
function naturalBreakAllowed(){ return true; } // Compatibility with old tools; no root cap.
function breakRate(invest){
  const money=Math.max(0,Math.min(G.stones,Number(invest)||0));
  let modifier=(G.coef-0.95)*2+(G.attr.wu-5)*0.02+artMindSum(G).bt+Math.min(0.20,money/200*0.05);
  if(G.injured>0)modifier-=0.05;
  if(G.karma>=30)modifier-=0.05;
  if(G.age>G.lifespan*0.8)modifier-=0.05;
  return Math.max(0.05,Math.min(0.95,nextBtBase()*(1+modifier)));
}

function openBreak(){
  if(!canBreak())return;
  const nxt=nextRealmIdx(),name=nxt==null?'飞升':REALM_NAMES[nxt];
  const ov=document.getElementById('overlay'),md=document.getElementById('modal');
  const max=Math.max(0,Math.floor(G.stones)),initial=Math.min(max,800);
  md.innerHTML='<h3>冲 击 '+name+'</h3><div class="sub">'+REALM_NAMES[realmOf()]+'圆满。灵根影响修炼效率与成算，不封锁境界。</div>'+
    '<div style="text-align:center;font-size:42px" id="btRate"></div>'+
    '<div class="slider-row"><input aria-label="投入灵石" type="range" id="btRange" min="0" max="'+max+'" step="1" value="'+initial+'"><div class="slider-val" id="btVal"></div></div>'+
    '<div class="preview" id="btPrev"></div><div class="modal-actions"><button class="act ghost" id="btCancel">再等等</button><button class="act primary" id="btGo">踏出这一步</button></div>';
  ov.classList.remove('hidden');
  const range=document.getElementById('btRange');
  const update=()=>{
    const n=Number(range.value)||0;
    document.getElementById('btVal').textContent=n+' 灵石';
    document.getElementById('btRate').textContent=Math.round(breakRate(n)*100)+'%';
    document.getElementById('btPrev').innerHTML='基础成算 '+Math.round(nextBtBase()*100)+'%，灵根、悟性、心法、伤势与年龄共同修正。灵石投入最多提升基础修正 20%。<br>失败：修为 −25%，寿元 −3 年，带伤三年。投入灵石成功或失败均消耗。';
  };
  range.oninput=update;update();
  document.getElementById('btCancel').onclick=ovHide;
  document.getElementById('btGo').onclick=()=>{const n=Number(range.value)||0;ovHide();doBreak(n);};
}

function doBreak(invest, mode='natural'){
  if(!canBreak())return;
  mode='natural'; // Legacy callers share the same current breakthrough rule.
  invest=Math.max(0,Math.min(Math.floor(G.stones),Math.floor(Number(invest)||0)));
  const p=breakRate(invest,mode);
  stoneChange(G,-(invest),'事件与修行');
  const nxt=nextRealmIdx();
  const nxtName = nxt==null ? '飞升' : REALM_NAMES[nxt];
  if(Math.random()<p){
    if(nxt==null){
      // 渡劫九重圆满，再突破即飞升——终局
      addLog('　飞升功成。','up');
      G.mode='dead';
      G.deathTitle='飞升';
      G.deathText='那一步落下去了。\n\n'+invest+' 灵石换来的最后一炉丹药在丹田里化开，九重天劫的裂口在头顶缓缓合拢，'+
        '露出一线天光。\n\n飞升。\n\n你今年 '+G.age+' 岁。九境五十阶，你一步一步走到了尽头。';
      save(); render(); return;
    }
    // 突破成功：进入下一境，继续修
    const oldRealm=realmOf();
    G.realm=nxt;
    G.layer=1;
    G.cult=0;
    G.lifespan=realmLife(nxt)+artMindSum(G).life;   // 寿元随境界涨；心法养道基，另添几年
    addLog('　'+nxtName+'功成。','up');
    G.lastResult={
      title:nxtName+' 成',
      text:'那一步落下去了。\n\n'+invest+' 灵石换来的丹药在丹田里化开，气机穿过那道一直堵着的关口，'+
        '像冰面裂开一线，随之是整条河的解冻。\n\n'+nxtName+'。\n\n'+
        '你今年 '+G.age+' 岁，寿元延至 '+G.lifespan+' 年。'+
        (nxt===1?'这只是一条长路的第一个台阶——但你已经比世上绝大多数人，多走了一步。':
         '路还长。前面还有 '+REALM_NAMES.slice(nxt+1).join('、')+'。')
    };
    G.mode='result';
    save(); render(); return;
  }
  G.cult=Math.floor(realmFullNeed()*(mode==='defy'?0.60:0.75));
  G.lifespan-=(mode==='defy'?5:3);
  if(G.lifespan<=G.age) G.lifespan=G.age+1;
  G.injured=(mode==='defy'?5:3);
  if(mode==='defy') G.flag=Object.assign({},G.flag,{heartDemon:true});
  addLog('　'+(mode==='defy'?'逆天冲关':'冲关')+'失败，修为倒退。','dn');
  G.lastResult={
    title:'冲 关 失 败',
    text:'气机走到一半，忽然散了。\n\n你从蒲团上翻下来，胸口像被人用手攥住。等缓过来，丹田里空了一大块。\n\n'+
