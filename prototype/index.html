/* 子代灵根：均值回归 + 变异判定。纯函数，界面与模拟器共用 */
function rollHeirRoot(selfRoot, mateRoot){
  const ROOT6=['绝灵根','五灵根','四灵根','三灵根','双灵根','天灵根'];
  const tSelf=TIER_OF[selfRoot]||1;
  const tMate=TIER_OF[mateRoot]||1;
  const mean=Math.round((tSelf+tMate)/2);
  const dist=GEN[Math.max(1,Math.min(6,mean))];
  let root=weightedPick(ROOT6, r=>dist[ROOT6.indexOf(r)]);
  const varP=(selfRoot==='变异灵根'&&mateRoot==='变异灵根')?0.6:((selfRoot==='变异灵根'||mateRoot==='变异灵根')?0.25:0);
  let mutated=false;
  if(varP>0 && (root==='双灵根'||root==='天灵根') && Math.random()<varP){
    root='变异灵根'; mutated=true;
  }
  return { root, mutated, mean, tSelf, tMate };
}

function openInherit(){
  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  const mateRoot=G.hasMate?(G.mateRoot||G.root):pick(['绝灵根','五灵根','四灵根','三灵根']);
  const h=rollHeirRoot(G.root, mateRoot);
  const heirRoot=h.root, mutated=h.mutated, mean=h.mean, tSelf=h.tSelf, tMate=h.tMate;
  const inherit=Math.floor(G.stones*0.4);

  md.innerHTML=
    '<h3>传 于 后 人</h3>'+
    '<div class="sub">'+(G.hasMate?'你与道侣（'+mateRoot+'）留下一个孩子。':
      (G.sex==='女'?'你孑然一身，只留下一个不知父亲是谁的孩子。':'你孑然一身，只留下一个不知母亲是谁的孩子。'))+'\n血脉按「均值回归」抽定——'+
      '可能更好，也可能更差。</div>'+
    '<div class="preview" style="line-height:2.2">'+
      (G.sex==='女'?'母':'父')+'　灵根　<b>'+G.root+'</b>　档 '+tSelf+'<br>'+
      '配 偶 灵 根　<b>'+mateRoot+'</b>　档 '+tMate+'<br>'+
      '均值档　<b>'+mean+'</b>　→　子代灵根　<b class="good">'+heirRoot+'</b>'+(mutated?'　<span style="color:var(--jade)">（血脉异变）</span>':'')+'<br>'+
      '继承灵石　<b>'+inherit+'</b>（四成）'+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="act primary" id="goNext">开 始 第 '+(G.generation+1)+' 代</button>'+
    '</div>';
  ov.classList.remove('hidden');

  document.getElementById('goNext').onclick=()=>{
    ov.classList.add('hidden');
    const sur=G.surname||'';
    const t0=G.t;                   // 世界钟不停：先人死了，历接着走
    const anc={ name:G.name, sur, root:G.root, age:G.age, layer:G.layer, origin:G.origin,
                place:G.place||'village',
                been:Object.keys(G.been||{}),
                relCount:Object.keys(G.rel||{}).length,
                fame:(G.fame&&(G.fame['修士'].v+G.fame['凡人'].v+G.fame['本地'].v))||0,
                master:G.master||null,
                arts:Object.keys(G.arts||{}),
                born: eraYear()-G.age, died: eraYear() };
    const gen=G.generation+1;
    const ancestors=(G.ancestors||[]).concat([anc]);
    /* 先人攒下的东西，后人接一半——不是全盘接，是「听先人说过」。
       关系：恩怨各减半，留一句「先人留」；名声：档位减半（扬名降为闻名）。
       去过的地不直接算自己去的——亲历与听说，是两回事。 */
    const oldRel=G.rel||{};
    const oldFame=G.fame||fameInit();
    /* 后人换了一副身子，也就换了一副性别——不由你挑，正如不由先人挑。
       名可以换，姓不能换：一族人是靠这个字认亲的。 */
    newGame(sur ? (sur+pick(GIVEN_NAMES)) : '无名', anc.origin, Math.random()<0.5?'男':'女', t0);
    const o=ORIGINS[anc.origin];
    const v=pick(o.variants);
    G.variant=v.name; G.variantIdx=o.variants.indexOf(v); G.mark=v.mark||'';
    buildFamily();                  // 下一代另有一家子人，一样由身世定
    G.root=heirRoot; G.coef=ROOTS[heirRoot].coef; G.cap=ROOTS[heirRoot].cap;
    G.age=CFG.startAge; G.layer=CFG.startLayer; G.cult=0;
    G.generation=gen;
    G.ancestors=ancestors;
    stoneSet(G,Math.max(4,inherit),'事件与修行');
    /* 关系与名声，减半继承（见上）。 */
    G.rel={};
    for(const nid in oldRel){
      const r=oldRel[nid];
      if(!r) continue;
      const v=Math.sign(r.v)*Math.ceil(Math.abs(r.v)/2);
      G.rel[nid]={ v, note:('先人留：'+(r.note||'')), name:r.name, at:G.age };
    }
    G.fame=fameInit();
    FAME_CIRCLES.forEach(c=>{
      const f=oldFame[c];
      if(f && f.v>0) G.fame[c]={ v:(f.v>>1), at:f.at };
    });
    /* 师承：功法不传给下一代（没练过就是没练过），但「家学」留一句——
       祖上师承何人、练过什么，下一代「听说」了，可循着去寻，也可在族谱里查。 */
    G.heirloom = (anc.master||anc.arts.length) ? { master:anc.master, arts:anc.arts } : null;
    G.log=[];
    addLog('　第 '+gen+' 代。先人 '+anc.name+'，'+anc.root+'，享年 '+anc.age+'。','hi');
    addLog('　八岁测灵，得灵根 '+heirRoot+'。');
    G.lastResult={ title:'第 '+gen+' 代',
      text:'先人 '+anc.name+' 死于 '+anc.age+' 岁，'+anc.root+'，止步'+objRealmTxt(anc)+'。\n\n'+
        '留下 '+inherit+' 灵石，和一门还没望到头的道。\n\n'+
        '你八岁。测灵石在掌心亮起的那一刻，族中老人说：'+heirRoot+'。\n\n'+
        '<span class="mute">你从先人止步的地方开始——但灵根已换了一副。</span>' };
    G.mode='result';
    save(); render();
  };
}

function openLineage(){
  const ov=document.getElementById('overlay');
  const md=document.getElementById('modal');
  const list=(G.ancestors||[]).slice().reverse();
  /* 先人一行，写三样：灵根·止步何境·享年；下面一行小的，记他的足迹——
     止步何处、去过几处、留下几笔没了的账（恩或怨）。后人接的是他的道，也是他的债。 */
  const line=a=>{
    const feet=[];
    if(a.place) feet.push('止步'+placeName(a.place));
    if(a.been && a.been.length>1) feet.push('到过 '+(a.been.length)+' 处');
    if(a.relCount) feet.push('留 '+(a.relCount)+' 笔账');
    if(a.fame) feet.push('有些名声');
    if(a.master) feet.push('师承'+a.master);
    if(a.arts && a.arts.length) feet.push('练过《'+a.arts.join('》《')+'》');
    return '<div class="ledger-row"><span class="k">第 N 代</span>'+
      '<span class="v">'+a.root+'　'+objRealmTxt(a)+'　享年 '+a.age+
      (a.died!=null?'　<span class="mute">璇玑'+cnYear(a.born)+'年—'+cnYear(a.died)+'年</span>':'')+
      '</span></div>'+
      (feet.length?'<div class="lg-foot">'+feet.join('　·　')+'</div>':'');
  };
  let rows='';
  if(list.length){
    list.forEach((a,i)=>{
      rows+=line(a).replace('第 N 代', '第 '+(list.length-i)+' 代');
    });
  }else{
    rows+='<div class="ledger-row"><span class="k">—</span><span class="v">尚无先人</span></div>';
  }
  md.innerHTML='<h3>族 谱</h3><div class="sub">一脉相承，也是一代代的试错。</div>'+
    '<div class="ledger" style="border-top:none">'+rows+
    '<div class="ledger-row"><span class="k">第 '+G.generation+' 代</span><span class="v">'+G.root+'　在世</span></div>'+
    '</div><div class="modal-actions"><button class="act" id="lgClose">合 上</button></div>';
  ov.classList.remove('hidden');
  document.getElementById('lgClose').onclick=()=>ov.classList.add('hidden');
}

const SLOT_KEY=DEV_SESSION47?'xiantu_developer47_slots_v1':'xiuxian_slots_v1';
const SLOT_LABEL={1:'卷 一',2:'卷 二',3:'卷 三'};

function saveWarning(failed){
  let warning=document.getElementById('save-warning-r1');
  if(!failed){ if(warning)warning.remove(); return; }
  if(warning)return;
  warning=document.createElement('div');warning.id='save-warning-r1';
  warning.setAttribute('role','alert');
  warning.style='position:sticky;top:0;z-index:1000;padding:12px;background:#542b23;color:#fff;text-align:center';
  warning.textContent='自动存档失败：当前进度尚未确认写入。请勿关闭或刷新页面；检查浏览器存储空间后重试存档。';
  document.body.prepend(warning);
}
function save(){
  if(!G || readUIPrefs().autosave===false)return null;
  let ok=false;
  try{ stoneAccount(G); ok=sSet(SAVE_KEY, JSON.stringify(G))===true; }catch(e){}
  saveWarning(!ok);
  return ok;
}

function restore(str){
  const previous=G;
  XTEconomy40.lastRestoreError='存档内容无效，请从备份恢复。';
  try{
    const o=stonePrepareSave(str);
    if(o&&!JSON.parse(str).wallet40)stoneBackup(str);
    if(!o||!o.name||!o.attr) return false;
    G=o;
    const pendingId=G.curEvent && G.curEvent.id;
    const pending=pendingId && EVENTS.concat(ROAD_EVENTS).find(e=>e.id===pendingId);
    if(G.mode==='event'){if(pending)G.curEvent=pending;else G.mode='idle';}
    if(G.mode==='result'&&!G.lastResult)G.mode='idle';
    if(G.mode==='prologue') G.mode = G.root ? 'idle' : 'child';   // 旧档兼容
    if(G.mode!=='event')G.curEvent=null;
    if(G.mode!=='result')G.lastResult=null;
    if(!G.fate) G.fate=genFate();
    if(G.surname==null) G.surname=splitName(G.name).surname;   // 旧档没有姓，从名里拆回来
    /* 旧档的「族」是随机抽的，多半跟你的姓对不上。有姓了，就按姓重算一遍。 */
    if(G.surname && String(G.fate['族']||'').indexOf(G.surname)<0) G.fate['族']=clanName();
    if(!G.buff) G.buff={};
    if(!G.flag) G.flag={};
    if(!G.sex) G.sex='男';                 // 旧档没有性别，按男记
    if(G.realm==null) G.realm=0;           // 旧档没有境界，按炼气记
    if(!G.place) G.place='village';        // 旧档没有「人在哪」，补一个
    if(!G.home) G.home=G.place||HOME_OF[G.origin]||'village';   // 旧档没有「家在哪儿」
    if(!G.family){ if(G.variant) buildFamily(); else G.family=[]; }   // 旧档没有家人，按身世补
    if(G.month==null) G.month=0;           // 旧档没有「今年第几月」，从正月起算
    if(G.day==null) G.day=0;               // 旧档没有「月内第几日」，从初一起算
    if(G.t==null) G.t=rebaseT();   // 旧档没有世界钟，按岁数折算，此后换代不倒流
    if(!G.heard) G.heard={};               // 旧档没有「听过什么」
    if(!G.met) G.met={};                   // 旧档没有「见过谁」
    if(!G.been) G.been={};                 // 旧档没有「去过哪」
    if(!G.live) G.live={};                 // 旧档没有「世上正在发生什么」
    if(!G.gone) G.gone={};                 // 旧档没有「刚散了什么」
    if(!G.know) G.know={};                 // 旧档没有「听说过哪儿有事」
    /* 旧档只有 renown(0/1) 一个哑状态，没有圈子名声。有善名的按「本地」记一档，
       打响处取脚下——旧档没记在哪儿扬的名，只能这样兜。 */
    if(!G.fame){
      G.fame=fameInit();
      if(G.renown){ G.fame['本地']={ v:1, at:G.place||'village' }; }
    }
    delete G.renown;
    if(!G.arts) G.arts={};                 // 旧档没有「学过什么功法」
    if(G.master==null) G.master=null;      // 旧档没有「师父」
    if(!G.spot) G.spot=null;               // 旧档没有「站在这地方的哪一处」
    /* 半路存档保留事件或待续行程，不能靠读档免去赶路时间。 */
    if(G.road && G.mode!=='event' && G.mode!=='result'){
      G.mode='result';G.lastResult={title:'行程待续',text:'行程尚未结清，继续后按剩余路程推进。'};
    }
    G.been[G.place]=1;                     // 脚下这块，至少是踩着的地
    return true;
  }catch(e){ G=previous;XTEconomy40.lastRestoreError=e.code==='BACKUP40'?'迁移前备份无法保存，请检查浏览器存储空间后重试。原档未更改。':'存档内容无效，请从备份恢复。';return false; }
}

function load(){
  const s=sGet(SAVE_KEY);
  return s?restore(s):false;
}

function readSlots(){
  try{
    const s=sGet(SLOT_KEY);
    const o=s?JSON.parse(s):{};
    return (o&&typeof o==='object')?o:{};
  }catch(e){ return {}; }
}
function writeSlots(o){ try{ return sSet(SLOT_KEY, JSON.stringify(o))===true; }catch(e){return false;} }
function durableSlots(){
  const raw=window.localStorage.getItem(SLOT_KEY);
  const slots=raw?JSON.parse(raw):{};
  if(!slots||typeof slots!=='object'||Array.isArray(slots))throw Error('Invalid slots');
  return slots;
}
function deleteSlot(n){
  try{const slots=durableSlots();delete slots['s'+n];if(writeSlots(slots))return true;}catch(e){}
  toast('删除存档失败，请检查浏览器存储空间后重试。');
  return false;
}

function saveToSlot(n){
  if(!G) return false;
  let ok=false;
  try{
    stoneAccount(G);
    // Read durable slots directly: a read failure must not overwrite unread old slots.
    const slots=durableSlots();
    slots['s'+n]={ ts:Date.now(), d:JSON.stringify(G) };
    ok=writeSlots(slots);
  }catch(e){}
  if(!ok)toast('手动存档失败：未确认写入，请保留当前页面并检查浏览器存储空间后重试。');
  return ok;
}
function slotData(n){
  const s=readSlots()['s'+n];
  if(!s) return null;
  try{ return { ts:s.ts, o:JSON.parse(s.d) }; }catch(e){ return null; }
}
function fmtAgo(ts){
  const diff=(Date.now()-ts)/1000;
  if(diff<60) return '方才';
  if(diff<3600) return Math.floor(diff/60)+' 分前';
  if(diff<86400) return Math.floor(diff/3600)+' 时前';
  const d=new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function slotLine(o){
  if(!o) return '';
  if(!o.root) return o.name+'　<span class="dim">'+(o.origin||'')+(o.variant?'·'+o.variant:'')+'　未测灵</span>';
  const realm=objRealmTxt(o);
  return o.name+'　<span class="dim">'+o.origin+(o.variant?'·'+o.variant:'')+'　'+o.root+'　'+realm+
    '　'+o.age+'岁'+(o.generation>1?'　第'+o.generation+'代':'')+'</span>';
}

  md.innerHTML='<h3>存 档</h3>'+

        if(!deleteSlot(n))return;
        openSaves();
      }
    };
  });

  document.getElementById('svClose').onclick=()=>ov.classList.add('hidden');
  const t=document.getElementById('svTitle');
  if(t) t.onclick=()=>{
    ov.classList.add('hidden');

/*
  第五批：突破数值快速模拟（纯只读）。
  说明：只评估九次跨境突破的「单次尝试链式成功概率」和各境反复冲关的理论平均尝试次数；
  不模拟修为累积、寿元损耗、事件、丹药/心法收益，因此不能把结果当成真实通关率。
  不修改 G、不消耗灵石、不推进时间。
*/
function runWendaoBreakSim(trials){
  const N=Math.max(1000,Math.min(100000,Math.floor(Number(trials)||10000)));
  const roots=[
    {name:'绝灵根',coef:0.90}, {name:'五灵根',coef:0.93},
    {name:'四灵根',coef:0.95}, {name:'三灵根',coef:0.97},
    {name:'双灵根',coef:0.98}, {name:'变异灵根',coef:0.99},
    {name:'天灵根',coef:1.00}
  ];
  const rows=[];
  for(const root of roots){
    let chain=1, expectedAttempts=0;
    const rates=[];
    for(let r=0;r<REALMS.length;r++){
      const base=(r===REALMS.length-1)
        ? REALMS[r].bt[REALMS[r].bt.length-1]
        : REALMS[r+1].bt[0];
      // 中性条件：悟性=5、无心法、无受伤、无高业力、非年迈、不投入灵石。
      const modifier=(root.coef-0.95)*2;
      const rate=Math.max(0.05,Math.min(0.95,base*(1+modifier)));
      rates.push(rate);
      chain*=rate;
      expectedAttempts+=1/rate;
    }
    // 蒙特卡洛验证独立单次连续突破概率；固定种子以保证结果可复现。
    let seed=(Math.round(root.coef*10000)+12345)>>>0, successes=0;
    for(let i=0;i<N;i++){
      let ok=true;
      for(const rate of rates){
        seed=(1664525*seed+1013904223)>>>0;
        if(seed/4294967296>=rate){ok=false;break;}
      }
      if(ok) successes++;
    }
    rows.push({
      灵根:root.name,
      灵根系数:root.coef.toFixed(2),
      九次单次连过理论概率:(chain*100).toFixed(4)+'%',
      模拟连过概率:(successes/N*100).toFixed(4)+'%',
      九境各自反复尝试的理论平均总次数:expectedAttempts.toFixed(2),
      各境单次成功率:rates.map(v=>Math.round(v*100)+'%').join(' / ')
    });
  }
  console.table(rows);
  return {trials:N,scope:'仅突破概率；不含修为累积、寿元、事件、资源与养成收益',rows};
}

/* 非侵入式规则自检：只读配置与函数，不推进年份、不改玩家存档。 */
function runWendaoWorldCheck(){
  const rows=[];
  const add=(name,ok,detail)=>rows.push({检查:name,结果:ok?'通过':'需检查',说明:detail||''});
  add('九境数量',REALMS.length===9,'当前：'+REALMS.length+' 境');
  const stageCount=REALMS.reduce((n,r)=>n+r.layers.length,0);
  add('五十阶结构',stageCount===50,'当前合计：'+stageCount+' 阶');
  add('渡劫九重',REALMS[8]&&REALMS[8].layers.length===9,'渡劫阶数：'+(REALMS[8]?.layers.length||0));
  add('境界数据完整',REALMS.every(r=>r.layers.length===r.bt.length&&r.layers.every(v=>Number.isFinite(v)&&v>0)&&r.bt.every(v=>Number.isFinite(v)&&v>0&&v<=1)),'每境 layers 与 bt 数量相等，数值为正且成功率在 0~1');
  const originalRealm=(typeof G!=='undefined'&&G)?G.realm:undefined;
  if(typeof G!=='undefined'&&G){
    REALMS.forEach((r,i)=>{
      G.realm=i;
      const base=nextBtBase();
      add(r.name+'基础突破率',Number.isFinite(base)&&base>=0.05&&base<=0.95,Math.round(base*100)+'%');
    });
    G.realm=originalRealm;
  }else add('玩家状态可用',false,'未找到 G，跳过突破率逐境检查');
  const failed=rows.filter(r=>r.结果!=='通过').length;
  console.table(rows);
  return {passed:rows.length-failed,total:rows.length,failed,rows};
}

/* 第六批：成长平衡审查器。诊断而非完整通关模拟。以当前年产出公式、逐阶需求和寿元数据，估算中性条件下的修炼耗时；不修改 G 或存档。 */
function runWendaoGrowthAudit(){
  const roots=[
    {name:'绝灵根',coef:0.90},{name:'五灵根',coef:0.93},
    {name:'四灵根',coef:0.95},{name:'三灵根',coef:0.97},
    {name:'双灵根',coef:0.98},{name:'变异灵根',coef:0.99},{name:'天灵根',coef:1.00}
  ];
  const baseState=(root,r)=>{
    const s=Object.assign({},G,{
      realm:r, layer:1, coef:root.coef, place:'village', injured:0,
      karma:0, arts:{}, buff:{haste:0,vein:0,fertile:0,dan:0}
    });
    s.attr=Object.assign({},G.attr,{wu:5});
    return s;
  };
  const rows=[];
  for(const root of roots){
    let totalYears=0;
    for(let r=0;r<REALMS.length;r++){
      const info=REALMS[r];
      const need=info.layers.reduce((a,b)=>a+b,0);
      const state=baseState(root,r);
      const annual=yearOutput(state);
      const years=need/annual;
      totalYears+=years;
      rows.push({灵根:root.name,境界:info.name,阶数:info.layers.length,
        本境修为需求:need,实际公式中性年产出:annual.toFixed(2),
        本境理论修炼年数:years.toFixed(1),配置寿元参考:info.life,
        需求年数是否超过该境寿元:years>info.life?'是':'否',
        配置日行里数pace:info.pace,境界年产基准:info.cultivationBase,pace是否参与yearOutput:'否（pace为赶路速度）'});
    }
  }
  const summary=REALMS.map((info,r)=>{
    const need=info.layers.reduce((a,b)=>a+b,0);
    const root={name:'天灵根',coef:1};
    const annual=yearOutput(baseState(root,r));
    return {境界:info.name,阶数:info.layers.length,修为需求合计:need,
      基础寿元:info.life,中性年产出:annual.toFixed(2),
      理论修炼年数:(need/annual).toFixed(1),配置日行里数pace:info.pace,境界年产基准:info.cultivationBase,
      pace是否参与年产出:'否（pace为赶路速度）'};
  });
  console.group('《仙途》第七批修炼产出核查');
  console.info('按当前 yearOutput() 实际公式计算；中性条件：村庄灵气、无增益、无心法、无伤、悟性5。该审查不模拟行动效率、闭关衰减、事件、灵石、突破失败或跨境寿元变化。');
  console.info('本版已接入设定总表「寿元平衡模拟」中的段内年产基准；REALMS.pace 仍只代表日行里数，不参与修炼产出。');
  console.table(summary); console.table(rows); console.groupEnd();
  return {type:'cultivation-output-audit',assumptions:['使用当前 yearOutput() 公式','村庄灵气','无增益、心法与伤势','不模拟行动效率与寿元跨境变化'],finding:'REALMS.pace 当前未参与 yearOutput()',summary,rootRows:rows};
}



/* 第九批：寿元—修炼节奏压力测试。只读估算，不推进世界时间、不改存档。
   采用当前 yearOutput、CFG.walkRate、闭关效率衰减和寿元配置；不模拟随机事件、灵石决策、丹药与突破随机性。 */
function runWendaoLifeBalanceAudit(){
  const roots=[
    {name:'绝灵根',coef:0.90},{name:'五灵根',coef:0.93},
    {name:'四灵根',coef:0.95},{name:'三灵根',coef:0.97},
    {name:'双灵根',coef:0.98},{name:'变异灵根',coef:0.99},{name:'天灵根',coef:1.00}
  ];
  const makeState=(root,r)=>{
    const s=Object.assign({},G,{realm:r,layer:1,cult:0,coef:root.coef,place:'village',injured:0,karma:0,rtCount:0,
      arts:{},buff:{haste:0,vein:0,fertile:0,dan:0},lifespan:realmLife(r),age:8,stones:0});
    s.attr=Object.assign({},G.attr,{wu:5});
    return s;
  };
  const rows=[];
  for(const root of roots){
    let totalCultYears=0, totalWalkYears=0, beyondLife=0;
    for(let r=0;r<REALMS.length;r++){
      const s=makeState(root,r), info=REALMS[r];
      const need=info.layers.reduce((a,b)=>a+b,0);
      const annual=yearOutput(s);
      const walkRate=CFG.walkRate;
      const walkYears=need/Math.max(0.001,annual*walkRate);
      let remaining=need, retreatYears=0, sessions=0;
      // 每次闭关按当前配置的寿元比例封顶；效率按真实 retreatEfficiency 公式逐次衰减。
      while(remaining>0 && sessions<100){
        const eff=Math.max(CFG.decayFloor,1-CFG.decayPerUse*sessions);
        const maxY=Math.max(1,Math.floor(s.lifespan*CFG.retreatMaxPct));
        const y=Math.min(maxY,Math.max(1,Math.ceil(remaining/Math.max(1,annual*eff))));
        const gain=Math.min(remaining,annual*eff*y);
        remaining-=gain; retreatYears+=y; sessions++;
      }
      totalCultYears+=retreatYears; totalWalkYears+=walkYears;
      const life=info.life;
      if(retreatYears>life) beyondLife++;
      rows.push({灵根:root.name,境界:info.name,年产基准:info.cultivationBase,
        当前公式年产出:Math.round(annual),本境需求:need,
        持续行走理论年数:walkYears.toFixed(1),闭关理论年数:retreatYears.toFixed(1),
        估算闭关次数:sessions,本境基础寿元:life,
        闭关年数超出本境寿元:retreatYears>life?'是':'否'});
    }
  }
  console.group('《仙途》第九批寿元—修炼节奏压力测试');
  console.info('本工具为规则压力测试，不是通关率模拟。闭关估算假定灵石充足、无随机事件、无丹药/心法/环境变化（地点环境倍率仍按当前角色地点计入），且每境独立按基础寿元计算；真实玩法会因跨境加寿、灵石获取、事件、突破失败而不同。');
  console.table(rows); console.groupEnd();
  return {type:'life-balance-audit',assumptions:['当前 yearOutput()','持续行走使用 CFG.walkRate','闭关使用 retreatMaxPct 与 decayPerUse/decayFloor','假定灵石充足且无随机事件','不模拟突破与跨境加寿'],rows};
}
