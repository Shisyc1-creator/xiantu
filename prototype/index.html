<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《仙途》</title>
<style>
:root{
  /* 墨夜青绿：深青打底，青玉为主，朱砂为警，旧金退到最末 */
  --ink:#05090a;
  --panel:#0c1417;
  --panel2:#101d21;
  --line:#18262b;
  --line2:#243a41;
  --jade:#82b9a7;
  --jade-dim:#4f7d70;
  --jade-soft:rgba(130,185,167,.09);
  --gold:#b9a67e;
  --gold-dim:#6d6047;
  --paper:#dde7e4;
  --dim:#87999c;
  --blood:#b8503f;
  --amber:#c08a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 130% 90% at 50% -30%,#16282e 0%,#0a1316 40%,#040809 100%);
  color:var(--paper);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  font-size:15.5px;line-height:2;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 8% 12%,rgba(130,185,167,.05) 0%,transparent 38%),
    radial-gradient(circle at 92% 88%,rgba(130,185,167,.035) 0%,transparent 40%);
}
.frame{
  position:relative;z-index:1;
  height:100vh;height:100dvh;max-width:1080px;margin:0 auto;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:0 22px;
}

/* ---------- HUD ---------- */
.hud{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:18px 2px 15px;border-bottom:1px solid var(--line);
}
.hud::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(130,185,167,.34) 50%,transparent 100%);
}
.hud-left{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}
.name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.name{font-size:19px;letter-spacing:.16em;color:var(--paper)}
.tag{
  font-size:10.5px;letter-spacing:.12em;color:var(--dim);
  border:1px solid var(--line2);padding:1px 7px;
}
.tag.root{color:var(--jade);border-color:#2b4a43;background:var(--jade-soft)}
.tag.gold{color:var(--gold);border-color:#4a3f28;background:rgba(185,166,126,.07)}
.tag.dull{color:#7d8f92;border-color:#22343a;background:none}
.tag.warn{color:var(--amber);border-color:#4a3820}
.realm-row{display:flex;align-items:center;gap:12px}
.realm{font-size:12.5px;letter-spacing:.14em;color:var(--jade);white-space:nowrap}
.bar{
  position:relative;flex:1;max-width:300px;height:4px;
  background:#0a1518;border:1px solid var(--line2);overflow:hidden;
}
.bar-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#33605a,#82b9a7);
  box-shadow:0 0 10px rgba(130,185,167,.42);
  transition:width .35s ease;
}
.bar-text{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-right{display:flex;gap:26px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.4}
.stat .k{font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.stat .v{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--paper)}
.stat .v.warn{color:var(--amber)}
.stat .v.danger{color:var(--blood)}

/* ---------- STAGE ---------- */
.stage{
  display:grid;grid-template-columns:1fr 296px;gap:0;
  min-height:0;overflow:hidden;
}
.scene{
  display:flex;flex-direction:column;min-height:0;
  padding:28px 34px 18px 2px;overflow-y:auto;
}
.scene::-webkit-scrollbar,.log-body::-webkit-scrollbar{width:3px}
.scene::-webkit-scrollbar-thumb,.log-body::-webkit-scrollbar-thumb{background:#243a41}
.scene-head{
  position:relative;
  font-size:10.5px;letter-spacing:.3em;color:var(--jade-dim);
  margin-bottom:22px;padding-bottom:14px;
}
.scene-head::after{
  content:'';position:absolute;left:0;bottom:0;width:46px;height:1px;
  background:linear-gradient(90deg,var(--jade-dim),transparent);
}
.scene-text{font-size:17px;line-height:2.2;color:var(--paper);white-space:pre-wrap;letter-spacing:.02em}
.scene-text .em{color:var(--jade)}
.scene-text .bad{color:var(--blood)}
.scene-text .good{color:var(--jade)}
.scene-text .mute{color:var(--dim)}
.scene-sub{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--dim);line-height:2;
}
.scene-sub .bad{color:var(--blood)}
.scene-sub .good{color:var(--jade)}
.scene-sub .warn{color:var(--amber)}

.stat-panel{
  margin-top:34px;border:1px solid var(--line);
  background:rgba(9,16,19,.55);padding:17px 19px;
}
.stat-panel .hd{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:11px;
}
.stat-panel .hd b{color:var(--paper);font-weight:normal;font-variant-numeric:tabular-nums}
.stat-panel .bar{max-width:none;height:5px;margin-bottom:13px}
.stat-panel .calc{font-size:12.5px;color:var(--dim);line-height:2}
.stat-panel .calc b{color:var(--jade);font-weight:normal;font-variant-numeric:tabular-nums}
.stat-panel .calc .amber{color:var(--amber)}
.stat-panel .calc .row{display:flex;gap:0}
.stat-panel .calc .sep{color:#3c4f54;margin:0 10px}

/* ---------- CHOICES ---------- */
.choices{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.choice{
  display:flex;align-items:flex-start;gap:12px;
  width:100%;text-align:left;
  background:rgba(10,18,21,.7);
  border:1px solid var(--line2);
  border-left:2px solid transparent;
  color:var(--paper);font-family:inherit;font-size:14px;line-height:1.8;
  padding:12px 16px;cursor:pointer;
  transition:border-color .2s,background .2s,transform .14s;
}
.choice:hover{
  border-color:var(--line2);
  border-left-color:var(--jade);
  background:rgba(16,32,36,.92);
  transform:translateX(3px);
}
.choice:disabled{opacity:.34;cursor:not-allowed;transform:none}
.choice .num{
  font-size:10.5px;color:var(--jade-dim);letter-spacing:.1em;
  padding-top:4px;min-width:14px;
}
.choice .body{flex:1}
.choice .hint{
  display:block;font-size:11.5px;color:var(--dim);margin-top:4px;letter-spacing:.02em;
}
.choice .cost{color:var(--amber);font-size:11.5px}

/* ---------- LOG ---------- */
.log{
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  padding:28px 0 18px 22px;
}
.log-title{
  font-size:10.5px;letter-spacing:.3em;color:var(--jade-dim);margin-bottom:16px;
}
.log-body{
  flex:1;overflow-y:auto;padding-right:8px;
  font-size:12px;line-height:2;color:var(--dim);
}
.log-body p{margin-bottom:7px}
.log-body .y{color:#4f6064;font-variant-numeric:tabular-nums}
.log-body .hi{color:var(--paper)}
.log-body .up{color:var(--jade)}
.log-body .dn{color:var(--blood)}

.log-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.log-head .log-title{margin-bottom:0}
/* 抽屉开合只在窄屏出现；宽屏的左栏本来就在，不用开关 */
.log-close{display:none}
.log-open{display:none}
.drawer-veil{display:none}

/* ---------- ACTIONS ---------- */
.actions{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:16px 2px 22px;border-top:1px solid var(--line);
}
.act{
  position:relative;
  background:transparent;border:1px solid var(--line2);color:var(--paper);
  font-family:inherit;font-size:13.5px;letter-spacing:.09em;
  padding:9px 20px;cursor:pointer;
  transition:all .2s;
}
.act:hover:not(:disabled){
  border-color:var(--jade-dim);color:var(--jade);
  background:var(--jade-soft);
}
.act:disabled{opacity:.26;cursor:not-allowed}
.act.primary{border-color:#2f554c;color:var(--jade);background:rgba(130,185,167,.045)}
.act.primary:hover:not(:disabled){background:rgba(130,185,167,.12);border-color:var(--jade)}
.act.solid{
  background:linear-gradient(180deg,#93c9b6,#6da392);
  border-color:transparent;color:#06100e;font-weight:500;
  letter-spacing:.24em;
}
.act.solid:hover:not(:disabled){
  background:linear-gradient(180deg,#a5d8c6,#7cb2a0);color:#06100e;border-color:transparent;
}
.act.ghost{border-color:transparent;color:var(--dim);font-size:12.5px;padding:9px 12px}
.act.ghost:hover{border-color:var(--line2);color:var(--paper);background:none}
.actions .spacer{flex:1}

/* 触屏没有悬停，按下要当场看见回话 */
.choice:active{background:rgba(18,34,38,.95);border-left-color:var(--jade)}
.act:active:not(:disabled){border-color:var(--jade-dim);color:var(--jade);background:var(--jade-soft)}
.opt:active{background:rgba(16,30,34,.95)}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed;inset:0;z-index:40;
  background:rgba(3,6,7,.88);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
 .overlay.hidden{display:none}
/* 第十五批：地图作为独立主页面展示，而非普通居中弹窗 */
.overlay.map-overlay{padding:0;align-items:stretch;justify-content:stretch;background:rgba(3,7,8,.97);backdrop-filter:blur(8px)}
.modal.map-page{width:100%;max-width:none;height:100vh;height:100dvh;max-height:none;overflow-y:auto;box-sizing:border-box;padding:clamp(16px,3vw,34px);border:0;background:radial-gradient(ellipse at 50% 0%,#12262a 0%,#091114 58%);box-shadow:none;-webkit-overflow-scrolling:touch}
.modal.map-page::before{position:fixed;top:0}
.map-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.map-page-head h3{font-size:19px;letter-spacing:.3em;margin:0 0 6px}
.map-page-head p{font-size:12px;color:var(--dim);line-height:1.7;margin:0}
.map-page-close{flex-shrink:0;border:1px solid var(--line2);background:#0c171a;color:var(--jade);padding:9px 14px;cursor:pointer}
.map-statusbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 18px}
.map-statusbar>div{min-width:0;border:1px solid var(--line);background:rgba(12,25,29,.75);padding:10px 12px}
.map-statusbar small{display:block;color:var(--jade-dim);font-size:10px;letter-spacing:.12em;margin-bottom:5px}
.map-statusbar b{display:block;color:var(--paper);font-size:13px;font-weight:normal;overflow-wrap:anywhere}
.map-page .mapwrap{max-width:100%;margin:0 auto}
.map-page .mapwrap svg{max-height:58vh}
.map-page .world-census{margin-top:18px}
.map-page .modal-actions{position:sticky;bottom:-1px;background:linear-gradient(180deg,rgba(9,17,20,.82),#091114);padding:12px 0 4px;margin-top:12px}
@media(max-width:620px){.modal.map-page{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}.map-page-head h3{font-size:17px}.map-statusbar{grid-template-columns:repeat(2,minmax(0,1fr))}.map-page .mapwrap svg{max-height:none}.map-page .modal-actions{position:static}}
.modal{
  position:relative;
  width:100%;max-width:520px;
  background:linear-gradient(180deg,#0e1a1e,#091114);
  border:1px solid var(--line2);
  padding:28px 30px;
  box-shadow:0 28px 90px rgba(0,0,0,.8);
}
.modal::before{
  content:'';position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(130,185,167,.5),transparent);
}
.modal h3{
  font-size:16px;letter-spacing:.2em;color:var(--jade);font-weight:normal;
  margin-bottom:8px;
}
.modal .sub{font-size:12.5px;color:var(--dim);margin-bottom:20px;line-height:1.95;white-space:pre-wrap}
.modal .stats{display:flex;gap:26px;flex-wrap:wrap;margin:-6px 0 14px;font-size:11.5px;color:var(--paper);letter-spacing:.04em}
.modal .stats b{display:block;font-size:10px;letter-spacing:.22em;color:var(--jade-dim);font-weight:normal;margin-bottom:4px}
.modal .sect{font-size:10.5px;letter-spacing:.26em;color:var(--jade-dim);margin:20px 0 7px}
.modal .saying{font-size:12px;line-height:1.92;color:var(--paper)}
.modal .saying.done{color:#43545699}
.slider-row{display:flex;align-items:center;gap:16px;margin:22px 0}
.slider-row input[type=range]{
  flex:1;-webkit-appearance:none;height:2px;background:var(--line2);outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;background:var(--jade);
  border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(130,185,167,.6);
}
.slider-val{
  font-size:22px;color:var(--jade);min-width:78px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.preview{
  border:1px solid var(--line);background:rgba(8,14,16,.6);
  padding:10px 14px;font-size:12.5px;
  color:var(--dim);line-height:1.95;
}
.preview b{color:var(--paper);font-weight:normal}
.preview .good{color:var(--jade)}
.preview .bad{color:var(--blood)}
.preview .amber{color:var(--amber)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* ---------- MAP ---------- */
.maptabs{display:flex;gap:6px;margin-bottom:16px}
.maptabs button{
  flex:1;background:none;border:1px solid var(--line2);color:var(--dim);
  font-family:inherit;font-size:12px;letter-spacing:.12em;padding:7px 0;cursor:pointer;
}
.maptabs button.on{color:var(--jade);border-color:#2b4a43;background:var(--jade-soft)}
.mapcrumb{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:12px}
.mapcrumb a{color:var(--jade-dim);text-decoration:none;cursor:pointer}
.mapcrumb a:hover{color:var(--jade)}
.mapcrumb .sep{color:#3a4a4e}
.mapcrumb .on{color:var(--paper)}
.mapswitch{display:flex;gap:6px;margin-top:12px}
.mapswitch button{flex:1;background:none;border:1px solid var(--line2);color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.1em;padding:6px 0;cursor:pointer}
.mapswitch button.on{color:var(--jade);border-color:#2b4a43;background:var(--jade-soft)}
.mapstate{cursor:pointer}
.mapstate text{pointer-events:none}
.mapstate:hover text{fill:var(--jade)}
.maplocal{cursor:pointer}
.maplocal text{pointer-events:none}
.maplocal:hover text{fill:var(--jade)}
.mapwrap{position:relative;overflow:hidden;border:1px solid var(--line);background:#070d0f}
.mapwrap svg{display:block;width:100%;height:auto}
.maplegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--dim);letter-spacing:.04em}
.maplegend .mk{display:inline-flex;align-items:center;gap:6px}
.maplegend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.maplegend .dot.here{background:var(--jade);box-shadow:0 0 0 3px rgba(130,185,167,.18)}
.maplegend .dot.been{background:#5d7f74}
.maplegend .dot.heard{background:none;border:1.5px dashed #4f7d70}
.maplegend .dot.locked{background:#22343a}
.mapnode{cursor:pointer}
.mapnode text{pointer-events:none}
.mapnode rect{pointer-events:none}
.mapnode:hover .mplabel{fill:var(--jade)}
.mapnote{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.85;letter-spacing:.02em}
.mapnote b{color:var(--paper);font-weight:normal}

/* ---------- START ---------- */
.start{width:100%;max-width:820px;margin:0 auto;padding:4px 0 24px;overflow-y:auto}
.start h1{
  position:relative;
  font-size:34px;letter-spacing:.5em;font-weight:normal;color:var(--paper);
  margin-bottom:10px;text-indent:.5em;padding-left:20px;
}
.start h1::before{
  content:'';position:absolute;left:0;top:8px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--jade),transparent);
}
.start h1 em{
  font-style:normal;color:var(--jade);
}
.start .lead{font-size:13px;color:var(--dim);line-height:1.92;margin-bottom:14px;letter-spacing:.02em}
.start .lead b{color:var(--paper);font-weight:normal}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:10.5px;letter-spacing:.26em;color:var(--jade-dim);
  margin-bottom:8px;
}
.field input{
  width:100%;background:#0a1316;border:1px solid var(--line2);color:var(--paper);
  font-family:inherit;font-size:15px;padding:9px 14px;outline:none;letter-spacing:.1em;
}
.field input:focus{border-color:var(--jade-dim);background:#0c171a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  position:relative;text-align:left;
  background:rgba(10,18,21,.72);border:1px solid var(--line2);
  color:var(--paper);font-family:inherit;padding:8px 13px;cursor:pointer;
  transition:all .18s;
}
.opt:hover{border-color:#2f4c52;background:rgba(14,26,30,.9)}
.opt.sel{border-color:var(--jade-dim);background:rgba(130,185,167,.11)}
.opt.sel::after{
  content:'';position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:var(--jade);
}
.opt .t{font-size:14.5px;letter-spacing:.08em;display:block;margin-bottom:2px;color:var(--paper)}
.opt.sel .t{color:var(--jade)}
.opt .d{font-size:11.5px;color:var(--dim);line-height:1.55;display:block}

/* ---------- 题 记 / 存 档 ---------- */
.epigraph{
  font-size:12.5px;color:var(--gold);letter-spacing:.22em;opacity:.72;
  margin:-2px 0 14px;padding-left:22px;
}
.start-links{display:flex;gap:18px;flex-wrap:wrap;padding-top:4px}
.start-links button{
  background:none;border:none;border-bottom:1px solid var(--line2);
  color:var(--dim);font-family:inherit;font-size:12px;letter-spacing:.14em;
  padding:3px 1px;cursor:pointer;transition:all .18s;
}
.start-links button:hover{color:var(--jade);border-color:var(--jade-dim)}
.start-links button.danger:hover{color:var(--blood);border-color:#5a2b24}
.slot{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.slot:last-of-type{border-bottom:none}
.slot .info{flex:1;min-width:0}
.slot .nm{font-size:12px;letter-spacing:.16em;color:var(--jade-dim);margin-bottom:3px}
.slot .nm.auto{color:var(--gold-dim)}
.slot .meta{font-size:11.5px;color:var(--paper);line-height:1.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meta .dim{color:var(--dim)}
.slot .meta.empty{color:#4a5b5e;font-style:normal}
.slot .say{
  font-size:11.5px;color:var(--dim);line-height:1.8;margin-top:4px;
  padding-left:9px;border-left:1px solid var(--line2);
}
/* 打听来的事：有期限，所以不能和「据说」一样灰。
   它是这一屏上唯一会过期的字，理应比别的字亮一点。 */
.slot .say.news{color:var(--jade);border-left-color:var(--jade-dim)}
.slot .ops{display:flex;gap:5px;flex:0 0 auto}
.mini{
  background:transparent;border:1px solid var(--line2);color:var(--dim);
  font-family:inherit;font-size:11.5px;letter-spacing:.1em;
  padding:5px 10px;cursor:pointer;transition:all .18s;
}
.mini:hover:not(:disabled){border-color:var(--jade-dim);color:var(--jade)}
.mini.danger:hover:not(:disabled){border-color:#5a2b24;color:var(--blood)}
.mini:disabled{opacity:.22;cursor:not-allowed}

/* 分区条：地点内部的结构（放置江湖式）。点一处，站到那一处。 */
.spots{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.spots .spot{font-size:11.5px;padding:6px 12px;letter-spacing:.08em}
.spots .spot.on{border-color:var(--jade);color:var(--jade);background:var(--jade-soft)}
.spots .spot .spottag{font-size:9px;color:var(--dim);letter-spacing:0;margin-left:6px;opacity:.85}
.spots .spot.on .spottag{color:var(--jade)}
.spotnote{font-size:12px;color:var(--dim);line-height:1.8;margin-top:2px}

/* ---------- PROLOGUE ---------- */
.prologue{width:100%;max-width:720px;margin:0 auto;padding:6px 0 40px}
.pro-kicker{font-size:10.5px;letter-spacing:.34em;color:var(--jade-dim);margin-bottom:26px}
.pro-num{

<script>
"use strict";

/* =========================================================
   参数区：全部可调，改这里就能做数值实验
   ========================================================= */
const CFG = {
  startAge: 8,            // 测灵之后，自炼气一层起
  startLayer: 1,
  lifespan: 100,          // 炼气寿元
  totalNeed: 6846,        // 炼气一至十三层（至圆满）总修为需求 —— xlsx v1.1 单层 123→1335
  layerCount: 13,
  layerRatio: 1.22,       // 每层需求等比递增（与 totalNeed 配套，改动须同时验 123/1335）
  baseOutput: 100,        // 年产灵气（灵根系数 1.0 时）
  walkRate: 0.3,          // 行走时的产出比例
  walkIncome: 40,         // 行走年收入（灵石）
  idleIncome: 110,        // 道尽后（不再修炼）专心营生的年收入
  retreatCost: 8,         // 闭关年耗（灵石）
                          // ★ xlsx v1.1 写「年耗约 30」，但 30 会让炼气段 100% 寿尽（见 10:30 实测）。
                          //   行走年收 40 只够养 1.33 年闭关 → 年产上限 70，需 97.8 年 > 寿元 92。
                          //   取 8（40 养 5 年），待设置表修订后统一。
  retreatMaxPct: 0.12,    // 单次闭关上限 = 寿元 × 12%（炼气 12 年）
  decayPerUse: 0.03,      // 同境界内每闭一次，效率 -3%
                          // ★ xlsx v1.1 写 -5%，但与「到顶年龄压在寿元 85%~94%」冲突：
                          //   6846 ÷（12 年 × 100）= 6.5 次闭关，-5% 累积使总时长多 6~8 年，
                          //   实测圆满龄 91~93（寿元 92），冲关窗口为零、筑基只剩 2~8%。
                          //   取 3% → 圆满龄 83~87、筑基 12~38%。设计案自身矛盾，此处从体验目标。
  decayFloor: 0.50,
  btBase: 0.25,           // 筑基突破基础成功率
  eventRate: 0.40,        // 行走时每年触发事件的概率
  retreatEventRate: 0.12, // 闭关时每年被打断的概率
  monthsPerYear: 12,      // 一年十二个月：修为按月结算，年龄与事件跨年才结算
  daysPerMonth: 30,       // 一月三十日。日子是真的——赶路按日扣，不能再拿月当最小单位
  eraName: '璇玑',        // 世界年号。历由灵界颁、凡界奉行，不随王朝换
  eraStart: 312,          // 开局那一年的璇玑纪年（璇玑元年＝世界历零点）

  /* --- 世事：世上正在发生、过时不候的事 ---
     它们不等玩家。起在哪儿看「事力」（人口与修士数），留几个月看这里，
     玩家在不在都一样走。看得到、赶得上才有份；看不到、走慢了就没有。 */
  liveLifeMin: 2,         // 一桩事最短存续几个月
  liveLifeMax: 3,         // 最长几个月。两个月是「这个季节内」，一年看不出差别
  liveMeet: 0.55,         // 本地有事时，做一件事的一月里碰上的概率
  liveTrace: 2            // 散了以后，痕迹在地上留几个月（给「来晚了」一个说法）
};

/* =========================================================
   日行（依据 docs/时间与距离表_v1.md §1）
   台阶不是爬坡：筑基「解锁御器」是一道断崖，800 里不是 80 里的十倍那么温和。
   现在只有炼气能走到，但表先摆全——以后加境界不必回来改公式。

   ★ 脚程只由境界定，不由地形定。没有「山径打七折」这种折扣：
     设计案把「快」归给境界和神行符（规则二：脚下不是路，是钱），不归给路。
     加折扣等于自己发明一个参数，worldcheck 与文档都会对不上。
   ========================================================= */
/* 脚程只由境界定（REALMS 里的 pace），不由地形定。
   筑基「解锁御器」是一道断崖：800 里不是 80 里的十倍那么温和。 */
function paceOf(s){ return realmInfo(realmOf(s)).pace; }

/* 走这一趟要几天。
   规则一：不足一日者，按一日计——出门、入城、收拾行装都要时间，
   筑基之后走二十里也占一天。 */
function travelDays(li){
  return Math.max(1, Math.ceil((li||0) / paceOf(G)));
}

/* 灵根仍用既有0.90–1.00效率作为本轮基线，取消境界硬锁。
   cap旧字段只保留存档兼容与资质外观评级，不参与突破资格。 */
/* 地点境界门槛：境界只决定能否抵达，不凭空传送。具体行程仍按 ROUTES 的里数和境界日行计算。 */
function placeAvailable(key){
  const p=PLACES[key];
  return !!p && !p.closed && realmOf() >= (p.needRealm||0);
}
function routeAvailable(r){
  return !!r && placeAvailable(r.a) && placeAvailable(r.b) && realmOf() >= (r.needRealm||0);
}

const ROOTS = {
  '绝灵根':   { coef:0.90, cap:0, desc:'感应微弱，修行较慢，仍可积累道基' },

/* 每一世的名字：同一个出身，落在不同的人家。
   '族' 不再由池子抽——家里的姓随你的姓走；留在这里，只当「无名」无姓可随时的备底。 */
const FATE_POOL = {
  '乡': ['落雁村','青溪坞','石门镇','柳家渡','枯井峪','槐荫里','白沙埠'],
  '长者': ['陈老丈','柳婆婆','跛脚周','哑伯','王麻子','瞎眼宋'],

  '仇': ['刘管事','赵家三郎','黑虎帮','押债的孙六']
};

/* 复姓先前认，认不出再按第一个字取姓 */
const COMPOUND_SURNAMES = ['欧阳','司马','上官','诸葛','慕容','司徒','令狐','东方','独孤',
  '南宫','西门','夏侯','皇甫','尉迟','公孙','长孙','宇文','轩辕','端木','澹台'];

/* 这一世的旧宅落在城里的哪一头。按出身给——
   没落家族的开局正文写「旧宅在城西」，这一家就得在城西，不然第一句就说谎。 */
const CLAN_DIR = { '没落家族子弟':'城西', '世家嫡系':'南街' };

/* 后人的名。姓不变，字得换一个——一代一个名，族谱才认得清。 */
const GIVEN_NAMES = ['砚','珪','瑄','瑾','珩','琮','璞','湛','泓','澈',
  '涣','骞','恕','彻','衍','贞','徽','颐','峻','肃','桓','松','鹤','穆'];

/* 拆姓。「无名」不是名字，是没人给你取过名字——那也就没有姓。 */
function splitName(nm){
  const s=String(nm==null?'':nm).trim();
  if(!s || s==='无名') return { surname:'', given:'' };
  for(const c of COMPOUND_SURNAMES) if(s.indexOf(c)===0) return { surname:c, given:s.slice(c.length) };
  return { surname:s.slice(0,1), given:s.slice(1) };
}

/* 家里的名号：方位 + 你的姓 + 氏。你的姓与家里的姓，从此是一回事。
   真没姓可随（「无名」），才退回这一世的池子。 */
function clanName(){
  const sur=(G&&G.surname)||'';
  if(!sur) return pick(FATE_POOL['族']);
  return (CLAN_DIR[(G&&G.origin)||'']||'') + sur + '氏';
}

/* 家人的称呼：短亲属词随你的姓走（沈父／沈母）；
   父亲、祖父、老祖这类长亲属词，和老药师、老乞丐这类外人名，都不套姓。
   没有姓，就只剩一个关系词。 */
const KIN_SHORT = {'爹':'父', '娘':'母'};
function familyName(f){
  const raw=(f&&f.name)||'';
  const sur=(G&&G.surname)||'';
  const kin=KIN_SHORT[raw];
  if(kin && sur) return sur+kin;
  return fillFate(raw);
}

/* 一个「人」在屏幕上叫什么。家人与外人，只差这一层。 */
function personName(n){
  if(!n) return '';
  return String(n.id||'').charAt(0)==='F' ? familyName(n) : fillFate(n.name);
}

function genFate(){
  const f={};
  for(const k in FATE_POOL){ if(k==='族') continue; f[k]=pick(FATE_POOL[k]); }
  f['族']=clanName();        // 家里的姓要看你的姓，所以得等 G.surname 落定再调
  return f;
}
/* 随状态变的占位符，不在地名池里。体检脚本认这张表。 */
const DYN_FATE = ['偶','族'];

function fillFate(t){
  if(!t) return '';
  /* 旧存档可能没有 fate，先补上再替换，否则每次渲染都会换一套地名 */
  if(G && !G.fate) G.fate=genFate();
  const f=(G&&G.fate)||genFate();
  /* 道侣的称呼随你的性别走：你是男，便是「她」；你是女，便是「他」。
     只改这个字，不动正文——「她（他）」那种写法一读就出戏。 */
  const dyn={ '偶': (G&&G.sex==='女') ? '他' : '她' };
  return t.replace(/\{([^{}]+)\}/g,(m,k)=>f[k]||dyn[k]||('{'+k+'}'));
}

/* 地点名。{乡} 一类占位符当场填掉。
   G.fate 在开局就定死了，所以同一局里地名不会变——不会出现「村名每次渲染都换」。 */
function placeName(k){
  k = k || (G && G.place) || 'village';
  const p = PLACES[k];
  return p ? fillFate(p.name) : '路上';
}

/* 已经练到手的功法（键＝功名）。只记「有没有」，不记「练了几重」——文字游戏，重数交给文字。 */
function addArt(s, name){
  s = s||G; s.arts = s.arts||{};
  s.arts[name] = true;
  return name;
}
function hasArt(s, name){ s=s||G; return !!(s.arts && s.arts[name]); }
function hasRoute(s, tag){
  s=s||G; if(!s.arts) return false;
  return Object.keys(s.arts).some(n=>{ const m=MANUALS[n]; return m && m.effect && m.effect.route===tag; });
}
function routeName(tag){ return ({ '遁':'遁术','护':'护身','攻':'攻伐' })[tag]||tag; }
/* 心法合计效果：把已学的所有心法的 absorb/bt/life 加起来 */
function artMindSum(s){
  s=s||G; let a=0,b=0,l=0;
  if(s.arts) Object.keys(s.arts).forEach(n=>{ const m=MANUALS[n];
    if(m && m.kind==='心法'){ a+=m.effect.absorb; b+=m.effect.bt; l+=m.effect.life; } });
  return { absorb:a, bt:b, life:l };
}

/* 开局按出身与身世，把这一世的几个人摆进 G.family。
   已故的不当活人——他们只在「家」那一区留一句牌位。 */
function buildFamily(){
  const tbl=(FAMILY_OF[G.origin]||{})[G.variant]||[];
  G.family=tbl.map((f,i)=>({
    id:'F'+i,
    name:f.name, rel:f.rel||'',
    age: f.age!=null ? f.age : null,
    life: f.life||70,
    sex: f.sex||'男',
    realm: f.realm||'凡人', stage: f.stage||null,
    look: f.look||'', want: f.want||'', knows: f.knows||'',
    alive: f.alive!==false,
    how: f.how||''
  }));
  G.met=G.met||{};
}

/* 家里的人也在老，一年一格。
   你在家，就看得见那一口气断在眼前；不在，回来时只剩一句「前些日子」。
   走了的人进不了「这一带的人」，只在牌位上留个名字。 */
function familyTurn(){
  const fam=G.family||[];
  if(!fam.length) return;
  const home=G.home||G.place;
  fam.forEach(f=>{
    if(!f.alive) return;
    f.age=(f.age||f.life)+1;
    if(f.age<f.life) return;
    f.alive=false; f.diedAt=absMonth();
    if((G.place||'')===home) addLogTo(G,'　'+personName(f)+'去了，就在你眼前。','dn');
    else addLogTo(G,'　你不在家的那些日子，'+personName(f)+'去了。','dn');
  });
}

  text:'一个穿灰袍的男人在客栈里坐到你对面，把一枚黑色玉牌推过来。\n「血河宗在收人。你这资质，在正道里熬一辈子也是个杂役；在我这儿，三年就能筑基。」\n玉牌背面刻着一个字：噬。',
  opts:[
    { l:'收下玉牌', 
      run:s=>{ stoneChange(s,150,'事件与修行'); s.karma+=25; s.attr.gen+=1; s.flag.mo=true;
        return { t:'他教了你一门「噬灵」的粗浅法子——把别处的灵气强夺过来，炼化得粗暴，但快。\n第一次用时你吐了半夜，第二次就顺手了。\n\n<span class="bad">灵石 +150　业力 +25　根骨 +1　已堕魔道</span>', log:'收下血河宗玉牌，业力 +25' }; } },
    { l:'虚与委蛇，先套出他的功法', chance:s=>0.5+(s.attr.wu-5)*0.06,
      ok:s=>{ s.attr.wu+=2; stoneChange(s,40,'事件与修行');
        return { t:'你陪他喝了三夜酒，把话头一点点往功法上引。\n第四夜他起了疑心，你却已经把口诀记全了。\n临走时你还顺了他一袋灵石。\n\n<span class="good">悟性 +2　灵石 +40</span>', log:'套出血河宗口诀，悟性 +2' }; },
      no:s=>{ s.lifespan-=8; s.karma+=10;
        return { t:'他忽然停了话头，盯着你笑：「小友这酒，喝得太急了。」\n话音未落，一股阴寒气息顺着你手腕钻进来。\n你狼狈逃出客栈，那股寒气却在体内留了下来，夜里总在骨头缝里转。\n\n<span class="bad">寿元 -8　业力 +10</span>', log:'套话被识破，中了阴寒之毒' }; } },
    { l:'把玉牌推回去', 
      run:s=>{ s.attr.xin+=1;
        return { t:'你把玉牌推回去，说：「我走得慢，但想走得干净。」\n他收起玉牌，也不恼：「这话我听过很多次。三年后再问，希望你还这么说。」\n\n<span class="good">心性 +1</span>', log:'拒绝血河宗，心性 +1' }; } }
  ]},

{ id:'E011', name:'灵眼小泉', place:'cliff', spot:'半山泉', once:true, w:8,
  text:'你在山腹里发现一处微型灵眼，泉眼只有脸盆大，灵气却比外头厚出三成。\n若在此处布个小聚灵阵，往后闭关能省不少力。\n只是这地方离官道不远，藏不住太久。',
  opts:[
    { l:'布阵独占，谁也不告诉', cost:60,
      run:s=>{ s.buff.vein=6;
        return { t:'你花了半年，用六十灵石的材料在洞口布了个粗陋的遮蔽阵。\n此后六年，这里就是你的洞府。\n\n<span class="good">灵石 -60　此后六年闭关效率提升</span>', log:'布阵独占灵眼，六年闭关加成' }; } },
    { l:'报给宗门，换个内门名额', cond:s=>s.origin!=='寒门散修',
      run:s=>{ stoneChange(s,120,'事件与修行'); addFame(s,'修士','temple',1);
        return { t:'执事亲自来看过，当场赏了你一百二十灵石，另记一功。\n灵眼归了观里，你得了名声，也失了一处洞天。\n\n<span class="good">灵石 +120　声望 +1</span>', log:'上报灵眼，得赏 120 灵石' }; } },
    { l:'不布阵，只是常来打坐', 
      run:s=>{ s.cult+=120;
        return { t:'你没有布阵——阵要材料，材料要钱，钱要从别处挣。\n你只是每隔几日来坐一坐，坐得不久，但每次都觉得气息顺一些。\n\n<span class="good">修为 +120</span>', log:'常往灵眼打坐，修为 +120' }; } }
  ]},

{ id:'E012', name:'县城拍卖', place:'county', spot:'坊市口', once:true, w:9,
  text:'县城一年一度的拍卖会，入场要十灵石。\n拍品名录上，第三件是一部残缺的《纳气诀》，第七件是一枚延寿丹（据说能添五年），第十二件是一柄下品飞剑。',
  opts:[
    { l:'花十灵石入场，只在一旁看', cost:10,
      run:s=>{ s.attr.wu+=1;
        return { t:'你坐在最后一排，看了整整一天。\n看那些人为一件东西把价抬到离谱，也看有人拍下东西出门就被人跟上。\n散场时你想，这世上的钱是怎么流的，今天算是看明白了。\n\n<span class="good">悟性 +1</span>', log:'旁观拍卖会，悟性 +1' }; } },
    { l:'入场，拍那枚延寿丹', cost:10, chance:s=>s.stones>=160?0.75:0.1,
      ok:s=>{ stoneChange(s,-(150),'事件与修行'); s.lifespan+=5;
        return { t:'你举了三次牌，最后以一百五十灵石拿下。\n丹入口即化，一股温气散到四肢百骸。你觉得身子轻了些。\n\n<span class="good">灵石 -150　寿元 +5</span>', log:'拍得延寿丹，寿元 +5' }; },
      no:s=>({ t:'价钱一路抬到二百灵石，你举到一半就放下了手。\n丹被前排一个胖子拿走，他连看都没看，随手揣进袖里。\n\n<span class="bad">入场费 10 灵石</span>', log:'延寿丹未拍得' }) },
    { l:'入场，拍那部《纳气诀》', cost:10, chance:s=>s.stones>=70?0.8:0.15,
      ok:s=>{ stoneChange(s,-(60),'事件与修行'); s.attr.wu+=1; s.cult+=80;
        return { t:'六十灵石，没人跟你抢。\n这部《纳气诀》虽然残缺，讲得却比观里的通识册子细。你连夜读完，许多从前想不通的地方忽然通了。\n\n<span class="good">灵石 -60　悟性 +1　修为 +80</span>', log:'拍得《纳气诀》，悟性 +1' }; },
      no:s=>({ t:'有人跟你咬价，一直咬到一百二十灵石。\n你算了算口袋，放弃了。\n\n<span class="bad">入场费 10 灵石</span>', log:'《纳气诀》未拍得' }) }
  ]},

{ id:'E013', name:'故人托孤', place:'any', once:true, w:7,
  text:'一个你只见过两面的老修士躺在破庙里，气息已经散了大半。\n他身边蹲着个八九岁的孩子：「我这孙子，测出有三灵根。你带他走，别让他回那个家。」\n他从枕下摸出一只布袋，里面有二百灵石。',
  opts:[
    { l:'应下这件事', 
      run:s=>{ stoneChange(s,200,'事件与修行'); s.ward=true; s.attr.xin+=1;
        return { t:'老人把布袋塞给你，又摸了摸孩子的头，当天夜里就走了。\n孩子叫阿宁，很安静，不怎么哭。\n此后你身边多了个人，吃饭多一双筷子，赶路多一双脚。\n\n<span class="good">灵石 +200　心性 +1　收养阿宁</span>', log:'受托收养阿宁，得 200 灵石' }; } },
    { l:'收下灵石，把孩子送到善堂', 
      run:s=>{ stoneChange(s,200,'事件与修行'); s.karma+=10;
        return { t:'你把孩子送到城里的善堂，给了十灵石，让管事多照看些。\n他站在门口看着你走，没哭，也没喊。\n\n<span class="bad">灵石 +200　业力 +10</span>', log:'收灵石，将阿宁送善堂，业力 +10' }; } },
    { l:'不接这桩因果', 
      run:s=>({ t:'你退出破庙，把门掩上。\n走出半里地，回头看了一眼——庙里没有声音。', log:'未接托孤' }) }
  ]},

{ id:'E014', name:'气机岔乱', place:'any', once:true, w:8,
  text:'这天运功到第三周天，气机忽然在膻中一顿，像被什么卡住。\n冷汗一下子下来了——这是走火的先兆。\n你可以强行压下去，也可以就此散功重来。',
  opts:[
    { l:'强行压下去', chance:s=>0.5+(s.attr.xin-5)*0.06,
      ok:s=>{ s.attr.xin+=1; s.cult+=60;
        return { t:'你咬住牙关，把那股乱气一点点按回经脉里。\n半个时辰后，气机顺了，膻中处竟比从前通畅。\n\n<span class="good">心性 +1　修为 +60</span>', log:'压下气机，心性 +1' }; },
      no:s=>{ s.cult=Math.floor(s.cult*0.7); s.lifespan-=6; s.injured=3;
        return { t:'压不住。\n那股气炸开的时候，你听见自己体内有什么东西裂了。\n醒来已是三天后，修为散了三成，经脉里留了一道暗伤。\n\n<span class="bad">修为 -30%　寿元 -6　受伤三年</span>', log:'强压失败，走火伤身' }; } },
    { l:'散功重来', 
      run:s=>{ s.cult=Math.floor(s.cult*0.55); s.attr.xin+=1;
        return { t:'你缓缓收功，任那口乱气散回天地。\n修为退了一截，但经脉干净。\n老一辈常说：亏得起的，才叫修为。\n\n<span class="bad">修为 -45%</span>　<span class="good">心性 +1</span>', log:'散功重来，修为 -45%' }; } },
    { l:'不管它，先停下来歇几日', 
      run:s=>{ s.age+=1;
        return { t:'你收了功，什么也不做，在山里闲走了一年。\n回来再运功时，那道滞涩竟自己通了。\n\n<span class="mute">时间 -1 年</span>', log:'停功一年，气机自通' }; } }
  ]},

{ id:'E015', name:'猎户除妖', place:'village', spot:'北坡', once:true, w:9,
  text:'山脚猎户跪在你面前，说后山出了头野猪妖，已经叼走三个人。\n「仙师若肯出手，我们凑了八十灵石。」\n他手里捧着的布袋，补丁摞着补丁。',
  opts:[
    { l:'出手，分文不取', chance:s=>0.5+(s.attr.gen-5)*0.06,
      ok:s=>{ s.karma-=15; addFame(s,'凡人','village',1); s.attr.gen+=1;
        return { t:'你追了它两天，在一处泥潭边堵住了。\n野猪妖不算强，但皮糙肉厚，你受了些擦伤才把它钉在地上。\n回村时，猎户们把八十灵石硬塞进你怀里，你只收了十块做药钱。\n\n<span class="good">业力 -15　声望 +1　根骨 +1</span>', log:'斩杀野猪妖，业力 -15' }; },
      no:s=>{ s.lifespan-=5; s.injured=3;
        return { t:'那畜生的獠牙比你想的硬。\n你被撞飞出去，肋骨断了两根，它跑了。\n猎户们把你抬回村，请了郎中，八十灵石全花在药上。\n\n<span class="bad">寿元 -5　受伤三年</span>', log:'除妖失败，重伤' }; } },
    { l:'出手，八十灵石照收', chance:s=>0.5+(s.attr.gen-5)*0.06,
      ok:s=>{ stoneChange(s,80,'事件与修行'); 
        return { t:'你追了两天，把它钉死在泥潭边。\n回来领了八十灵石，一句话没多说就走了。\n身后有人低声说：「仙师也是要吃饭的。」\n\n<span class="good">灵石 +80</span>', log:'除妖得 80 灵石' }; },
      no:s=>{ s.lifespan-=5; s.injured=3;
        return { t:'你低估了它。\n肋骨断了两根，野猪妖跑了。猎户们没说什么，只是把布袋收了回去。\n\n<span class="bad">寿元 -5　受伤三年</span>', log:'除妖失败，重伤' }; } },
    { l:'这不关你的事', 
      run:s=>{ s.karma+=6;
        return { t:'你说自己修为不济，转身走了。\n半年后路过，那个村子已经空了，坟头添了三座新的。\n\n<span class="bad">业力 +6</span>', log:'拒绝除妖，业力 +6' }; } }
  ]},

{ id:'E016', name:'玉简夜光', place:'any', once:true, w:20, cond:s=>s.origin==='寒门散修' && s.flag['残页'],
  text:'那卷残页买回来三年，今夜忽然发烫。\n你把灯吹了，纸面上的字竟自己浮起来，一行行往下走，走到末尾，落出一句：\n「气非纳于身，纳于天地；身非器，器在身外。」\n下面还有一行小字，写着某处地名。',
  opts:[
    { l:'按图索骥，去那个地方看看', 
      run:s=>{ s.age+=2; s.attr.wu+=3; s.cult+=120; s.flag.yujian=true;
        return { t:'你走了两年，在一处荒废的道观底下找到一间密室。\n室里只有一块石碑，碑上刻着半部《引气篇》的下卷——原来你手里那卷，只是上半。\n你在碑前坐了七日，把字一个个刻进心里。\n\n<span class="good">悟性 +3　修为 +120　时间 -2 年</span>', log:'循玉简寻得《引气篇》下卷，悟性 +3' }; } },
    { l:'先把字抄下来，慢慢参', 
      run:s=>{ s.attr.wu+=1; s.cult+=50;
        return { t:'你连夜抄了三遍，抄到天亮，纸上的字迹又淡了，最后什么也看不见。\n但抄下来的东西还在。\n\n<span class="good">悟性 +1　修为 +50</span>', log:'抄录玉简文字，悟性 +1' }; } },
    { l:'烧了它——来路不明的东西最要命', 
      run:s=>{ s.karma+=5;
        return { t:'你把残页丢进火里。\n它在火中卷了一下，竟发出一声极轻的叹息，然后才化成灰。\n此后你偶尔还会梦见那行字。\n\n<span class="bad">业力 +5</span>', log:'焚毁玉简，业力 +5' }; } }
  ]},

{ id:'E017', name:'宗门招录', place:'temple', spot:'山门', once:true, w:10, cond:s=>s.origin!=='宗门外门弟子' && s.origin!=='世家嫡系',
  text:'{观}三年一度的外门招录开在山门外的石坪上。\n执事说，灵根达标者入外门，达标且有推荐者入内门，都不达标的，去挑水。\n你站在人群里，前面排着两百多人。',
  opts:[
    { l:'应试', chance:s=>0.35+(s.coef-0.9)*2.5+(s.attr.wu-5)*0.04,
      ok:s=>{ s.origin='宗门外门弟子'; stoneChange(s,60,'事件与修行'); s.flag.sect=true;
        return { t:'测灵石在你掌下亮了一瞬——不算亮，但够格。\n你换上青袍那天，执事把一枚铜牌拍在你手里，说：「三年一考。」\n\n<span class="good">成为外门弟子　灵石 +60</span>', log:'考入青云观外门' }; },
      no:s=>{ 
        return { t:'测灵石亮了一下就暗了，执事头也不抬：「下一个。」\n你被人流挤到石坪外，站了很久。\n\n<span class="bad">未能入门</span>', log:'招录落第' }; } },
    { l:'不去应试，靠自己也一样', 
      run:s=>({ t:'你从人群后面退出来。\n石坪上还在念名字，一声接一声，像在点别人的命。', log:'放弃宗门招录' }) }
  ]},

{ id:'E018', name:'道侣之约', place:'any', once:true, w:8,
  text:'你在溪边遇见一个同样在此打坐的修士，姓温，性子很静。\n三年来往，话不多，但每次都能说到一处。\n这天{偶}忽然问：「你想过结伴吗？」',
  opts:[
    { l:'应下这门道侣之约', 
      run:s=>{ s.attr.xin+=2; s.lifespan+=3; s.hasMate=true; s.mateRoot=randMateRoot(s);
        return { t:'你们在山神庙前拜了天地，没有宾客，只有一炉香。\n此后修行有个说话的人，闭关有个守关的人，夜里有人替你添灯。\n\n<span class="good">心性 +2　寿元 +3　已有道侣</span>', log:'与温氏结为道侣' }; } },
    { l:'说还不到时候', 
      run:s=>({ t:'你说想先把境界稳下来。\n{偶}点点头，说：「那我等你。」\n此后你们仍常来往，只是再没提过这件事。', log:'暂缓道侣之约' }) },
    { l:'我们只谈修行，不谈别的', 
      run:s=>{ s.attr.wu+=1;
        return { t:'你把话说得很清楚。{偶}听完，笑了一下，说好。\n此后多年，你们仍在一处论道，只是溪边再没有第三个影子。\n\n<span class="good">悟性 +1</span>', log:'只论道，不结缘，悟性 +1' }; } }
  ]},

{ id:'E019', name:'灵兽幼崽', place:'ridge', spot:'半山老林', once:true, w:8,
  text:'乱石堆里有一只幼兽，灰扑扑的，前腿断了，正呜呜地叫。\n看牙口，是青纹狼的崽子——养大了能当脚力，也能打架。\n但它现在连站都站不起来。',
  opts:[
    { l:'把它抱回去养', 
      run:s=>{ stoneChange(s,-(25),'事件与修行'); s.beast='青纹狼'; s.lifespan-=1;
        return { t:'你花了半年把它养好。它认了你，走哪跟哪。\n伤好之后它长得很快，不到两年就有半人高——快得有些反常。\n\n<span class="good">灵石 -25　得青纹狼</span>', log:'收养青纹狼幼崽' }; } },
    { l:'卖给兽栏', 
      run:s=>{ stoneChange(s,55,'事件与修行');
        return { t:'兽栏老板看了看，说这崽子筋骨不错，给了五十五灵石。\n你接过钱的时候，它正被人拎着后颈，还在看你。\n\n<span class="good">灵石 +55</span>', log:'卖出狼崽，得 55 灵石' }; } },
    { l:'放它在原地', 
      run:s=>({ t:'你退开几步。它叫了一阵，声音渐渐低下去。\n三天后你再经过，那里什么也没有了。', log:'未救狼崽' }) }
  ]},

{ id:'E020', name:'岁月催人', place:'any', once:true, w:30, cond:s=>s.age>=55 && !s.flag.warned,
  text:'你照镜时，看见鬓角的白。\n这些年修行的进度，你自己最清楚——若照这个势头下去，恐怕撑不到圆满。\n世上有延寿的法子：丹药、换血、借他人之寿，没有一样是干净的。',
  opts:[
    { l:'加倍修行，能拖一日是一日', 
      run:s=>{ s.buff.haste=8; s.flag.warned=true;
        return { t:'你把每日打坐的时辰又添了两个。\n灯油、丹药、灵石的消耗都跟着上去了，但你没停。\n\n<span class="good">此后八年修行效率提升</span>', log:'加倍苦修，八年效率提升' }; } },
    { l:'花钱寻访延寿之法', cost:120, 
      run:s=>{ s.lifespan+=8; s.flag.warned=true;
        return { t:'你辗转找到一位老丹师，花一百二十灵石买了一炉温养气血的药。\n药不好，但有用。你觉得身子松快了些。\n\n<span class="good">灵石 -120　寿元 +8</span>', log:'求延寿药，寿元 +8' }; } },
    { l:'就这样吧，该来的总要来', 
      run:s=>{ s.attr.xin+=2; s.flag.warned=true;
        return { t:'你把镜子扣在桌上，出门去看了一场落日。\n那天之后，修行照旧，只是心里那块石头落了地——落地的石头，就不算压着了。\n\n<span class="good">心性 +2</span>', log:'直面寿元，心性 +2' }; } }
  ]},

{ id:'E032', name:'旧伤复发', place:'any', once:false, w:8, cd:10,
  text:'多年前那道暗伤，今秋又疼了起来。\n你按着伤处，能觉出那里有一线旧气，像没燃尽的火星，一遇换季就燎一下。\n若不理会，怕是要拖成暗疾；若要根治，得去坊市淘一味温养经脉的药。',
  opts:[
    { l:'硬扛过去，省下灵石', 
      run:s=>{ s.lifespan-=2; s.attr.xin+=1;
        return { t:'你咬着牙熬过这个秋天，伤处到底慢慢静了下去。\n疼过这一回，你对痛就多了一分耐性。\n\n<span class="bad">寿元 -2</span>　<span class="good">心性 +1</span>', log:'硬扛旧伤，寿元 -2，心性 +1' }; } },
    { l:'花灵石配一剂温养的药', cost:40,
      run:s=>{ s.lifespan+=3;
        return { t:'你去了趟坊市，配了剂温养经脉的药。\n药不便宜，但几帖下去，那线旧气到底灭了，伤处松快了许多。\n\n<span class="good">灵石 -40　寿元 +3</span>', log:'配药根治旧伤，寿元 +3' }; } },
    { l:'先放一放，看它自己会不会好', 
      run:s=>{ s.age+=1;
        return { t:'你想着忍忍就过去了，谁料拖了一年，疼是轻了，气却凝成了顽疾，以后再难清净。\n\n<span class="mute">时间 -1 年　落下病根</span>', log:'拖延旧伤，落下病根' }; } }
  ]},

{ id:'E033', name:'坊市偶遇', place:'any', once:false, w:7, cd:6,
  text:'你在赶集的路上，撞见一个摆摊的散修。\n他摊上零零散散摆着几样东西，看你有意，压低声音：「兄台，我这几日手头紧，贱卖换路费。都是正经来路。」',
  opts:[
    { l:'挑一件合用的买下', cost:30,
      run:s=>{ const g=['一张残页','一枚旧符','一小瓶聚气散'][ri(0,2)]; s.attr.wu+=1;
        return { t:'你翻了翻，挑了一件还看得过去的——'+g+'。\n摊主喜出望外，多塞了你一句闲话：最近东边闹得紧，没事别往深山里走。\n\n<span class="good">灵石 -30　得'+g+'　悟性 +1</span>', log:'坊市偶遇，买下'+g }; } },
    { l:'只问价，不掏钱', 
      run:s=>{ stoneChange(s,0,'事件与修行'); s.flag.rumor=1;
        return { t:'你问了价，摇摇头走了。\n走出几步，听见身后那摊主叹了一声：「这年头，买卖不好做。」\n你倒得了句有用的：西头收旧物的老头，什么都要。\n\n<span class="mute">得一句市面上的消息</span>', log:'坊市问价，得消息' }; } },
    { l:'买下他那批货，让他赶紧走', cost:80,
      run:s=>{ stoneChange(s,80,'事件与修行'); s.karma+=5;
        return { t:'你把他那点货整个包了，另加了十灵石路费。\n他愣住，好半天才说：「仙师，您这份心，我记下了。」\n\n<span class="good">灵石 -80</span>　<span class="bad">业力 +5</span>', log:'资助散修，业力 +5' }; } }
  ]},

{ id:'E034', name:'气血翻涌', place:'any', once:false, w:8, cd:8,
  text:'这一年你进境颇快，气血也跟着翻涌，夜里常常睡不着。\n不是病，是根骨到了要淬炼的关口——要么顺其自然熬过去，要么寻一味灵物助你稳固。',
  opts:[
    { l:'顺其自然，熬过这阵', 
      run:s=>{ s.cult+=40; s.attr.gen+=1;
        return { t:'你不去管它，任气血自己翻腾。\n几月下来，那口浊气到底排了出去，根骨反而更扎实了一分。\n\n<span class="good">修为 +40　根骨 +1</span>', log:'顺气淬体，根骨 +1' }; } },
    { l:'寻灵物稳固根基', cost:50,
      run:s=>{ s.cult+=80; s.lifespan+=2;
        return { t:'你花五十灵石，托人寻了味温性的灵草。\n服下之后气血立时定了，多年亏空也被补上些许。\n\n<span class="good">灵石 -50　修为 +80　寿元 +2</span>', log:'服灵物稳固根基，修为 +80' }; } },
    { l:'强行压制，不让它乱', chance:s=>0.5+(s.attr.xin-5)*0.06,
      ok:s=>{ s.attr.xin+=1; s.cult+=50;
        return { t:'你以心性强压，硬是把翻涌的气血按回正轨。\n事后虽有些虚，但神智清明，隐隐摸到一层更高的门径。\n\n<span class="good">心性 +1　修为 +50</span>', log:'强压气血，心性 +1' }; },
      no:s=>{ s.lifespan-=3; s.injured=2;
        return { t:'压过头了。\n气血反噬，你在床上躺了半个月，伤了根基。\n\n<span class="bad">寿元 -3　受伤两年</span>', log:'强压失败，气血反噬' }; } }
  ]},

{ id:'E035', name:'故人捎信', place:'any', once:false, w:6, cd:12,
  text:'一个走镖的汉子寻到你，递上一封信，说是位故人托他带来的。\n你拆开看，字不多，只写着某某地方新起了桩事，问你要不要去看一眼。\n信末没有署名，只画了道淡淡的记号。',
  opts:[
    { l:'循着信上的地方去一趟', chance:s=>0.5+(s.attr.wu-5)*0.05,
      ok:s=>{ s.attr.wu+=1; s.cult+=60;
        return { t:'你按信上所指去了。\n那地方果然有桩机缘，虽不算大，却与你眼下的修行正合。\n你在那里盘桓数日，回来时心里多了一分通透。\n\n<span class="good">悟性 +1　修为 +60</span>', log:'循信寻得机缘，悟性 +1' }; },
      no:s=>{ s.age+=1;
        return { t:'你依约赶去，却扑了个空——那桩事早已散了，白走一趟。\n\n<span class="mute">时间 -1 年　白跑一趟</span>', log:'循信扑空，白走一年' }; } },
    { l:'把信收下，暂时不去', 
      run:s=>{ s.flag.letter=1;
        return { t:'你把信折好收进怀里。\n有些事急不得，时候到了自然有分晓。\n\n<span class="mute">留待来日</span>', log:'收下故人信，未动身' }; } },
    { l:'烧了信，当没这回事', 
      run:s=>{ s.attr.xin+=1;
        return { t:'你把信凑到灯上，看着它一点点卷成灰。\n有些来路不明的东西，还是趁早断了干净。\n\n<span class="good">心性 +1</span>', log:'焚信断因果，心性 +1' }; } }
  ]},

{ id:'E021', name:'心魔夜', retreat:true, once:false, w:12, cd:20,
  text:'闭关到第七年，梦里有人叫你的名字。\n你睁眼，洞里没有别人，只有自己的呼吸声。\n但那声音还在，一遍一遍，像从很远的地方传来，又像贴在后颈上。',
  opts:[
    { l:'咬破舌尖，强行出定', 
      run:s=>{ s.lifespan-=3; s.attr.xin+=1; if(s.flag) s.flag.heartDemon=false;
        return { t:'血腥味在嘴里散开，那声音断了。\n你扶着石壁站起来，腿在抖，但神智清了。\n这一夜之后，你睡觉都留着一分醒。\n\n<span class="bad">寿元 -3</span>　<span class="good">心性 +1</span>', log:'破舌尖驱心魔，寿元 -3，心性 +1' }; } },
    { l:'顺着声音去看', chance:s=>0.55+(s.attr.xin-5)*0.06,
      ok:s=>{ s.attr.wu+=2;
        return { t:'你顺着那声音走，走到自己的丹田里去了。\n那里有一道你自己都没发现的裂缝，气从这里漏了很多年。\n你把它补上了。\n\n<span class="good">悟性 +2</span>', log:'随声入定，补上丹田裂隙，悟性 +2' }; },
      no:s=>{ s.cult=Math.floor(s.cult*0.8); s.lifespan-=5; s.flag=s.flag||{}; s.flag.heartDemon=true;
        return { t:'你追着那声音走，走了很久，忽然发现自己已经不在洞里。\n那是一片什么都没有的地方。你在里面待了不知多久，才被自己的一声咳嗽惊醒。\n\n<span class="bad">修为 -20%　寿元 -5</span>', log:'入心魔幻境，修为与寿元俱损' }; } },
    { l:'不理它，继续坐下去', chance:s=>0.45+(s.attr.xin-5)*0.05,
      ok:s=>{ s.cult+=100;
        return { t:'你把那声音当成风声。\n它叫了三天三夜，第四天早上自己停了。\n此后你坐得更稳了些。\n\n<span class="good">修为 +100</span>', log:'不为心魔所动，修为 +100' }; },
      no:s=>{ s.lifespan-=6; s.injured=2; s.flag=s.flag||{}; s.flag.heartDemon=true;
        return { t:'声音不停，你也不停。\n第五天，你从蒲团上栽下去，醒来时嘴角有血。\n那声音走了，但你的经脉被它磨掉一层。\n\n<span class="bad">寿元 -6　受伤两年</span>', log:'强撑心魔，反受其伤' }; } }
  ]},

{ id:'E022', name:'静中一线', retreat:true, once:true, w:10,
  text:'某个瞬间，你听不见自己的心跳了。\n四周极静，静得能听见灵气在石壁的纹路里慢慢流。\n这种感觉只维持了三息，但你知道它是什么。',
  opts:[
    { l:'抓住它，往里再走一步', chance:s=>0.5+(s.attr.wu-5)*0.07,
      ok:s=>{ s.cult+=200; s.attr.wu+=1;
        return { t:'你顺着那一线往里走，走了不知道多久。\n出来时，天光已经换了三次颜色。\n丹田里的气，比先前厚了将近一倍。\n\n<span class="good">修为 +200　悟性 +1</span>', log:'静中得悟，修为 +200' }; },
      no:s=>{ s.cult=Math.floor(s.cult*0.9);
        return { t:'那一线太细，你抓得太急。\n它断了。\n你睁开眼，洞里还是那个洞，只是心里空了一块。\n\n<span class="bad">修为 -10%</span>', log:'追悟失败，修为 -10%' }; } },
    { l:'怕是走火，先收功', 
      run:s=>{ s.attr.xin+=1;
        return { t:'你缓缓收功，把那一线放走了。\n有些东西不是这个境界该拿的——这个道理，你是后来才懂的。\n\n<span class="good">心性 +1</span>', log:'收功自守，心性 +1' }; } }
  ]},

{ id:'E023', name:'叩关', retreat:true, once:false, w:11, cd:25,
  text:'洞门外有人敲了三下。\n闭关前你封了洞口，除了自己，没人知道这个位置。\n敲门声停了，外面没有脚步声走远。',
  opts:[
    { l:'开门', chance:s=>0.5+(s.attr.qi-5)*0.06,
      ok:s=>{ stoneChange(s,90,'事件与修行');
        return { t:'门外是个抱着孩子的妇人。她说山下遭了匪，走投无路，看见洞口有光。\n你给了她一些干粮和灵石，指了条下山的近路。\n她走后，你在门口站了一会儿——原来这地方，是能看见光的。\n\n<span class="good">灵石 -30　业力 -8</span>', log:'开门助人，业力 -8' }; },
      no:s=>{ stoneSet(s,Math.floor(s.stones*0.5),'事件与修行'); s.lifespan-=4;
        return { t:'门外是三个人。他们等的就是门开的那一刻。\n你被打晕，醒来时洞里被翻得乱七八糟。\n所幸没死——他们只要钱。\n\n<span class="bad">灵石 -50%　寿元 -4</span>', log:'开门遇袭，损财损寿' }; } },
    { l:'不理，继续坐', 
      run:s=>{ s.cult+=70;
        return { t:'你闭上眼，把敲门声当成雨点。\n它敲了很久，然后停了。\n你没有起身。\n\n<span class="good">修为 +70</span>', log:'闭门不出，修为 +70' }; } },
    { l:'从石缝里往外看', 
      run:s=>{ s.attr.qi+=1;
        return { t:'你贴着石缝看了半个时辰。\n外面的人等得不耐烦，骂了一句，走了。\n你记住了他的声音。\n\n<span class="good">气运 +1</span>', log:'暗中窥探，气运 +1' }; } }
  ]},

/* ===== 县城：4 条（E024–E027）=====
   place:'county' 现在生效了：tryEvent 只在县城抽得到它们。
   这 4 条按「年」计成本，所以可以直接进池——它们本来就在行走的范围里。 */

{ id:'E024', name:'征丁', place:'county', spot:'县衙', once:true, w:10,
  text:'城门上贴了新告示：修北堤，征丁三千，凡在册男丁，一户出一人。\n执笔的吏员抬头看了你一眼，把册子翻到另一页：「有修为的更该去，一个顶三个。」\n工期一年。管饭，不给钱。',
  opts:[
    { l:'应役，去修一年堤',
      run:s=>{ s.age+=1; s.attr.gen+=1; stoneChange(s,10,'事件与修行');
        return { t:'北堤的活是抬石头。石头从河里捞，抬上来，垒上去，再抬下一块。\n三个月后你手上不再起泡；半年后，你一个人能抬两人份。\n一年期满，监工在你名字上画了个圈，扔给你十块灵石，说：「明年别来了。」\n\n<span class="bad">时间 -1 年</span>　<span class="good">根骨 +1　灵石 +10</span>', log:'应役修堤一年，根骨 +1' }; } },
    { l:'纳钱免役', cost:60,
      run:s=>({ t:'吏员收了钱，笔尖在册子上轻轻一勾，连头都没抬。\n「下一个。」\n你走出县衙，看见门口还排着几十个人，有人正把家里的铜钱一枚一枚数出来。\n\n<span class="good">灵石 -60</span>', log:'纳六十灵石免役' }) },
    { l:'连夜出城', chance:s=>0.55+(s.attr.qi-5)*0.05,
      ok:s=>({ t:'你赶在关城门前出了城，在断云崖下躲了半个月。\n回来时北堤已经开工，册子上你的名字被划掉了，旁边写着两个字：逃丁。\n没有人来找你。这个县太大，一年跑掉的人不止你一个。\n\n<span class="mute">什么也没有发生</span>', log:'逃丁，未被追究' }),
      no:s=>{ stoneSet(s,Math.max(0,s.stones-30),'事件与修行'); s.injured=Math.max(s.injured,2); s.lifespan-=2;
        return { t:'城门口有人守着，专查夜里出城的人。\n你被按住的时候，腰上还别着行李。杖二十，罚三十灵石，押回北堤补了两个月。\n\n<span class="bad">灵石 -30　寿元 -2　受伤两年</span>', log:'逃丁被捉，杖罚' }; } }
  ]},

{ id:'E025', name:'押货', place:'county', spot:'南门', once:false, w:10, cd:8,
  text:'米行的掌柜拦住你，说有一批货要往云安府去，一千二百里，来回一个月。\n「路上不太平。你若有修为，给八十灵石。」\n他伸出三根手指：「丢了货，你自己看着办。」',
  opts:[
    { l:'应下，押到府城', chance:s=>0.6+(s.attr.gen-5)*0.05,
      ok:s=>{ stoneChange(s,80,'事件与修行');
        return { t:'货是十二车陈米，压得很实。走了半个月，云安府的城墙比县里的高出三倍。\n卸货那日，掌柜的旧识请你们吃了顿饭。席间有人说，今年秋天万宝楼要开一场，筑基以上才准进。\n回来时你身上多了八十灵石，和一句没处用的话。\n\n<span class="good">灵石 +80　得一条消息</span>', log:'押货至云安府，得 80 灵石' }; },
      no:s=>{ s.injured=Math.max(s.injured,2); stoneSet(s,Math.max(0,s.stones-20),'事件与修行');
        return { t:'走到半路，前面横了三棵树。\n你护住了车，没护住自己——肋下挨了一刀，货被抢走两车。\n掌柜的没说什么，只从工钱里扣了二十灵石。\n\n<span class="bad">受伤两年　灵石 -20</span>', log:'押货遇劫，受伤' }; } },
    { l:'只送到县界',
      run:s=>{ stoneChange(s,25,'事件与修行');
        return { t:'你把车送到县界的界碑下，卸了责任。\n掌柜的给了二十五灵石，说下次还找你——客气话，你知道。\n\n<span class="good">灵石 +25</span>', log:'押货至县界，得 25 灵石' }; } },
    { l:'不接',
      run:s=>({ t:'你说自己脚程慢，怕误了人家的生意。\n掌柜的笑了笑，转头去问下一个人。\n\n<span class="mute">什么也没有发生</span>', log:'未接押货' }) }
  ]},

{ id:'E026', name:'客栈闲话', place:'county', spot:'东街', once:false, w:12, cd:4,
  text:'客栈的堂屋里坐着三个人，说话不避人。\n一个说{观}要收外门，今年不看出身看根骨；一个说北边荒原夜里总有光，不知是哪一处；\n第三个只是喝酒，听了半天，忽然说：「你们说的那些地方，我都没去过。」',
  opts:[
    { l:'请他们喝一壶', cost:5,
      run:s=>{ s.attr.qi+=1;
        return { t:'一壶酒下去，话就多了。\n{观}的事是真的——那人有个亲戚在山门外挑水，说这回要招两百人；\n荒原的事他说不准，只说见过光的人回来之后，都不肯再提。\n\n<span class="good">气运 +1　得两条传闻</span>', log:'请酒，得两条传闻' }; } },
    { l:'坐着听，不搭话',
      run:s=>({ t:'你要了一碗最便宜的面，坐了半个时辰。\n他们说到后来自己吵起来了，一个说荒原的光是鬼火，一个说是有人在炼东西。\n散场时你只记住了一句：{观}要收人。\n\n<span class="mute">得一条模糊的传闻</span>', log:'旁听客栈闲话' }) },
    { l:'不感兴趣，回房',
      run:s=>({ t:'你上了楼。楼下的声音隔着一层板，听不真切，像水。\n\n<span class="mute">什么也没有发生</span>', log:'未听闲话' }) }
  ]},

{ id:'E027', name:'县学失火', place:'county', spot:'书院', once:true, w:8,
  text:'半夜，县学那边红了半边天。藏书楼烧起来了，火头从二楼窜到屋檐。\n有人往火里泼水，也有人往外搬书——搬出来的书，没有再搬回去。',
  opts:[
    { l:'帮着救火',
      run:s=>{ addFame(s,'凡人','county',1); s.karma-=6; s.attr.xin+=1;
        return { t:'你提水提了一夜，眉毛烧掉一半。\n天亮时藏书楼塌了半边，底下三层保住了。\n教谕挨个问名字，问到你时，你说不必记。他还是记了。\n\n<span class="good">业力 -6　心性 +1　声望 +1</span>', log:'救火一夜，业力 -6' }; } },
    { l:'趁乱搬两卷出来', chance:s=>0.5+(s.attr.qi-5)*0.06,
      ok:s=>{ s.attr.wu+=2; s.cult+=60; s.karma+=10;
        return { t:'你从侧门进去，抱着两卷往外走。\n没人拦你——那晚上抱书出来的人，不下二十个。\n回去翻开，一卷是《县学田亩记》，没有用；另一卷是半部讲行气的旧抄本，字迹极好。\n\n<span class="good">悟性 +2　修为 +60</span>　<span class="bad">业力 +10</span>', log:'趁火取书，悟性 +2' }; },
      no:s=>{ s.karma+=15; stoneSet(s,Math.max(0,s.stones-25),'事件与修行'); s.attr.xin-=1;
        return { t:'教谕就站在侧门。他什么也没说，只是伸手。\n你把书还了回去。第二天县里贴出告示，罚银二十五，名字写在最上面。\n那个名字在城门上挂了半年。\n\n<span class="bad">业力 +15　灵石 -25　心性 -1</span>', log:'趁火取书被拿住' }; } },
    { l:'远远看着',
      run:s=>({ t:'你站在街角看到天亮。\n火灭了之后，有人蹲在灰里翻，翻出一片没烧完的纸，看了看，又扔了。\n\n<span class="mute">什么也没有发生</span>', log:'未参与救火' }) }
  ]},

/* ---------- 坊市 · 逢三逢八才开修士集 ----------
   一县六十个灵根者，养不起天天的修士市场。真实形态是：
   平时卖米布盐，逢三、逢八，府城与邻县的散修来十几个，西头支三五个摊子。
   这四条都发生在「开集那天」。 */

{ id:'E028', name:'半价丹', place:'market', spot:'西头丹摊', once:false, w:10, cd:6,
  text:'逢三开集。坊市西头多了一个摊子，蓝布上摆着十几只白瓷瓶。\n摊主瘦脸，见人就说：「聚气散，宗门里流出来的，半价。」\n市价三十灵石，他要十五。\n旁边卖布的老妇拉了拉你的袖子，声音压得很低：「他上个月还在县城卖布。」',
  opts:[
    { l:'买一瓶', cost:15, chance:s=>0.4,
      ok:s=>{ s.buff.dan=3;
        return { t:'瓷瓶入手很轻，比该有的轻。\n你没当场吃，揣回住处，用温水化开。\n药力是真的——丹田里那点火苗旺了一截，像有人添了把干柴。\n下一集，那个摊子没再出现。\n\n<span class="good">灵石 -15　聚气三年</span>', log:'买到真聚气散，聚气三年' }; },
      no:s=>{ s.cult=Math.max(0,s.cult-60); s.attr.gen=Math.max(1,s.attr.gen-1);
        return { t:'瓷瓶入手很轻，比该有的轻。\n你把它压在舌下，丹田里那点火苗没旺，反而乱了——像有人往灶膛里撒了一把湿柴。\n你在墙根蹲了半夜。吐出来的东西是黄的。\n\n<span class="bad">灵石 -15　修为 -60　根骨 -1</span>', log:'买到假丹，气机紊乱' }; } },
    { l:'拔开塞子闻一闻',
      run:s=>{
        if(s.layer>=4){
          s.attr.wu+=1;
          return { t:'真的聚气散是清冽的，像雨后石头上的水气。\n这一瓶冲鼻子。底子是陈面，掺了朱砂，颜色调得很像。\n你抬眼，摊主已经在卷蓝布了——他看你的眼神，知道你闻出来了。\n\n<span class="good">悟性 +1　识破一桩假货</span>', log:'识破假丹' };
        }
        return { t:'你拔开塞子闻了闻。有股辛辣气，说不清是药，还是别的什么。\n摊主笑：「新炼的，都这个味。」\n你把瓶子放回去。他也没再多说一句。\n\n<span class="mute">看不出真假</span>', log:'未能辨出丹药真假' };
      } },
    { l:'去叫坊市的管事',
      run:s=>{ stoneChange(s,8,'事件与修行'); addFame(s,'本地','market',1); s.flag.denounced=true;
        return { t:'管事姓周，绝灵根，管这片场子三十年。\n他过去的时候一句话没说，只把蓝布掀了。底下压着一小袋陈面。\n摊主跑了，鞋掉了一只。\n周管事从没收的银钱里数出八块给你：「下回先来找我，别自己动手。」\n\n<span class="good">灵石 +8　声望 +1</span>', log:'告发假丹摊子' }; } }
  ]},

{ id:'E029', name:'断剑', place:'market', spot:'旧物摊', once:true, w:8,
  text:'坊市角上有个旧货摊。一口缺角的木箱，里头是断了的锄头、缺口的碗、锈成一块的铁钉。\n最上头压着半截剑：剑身断了，只剩一尺；剑柄缠着麻绳，绳头散了。\n老婆婆说：「三块灵石。当柴刀卖的。」\n麻绳底下，露出一角云纹。',
  opts:[
    { l:'买下', cost:3, chance:s=>0.3,
      ok:s=>{ stoneChange(s,60,'事件与修行'); s.attr.wu+=1;
        return { t:'你把剑拿在手里，比看上去沉。\n回去用磨石蹭了半宿，麻绳解下来，云纹是刻进铁里的，不是画的。断口发暗，是灵铁。\n坊市东头的铁匠看了很久，出六十灵石。你卖了。\n他说，这剑原先该有三尺。\n\n<span class="good">灵石 +57　悟性 +1</span>', log:'三灵石买得灵铁断剑，卖六十' }; },
      no:s=>({ t:'你把剑拿在手里，比看上去沉。\n回去磨了半宿，麻绳解下来，云纹是拿刀尖划的，划得很浅，像谁闲得没事。\n断口是生铁。\n你把它插在门后，当了三年门闩。\n\n<span class="bad">灵石 -3</span>', log:'买得一把凡铁断剑' }) },
    { l:'拿起来，对着天光看断口', chance:s=>0.25+(s.attr.wu-5)*0.08,
      ok:s=>{ stoneChange(s,57,'事件与修行'); s.attr.wu+=1;
        return { t:'断口里有一线极细的暗青。凡铁断不出这种颜色。\n你把三块灵石放在箱沿上，没还价。老婆婆愣了一下，收了。\n铁匠出六十。他问你还有没有，你说没有了。\n\n<span class="good">灵石 +57　悟性 +1</span>', log:'看出断剑是灵铁，转手赚五十七' }; },
      no:s=>({ t:'你把它翻过来，对着天光看了很久。\n只看见锈。\n你放回去，压在那些锄头上头，位置没变。\n\n<span class="mute">什么也没有发生</span>', log:'没看出断剑的门道' }) },
    { l:'走开',
      run:s=>({ t:'你从旧货摊前走过去。\n老婆婆也没招呼你，只是把麻绳又缠了两圈。\n\n<span class="mute">什么也没有发生</span>', log:'未理会旧货摊' }) }
  ]},

{ id:'E030', name:'夜货', place:'market', spot:'修士集', once:true, w:6,
  text:'散集之后，后巷没什么人。\n巷口蹲着一个，怀里抱着布包。见你过来，他把布包掀开一角——是一只储物袋。\n袋口结着一块黑褐色的渍，看着像血，也可能不是。\n「二十灵石。」他说，「别问哪来的。」',
  opts:[
    { l:'买下', cost:20, chance:s=>0.7,
      ok:s=>{ stoneChange(s,70,'事件与修行'); s.buff.dan=2;
        return { t:'你数了二十块给他。他把布包塞进你怀里，起身就走，没回头。\n袋口解开：七十灵石，两瓶没开封的聚气散，还有一块巴掌大的木牌。\n牌上刻着一个字，只刻了一半。\n\n<span class="good">灵石 +50　聚气两年　一块残牌</span>', log:'买下无主储物袋' }; },
      no:s=>{ s.injured=Math.max(s.injured,2); s.karma+=5;
        return { t:'你数了二十块给他。\n他刚走，巷子另一头就进来三个人，一样的青布短打，一样的腰牌。\n为首那个看了你手里的袋子一眼：「这东西，我们家丢了三天。」\n你没敢动。他们把袋子拿回去，临走在他肩上拍了一下——不重，你却在床上躺了两个月。\n\n<span class="bad">灵石 -20　受伤两年　业力 +5</span>', log:'买赃撞上失主，受伤' }; } },
    { l:'先问一句，这是哪来的',
      run:s=>({ t:'他把布包又合上了一点。\n「黑风岭那边。」他说，「上个月有人进了山，没出来。我进去找，人没了，袋子在。」\n他顿了顿：「你要是不买，就当我没说。」\n\n<span class="mute">得一条传闻</span>', log:'问出夜货来路：黑风岭' }) },
    { l:'走开',
      run:s=>({ t:'你绕过他，往巷子另一头走。\n他没有拦，也没有再喊价。\n过了些日子，你听说黑风岭下捞上来一个人，怀里的布包还在。\n\n<span class="mute">什么也没有发生</span>', log:'未接夜货' }) }
  ]},

{ id:'E031', name:'中人', place:'market', spot:'修士集', once:false, w:10, cd:6,
  text:'坊市门口支着一张桌子，桌后坐着个姓马的中年人，面前立一块木牌。\n牌上密密麻麻写着小字：谁要买什么，谁要卖什么，谁在找一个会写字的。\n他不收摊钱，只在成交之后抽一成。\n「散修？」他抬眼看了看你，「散修的消息最贵，也最便宜。」',
  opts:[
    { l:'花十灵石，买两条', cost:10,
      run:s=>({ t:'他收了钱，从桌下抽出一张纸，纸上是他自己的字，歪歪扭扭。\n「北边荒原，今年雾来得早。有人在雾里数过灯，不止一盏。」\n「{观}要修山门，缺石料。谁送得进去，谁就能在山门口站一个冬天。」\n他把纸推回来：「这两条，一条值十块，一条不值。你自己分。」\n\n<span class="good">灵石 -10　得两条传闻</span>', log:'向中人买了两条传闻' }) },
    { l:'问他有没有活计',
      run:s=>{ stoneChange(s,30,'事件与修行');
        return { t:'他上下打量你：「有。城西十亩灵田，要看三个月。二十五灵石，管饭。」\n「丑话说前头：田里长的东西，少一株都算你的。」\n你去了。三个月里没出什么事，只是夜里沟里总有动静。\n结账那日，东家多给五块，说你看得仔细。\n\n<span class="good">灵石 +30　得一条门路</span>', log:'替人看守灵田三个月' }; } },
    { l:'不理会',
      run:s=>({ t:'你从他桌前走过去。\n他在你背后说：「下回缺什么，先来问我。我不卖东西，我认人。」\n\n<span class="mute">什么也没有发生</span>', log:'未理会中人' }) }
  ]},

/* =========================================================
   补 · 观（temple 4 条）与 崖（cliff 4 条）
   观里有六个人，崖下全县唯一结丹地，此前只有各两条，撑不起。
   ========================================================= */
{ id:'E036', name:'藏经楼抄经', place:'temple', spot:'藏经阁', once:false, w:10, cd:9,
  text:'观里的藏经楼缺个抄经人。\n执事说，抄一冬的《清心诀》，不费脑子，管饭，还许你进楼里翻三本杂书。\n只是字要工整，错了半行，一页重抄。',
  opts:[
    { l:'接下这差事', 
      run:s=>{ stoneChange(s,25,'事件与修行'); s.attr.wu+=1;
        return { t:'你抄了一冬，手腕都僵了。\n夜里楼里只你一人，油灯下那些经文一行行淌过去，有些句子从前不懂，抄到第十遍时，忽然懂了。\n\n<span class="good">灵石 +25　悟性 +1</span>', log:'抄经一冬，悟性 +1' }; } },
    { l:'抄一半，偷翻那三本杂书', chance:s=>0.5,
      ok:s=>{ s.attr.wu+=2;
        return { t:'杂书压在佛龛后面，你趁夜翻出来。\n有本缺了封面的册子，记的是旁人渡劫时的心得，字迹潦草，却句句戳心。\n\n<span class="good">悟性 +2</span>', log:'偷翻杂书，悟性 +2' }; },
      no:s=>{ stoneChange(s,-(5),'事件与修行');
        return { t:'翻到一半，楼门响了一声。\n你慌忙把书塞回去，打翻了油灯。执事没多问，只让你把烧焦的那页赔了。\n\n<span class="bad">赔了五灵石</span>', log:'偷翻杂书被撞破' }; } },
    { l:'嫌字苦，不接', 
      run:s=>({ t:'你推说手上有伤。\n执事也没勉强，只说了句：「楼里的字，不认人。」', log:'未接抄经差事' }) }
  ]},

{ id:'E037', name:'香火钱', place:'temple', spot:'大殿', once:false, w:9, cd:12,
  text:'观里修大殿，缺香火钱。\n知客挨个问门下弟子与挂单的散修：能出多少，写多少，名字刻在功德碑上。\n你摸了摸口袋，又看了看那块还没刻满的碑。',
  opts:[
    { l:'出五十灵石，求个名', cost:50,
      run:s=>{ s.karma-=3; s.rep=(s.rep||0)+2;
        return { t:'你把名字刻在了碑上。\n此后进山门，执事见你总要拱一拱手，那名字替你省了不少口舌。\n\n<span class="good">业力 -3　声名 +2</span>', log:'捐香火钱五十，声名 +2' }; } },
    { l:'出十灵石，意思一下', cost:10,
      run:s=>({ t:'你出了十灵石。\n功德碑上，你的名字刻在很下面，小得几乎看不见。\n但你站在那儿看了一会儿，心里却踏实了。', log:'捐香火钱十灵石' }) },
    { l:'一文不出', 
      run:s=>{ s.karma+=2;
        return { t:'你摇头说没有。\n知客没说什么，只是下回见你，脸上淡淡的。\n\n<span class="bad">业力 +2</span>', log:'未捐香火钱' }; } }
  ]},

{ id:'E038', name:'论道会', place:'temple', spot:'大殿', once:false, w:8, cd:15,
  text:'观里开论道会，几座山头的散修都来了。\n一个白须老修当庭发问：「何为『气』？」\n底下的人争了半日，谁也没说服谁。\n老修的目光忽然落到你身上。',
  opts:[
    { l:'上前说自己的见解', chance:s=>0.4+(s.attr.wu-5)*0.1,
      ok:s=>{ s.attr.wu+=2; s.rep=(s.rep||0)+1;
        return { t:'你说得不多，只一句。\n满堂静了静，那老修捻着须笑：「有点意思。散场后你留一下。」\n\n<span class="good">悟性 +2　声名 +1</span>', log:'论道得赏识，悟性 +2' }; },
      no:s=>({ t:'你说了几句，说到一半自己先泄了气。\n老修点点头，没再追问。散场后你想，原来想得清楚和说得清楚，是两回事。', log:'论道出言，未得赏识' }) },
    { l:'只在一旁听', 
      run:s=>{ s.attr.wu+=1;
        return { t:'你听了一整日。\n有些话你听不懂，有些话你早就懂，只是从没听人这样讲出来。\n散场时，月已上了山。\n\n<span class="good">悟性 +1</span>', log:'旁听论道，悟性 +1' }; } },
    { l:'不凑这个热闹', 
      run:s=>({ t:'你从人群中退出来。\n山风一吹，那些争辩声远了，反而听得更清。', log:'未参加论道会' }) }
  ]},

{ id:'E039', name:'闭关借洞', place:'temple', spot:'后山', once:true, w:9,
  text:'观后山有一眼灵泉洞，是观主自己的闭关之地，寻常不让人进。\n这日观主却差人传话：他要远游三年，洞空着，借给有缘人。\n只是——洞借你，灵泉分你，出关时要还他三成修为。',
  opts:[
    { l:'借洞闭关，三年为约', run:s=>{ s.cult+=300; s.attr.wu-=1;
        return { t:'你在洞里坐了三年。\n灵泉确实妙，气如丝缕，日夜往百会里钻。出关那日，你把三成修为按约散了，人有些虚，眼睛却亮。\n\n<span class="good">修为 +300　悟性 -1</span>', log:'借灵泉洞闭关，修为大涨' }; } },
    { l:'三年太久，不借', 
      run:s=>({ t:'你算了算，三年太长，舍不得。\n观主的人也不多留，只把洞门又锁上了。', log:'未借洞闭关' }) }
  ]},

{ id:'E040', name:'崖底雾潮', place:'cliff', spot:'崖下', once:false, w:9, cd:14,
  text:'断云崖下起雾了，白茫茫从谷底漫上来，遮得连崖顶都看不见。\n老辈人说，这种雾十年一遇，雾里有灵，跟着走，能寻到崖下那口古泉；跟错了，就在雾里转上一整夜。',
  opts:[
    { l:'循着雾走，赌一赌', chance:s=>0.45,
      ok:s=>{ s.cult+=150; s.lifespan+=1;
        return { t:'你闭着眼，循着那点若有若无的灵气走。\n天快亮时，雾散了，你站在一口古泉边上，泉水碧得发黑。你饮了一口，遍体生寒，随即一股暖意直透丹田。\n\n<span class="good">修为 +150　寿元 +1</span>', log:'雾中寻得古泉' }; },
      no:s=>{ s.lifespan-=1;
        return { t:'你在雾里转了一整夜。\n天亮时人还在原地，脚下湿透，衣摆上凝着一层霜。\n\n<span class="bad">白耗一夜，受了寒气</span>', log:'雾中迷路' }; } },
    { l:'雾里凶险，不上前', 
      run:s=>({ t:'你退到崖边的高处，看着那片雾慢慢把整座山谷吞下去。\n雾散之后，什么痕迹也没留下。', log:'未入雾潮' }) }
  ]},

{ id:'E041', name:'坠崖的剑', place:'cliff', spot:'雾顶', once:true, w:8,
  text:'你在崖边捡到一柄剑，半截没在土里，剑身上缠着陈年的麻布。\n抽出来看，剑已断了，只剩尺许长的剑尖，可那点剑尖在月下冷得刺眼。\n崖下风大，像有什么东西在底下唤你。',
  opts:[
    { l:'收下这半截剑', 
      run:s=>{ s.item='断剑（剑尖）'; s.attr.qi+=1;
        return { t:'你把断剑揣进怀里。\n夜里它贴着你胸口，凉得让人睡不着，却又莫名心安。\n\n<span class="good">得断剑一截　根骨 +1</span>', log:'得断剑剑尖' }; } },
    { l:'顺崖下去，找剑的另一半', chance:s=>0.3,
      ok:s=>{ s.item='断剑（全）'; s.attr.qi+=2;
        return { t:'你攀着崖壁下去，在一条石缝里找到了另一半。\n两截合拢，严丝合缝，剑身嗡地一声轻鸣，似有所应。\n\n<span class="good">断剑合一　根骨 +2</span>', log:'寻得断剑另一半' }; },
      no:s=>{ s.injured=2;
        return { t:'崖壁湿滑，你脚下一空。\n摔下去时被崖边的老藤兜了一下，命是保住了，腿却折了。\n\n<span class="bad">跌伤</span>', log:'寻剑摔伤' }; } },
    { l:'剑主未远，物归原主难，弃之', 
      run:s=>({ t:'你把剑原样插回土里，拜了一拜。\n这种东西，说不定有主，说不定有怨。', log:'未取断剑' }) }
  ]},

{ id:'E042', name:'雷劫痕', place:'cliff', spot:'雾顶', once:true, w:8,
  text:'断云崖顶焦黑一片，是前些日子有人在此渡劫留下的。\n雷火把山石劈开，露出石心里一截焦黑的东西，还在往外渗着微光。\n有散修说那是渡劫者的残骸，也有人说，是雷劫淬出来的宝物。',
  opts:[
    { l:'上去细看', chance:s=>0.5,
      ok:s=>{ s.attr.wu+=2; s.cult+=80;
        return { t:'你凑近了看，那东西不是残骸，是一截被雷火淬过的灵骨。\n骨上还残着渡劫者临终前的一点感悟，你只碰到，心里就翻涌起许多。\n\n<span class="good">悟性 +2　修为 +80</span>', log:'观雷劫痕，有所悟' }; },
      no:s=>{ s.lifespan-=2;
        return { t:'你刚走近，残雷未散，一道细小的电光窜进你掌心。\n人没大碍，就是那股麻意，半月才退干净。\n\n<span class="bad">被残雷所伤</span>', log:'被残雷所伤' }; } },
    { l:'这是人家的归处，不上前', 
      run:s=>{ s.attr.xin+=1;
        return { t:'你在远处立了一会儿，没有上去。\n那人渡劫的地方，风都比别处肃穆。\n\n<span class="good">心性 +1</span>', log:'敬而不扰，心性 +1' }; } }
  ]},

{ id:'E043', name:'崖下问道', place:'cliff', spot:'崖下', once:true, w:8,
  text:'崖下坐着一个老婆婆，白发披散，正在喂一只断翅的鹤。\n见你下来，她头也不回：「年轻人，你可知这崖下为什么从没有人能结丹？」\n你不语。她笑：「因为都急着往上爬，没人肯在崖下坐满三十年。」',
  opts:[
    { l:'坐下，听她讲', 
      run:s=>{ s.attr.wu+=2; s.attr.xin+=1;
        return { t:'你坐下听她讲了一夜。\n她讲的都是些极浅显的道理，可那些道理从她嘴里出来，句句都像在点你。\n天快亮时，她起身，鹤也扑着翅膀飞了。\n\n<span class="good">悟性 +2　心性 +1</span>', log:'听崖下婆婆讲道' }; } },
    { l:'问她可是白药姑', 
      run:s=>{ s.knowsWaste=true; s.attr.xin+=1;
        return { t:'你问出这句话，她手上的动作停了一下。\n「白药姑早死了。」她说，「这里只有一个等死的老婆子。」\n你听懂了，没再问。\n\n<span class="good">心性 +1　得知崖下旧事</span>', log:'问出崖下婆婆来历' }; } },
    { l:'不打扰，绕开走', 
      run:s=>({ t:'你轻着脚步绕开了。\n走出去很远，还听见鹤在身后叫了一声。', log:'未打扰崖下婆婆' }) }
  ]},

/* =========================================================
   补 · 岭（ridge 3 条）村（village 2 条）市（market 1 条）
   ========================================================= */
{ id:'E044', name:'岭上樵夫', place:'ridge', spot:'半山老林', once:false, w:9, cd:8,
  text:'黑风岭半山腰有个樵夫，背着一捆柴，正坐在石头上歇。\n他递给你一个水囊，说：「走这条岭，得看时辰。日头一斜，岭上就起风，风里有东西。」',
  opts:[
    { l:'谢过水，听他讲岭上的事', 
      run:s=>{ s.attr.wu+=1;
        return { t:'他跟你讲了许多：哪段路白天走，哪段路夜里万万不能走，哪个山洞里住过什么。\n水囊里的水是山泉，甜得发苦。\n\n<span class="good">悟性 +1</span>', log:'听樵夫讲岭上事' }; } },
    { l:'问风里的东西是什么', 
      run:s=>{ s.knowsRidge=true;
        return { t:'他脸色变了变，压低声音：「是山鬼。吃了黄昏人的魂，就在岭上飘，等下一个走夜路的。」\n说完他背起柴，头也不回地走了。\n\n<span class="mute">得知岭上旧事</span>', log:'问出岭上山鬼之说' }; } },
    { l:'谢过就走', 
      run:s=>({ t:'你灌了口水，谢过便走。\n他在你身后喊：「赶早下山！晚了，别回头！」', log:'未多留' }) }
  ]},

{ id:'E045', name:'破庙夜宿', place:'ridge', spot:'山口', once:false, w:8, cd:10,
  text:'天黑前，你赶到岭上一座破庙。\n庙里供的神像塌了半边，蛛网挂了满梁。地上还铺着干草，像是有人住过。\n你要不要在这儿将就一夜？',
  opts:[
    { l:'在此歇一夜', chance:s=>0.6,
      ok:s=>{ s.attr.xin+=1;
        return { t:'你在干草上睡了一夜。\n半夜听见庙外有脚步声，来来回回，却始终没进来。\n你握着剑熬到天亮，倒也练出几分胆气。\n\n<span class="good">心性 +1</span>', log:'破庙夜宿，心性 +1' }; },
      no:s=>{ stoneChange(s,-(10),'事件与修行');
        return { t:'你睡到半夜，被一阵冷风冻醒。\n怀里装灵石的布包不知何时被人划开一道口子，少了几块。\n\n<span class="bad">夜里失窃</span>', log:'破庙夜宿失窃' }; } },
    { l:'宁可多走夜路，也不住这里', 
      run:s=>{ s.lifespan-=1;
        return { t:'你连夜赶路。\n山路难行，摔了几跤，走到天亮才出岭。\n\n<span class="mute">赶了一夜路</span>', log:'连夜出岭' }; } }
  ]},

{ id:'E046', name:'山鬼哭', place:'ridge', spot:'北坡', once:true, w:8,
  text:'黄昏，岭上起了风。\n风里夹着哭声，断断续续，像是女人，又像是孩子。\n你回头，背后空空荡荡，只有一片将暗未暗的天。',
  opts:[
    { l:'念清心诀，镇住心神', chance:s=>0.55,
      ok:s=>{ s.attr.xin+=2;
        return { t:'你站定，默念清心诀。\n哭声近了又远，最后化作一声叹息，散了。\n你出了一身汗，却觉着心神从没这样澄明过。\n\n<span class="good">心性 +2</span>', log:'镇住山鬼，心性 +2' }; },
      no:s=>{ s.attr.xin-=1; s.injured=1;
        return { t:'你越念，那哭声越近，直贴到你耳后。\n你发足狂奔，摔下山坡，昏死过去。天亮时被露水冻醒，人还活着。\n\n<span class="bad">心性 -1</span>', log:'为山鬼所惊' }; } },
    { l:'回头，看看到底是什么', 
      run:s=>{ s.attr.xin+=1; s.knowsRidge=true;
        return { t:'你猛地回头。\n什么都没有。\n可就在你回头的一瞬，哭声停了——像是它也在看你。\n你从此信了，岭上真有东西。\n\n<span class="good">心性 +1</span>', log:'回头对峙山鬼' }; } }
  ]},

{ id:'E047', name:'村中义诊', place:'village', spot:'井台', once:false, w:8, cd:9,
  text:'村里来了个游方郎中，在打谷场上摆摊义诊。\n村人排了长队，扶老携幼。\n你通些药理，郎中也缺个帮手，正朝你招手。',
  opts:[
    { l:'搭把手，帮一天', 
      run:s=>{ stoneChange(s,15,'事件与修行'); s.attr.xin+=1;
        return { t:'你帮了一天，捣药、看方、背老人。\n日落时，郎中塞给你十五灵石，说这是东家该给的。\n村人送你到村口，你从没被这么多人谢过。\n\n<span class="good">灵石 +15　心性 +1</span>', log:'村中义诊，得灵石' }; } },
    { l:'向郎中学两手', chance:s=>0.5,
      ok:s=>{ s.attr.wu+=1; s.skill='药';
        return { t:'你跟着看了半日，学了几味寻常草药的配伍。\n郎中说你有点天分，可惜没正经拜师。\n\n<span class="good">悟性 +1　通晓药性</span>', log:'学得药性' }; },
      no:s=>({ t:'你看了半日，只觉着头晕。\n那些草长得都一样，你实在分不清。', log:'学医不成' }) },
    { l:'不凑热闹', 
      run:s=>({ t:'你从打谷场边走过去。\n身后有人喊你，你没回头。', log:'未理会义诊' }) }
  ]},

{ id:'E048', name:'河祭', place:'village', spot:'村口', once:true, w:8,
  text:'村东的河要祭河神。\n村里选出今年的祭品——一篓稻谷，一坛酒，还有一个童男。\n童男的娘跪在河边，哭得没了声。\n你站在人群外，手按在剑上。',
  opts:[
    { l:'拦下这场祭', chance:s=>0.5,
      ok:s=>{ s.karma-=5; s.rep=(s.rep||0)+2;
        return { t:'你跃上祭台，一剑劈翻了香案。\n村人哗然，可没人敢上前。你抱起那孩子，交回他娘手里。\n从此村里人见你，眼里都多一分敬，也多一分惧。\n\n<span class="good">业力 -5　声名 +2</span>', log:'拦下河祭' }; },
      no:s=>{ s.karma+=5; s.injured=3;
        return { t:'你刚要动手，几个壮汉把你按住了。\n祭照常进行，你被丢在河边，三天没爬起来。\n\n<span class="bad">业力 +5　受伤</span>', log:'拦祭失败' }; } },
    { l:'这是人家的村事，不插手', 
      run:s=>{ s.karma+=3;
        return { t:'你闭了闭眼，转身走了。\n河边的哭声追着你，走了三里还没散。\n\n<span class="bad">业力 +3</span>', log:'未拦河祭' }; } }
  ]},

{ id:'E049', name:'集上斗价', place:'market', spot:'米市', once:false, w:8, cd:7,
  text:'坊市里两拨人正为一件东西争得面红耳赤。\n你挤进去看，是个黑布包着的小匣子，没人打开，却都抢着要。\n有人说里面是古修丹方，有人说是块废铁。',
  opts:[
    { l:'出价，赌一把', cost:60, chance:s=>s.stones>=60?0.5:0.1,
      ok:s=>{ stoneChange(s,-(60),'事件与修行'); s.item='古匣'; s.cult+=100;
        return { t:'你花六十灵石把匣子买下。\n夜里打开，里面是半部残缺丹方，和几粒早已失了药性的丹。\n丹方虽残，你却悟出些门道。\n\n<span class="good">灵石 -60　修为 +100</span>', log:'买得古匣' }; },
      no:s=>({ t:'你刚要出价，价钱就被抬到了两百。\n你摸了摸口袋，退了出来。\n\n<span class="mute">没有出手</span>', log:'斗价未得手' }) },
    { l:'只看热闹，不出价', 
      run:s=>({ t:'你站在外围看。\n最后匣子被一个胖子买走，他当场打开——里面是半块锈铁。\n满场嘘声，他倒笑得欢。', log:'旁观斗价' }) }
  ]},

/* --- 家 事：起在你家（place:'home'），由世事层起，有存续期。
       活着的人才有家事；走了的人只留牌位。去晚了，家里的事一样会散。 --- */
{ id:'H01', name:'家中捎话', place:'home', once:false, w:10, cd:6,
  cond:s=>s.family && s.family.some(f=>f.alive),
  text:'你回到家里，桌上压着一张字条，是邻人代笔的。\n上头说家里短了钱，问你手头宽不宽。\n写字的人没敢把话写尽——这种事，写尽了就是讨。',
  opts:[
    { l:'留下二十灵石', cost:20,
      run:s=>{ s.attr.xin+=1;
        return { t:'你把灵石放在桌上，压在那张字条底下。\n家里人谁也没有提。你走的时候，门帘掀开一条缝，有人在看。\n\n<span class="good">心性 +1</span>', log:'留下 20 灵石给家里，心性 +1' }; } },
    { l:'如实说手里也紧',
      run:s=>{ s.attr.xin=Math.max(1,s.attr.xin-1);
        return { t:'你说手里也紧。\n屋里静了一会儿，有人应了声「知道了」。\n\n<span class="bad">心性 -1</span>', log:'没给家里留钱，心性 -1' }; } },
    { l:'把字条收进衣襟，没再提',
      run:s=>({ t:'你把字条折好收进衣襟里。\n这天晚上谁也没提这件事，第二天也没有。', log:'没管家里的钱' }) }
  ]},

{ id:'H02', name:'老屋漏雨', place:'home', once:false, w:9, cd:6,
  cond:s=>s.family && s.family.some(f=>f.alive),
  text:'下雨了。老屋那片瓦去年就该换，今年塌了。\n水顺着梁落到灶台上，接水的盆一夜换了三回。',
  opts:[
    { l:'掏钱请人修缮', cost:8,
      run:s=>({ t:'你请了泥瓦匠，半天就把那一片补齐了。\n新瓦颜色深，跟旧瓦接不上，可雨落下来的时候不响了。', log:'修好老屋，花 8 灵石' }) },
    { l:'自己上房，把瓦挪一挪',
      run:s=>{ s.attr.xin+=1;
        return { t:'你踩着梯子上房，把塌的那一片挪开，又拿几块好瓦顶上。\n下来时衣袖全湿了，手上有两道口子。\n\n<span class="good">心性 +1</span>', log:'自己修了老屋，心性 +1' }; } },
    { l:'由它漏着',
      run:s=>({ t:'雨下了三天，灶台泡软了一角。\n家里人没说什么——他们知道你在攒钱修行。', log:'没修老屋' }) }
  ]},

{ id:'H03', name:'说亲', place:'home', once:false, w:8, cd:8,
  cond:s=>s.family && s.family.some(f=>f.alive),
  text:'邻人上门，说替你家里的人说一门亲。\n彩礼厚，能贴补不少家用；说的那户人家，也隔着不远。',
  opts:[
    { l:'应下这门亲',
      run:s=>{ stoneChange(s,60,'事件与修行');
        return { t:'亲事定了。彩礼送来的那天，家里摆了两桌。\n你在桌上坐到了最后。\n\n<span class="good">灵石 +60</span>', log:'替家里应了一门亲事' }; } },
    { l:'回绝',
      run:s=>({ t:'你替家里回绝了。邻人走的时候脸色不太好看。\n家里人没说什么，只是灶上的火小了一些。', log:'回绝了说亲' }) },
    { l:'多问一句那是什么人家',
      run:s=>({ t:'你多问了几句。邻人答得不痛快——彩礼厚，是因为那户人家也有一本难念的账。\n你听完，没应，也没回绝。', log:'问了说亲的底细' }) }
  ]},

{ id:'H04', name:'债主到门', place:'home', once:false, w:9, cd:10,
  cond:s=>s.family && s.family.some(f=>f.alive) && (s.origin==='没落家族子弟'||s.origin==='世家嫡系'),
  text:'债主上门了。\n来人姓什么不说，只把一张旧契摊在桌上——那笔账，是上一辈欠下的。',
  opts:[
    { l:'把账认下来，先还一半', cost:40,
      run:s=>{ s.attr.xin+=1;
        return { t:'你数出四十灵石推过去。\n来人收了，把契上一行字勾掉，说：剩下的，明年这个时候。\n\n<span class="good">心性 +1</span>', log:'替家里认下一半旧债' }; } },
    { l:'说这笔账不该我这一辈还',
      run:s=>({ t:'你把契推回去。\n来人笑了笑，没争，把契收回袖里走了。\n你知道，他还会来。', log:'拒还上一辈的旧债' }) },
    { l:'避进里屋',
      run:s=>({ t:'你避进里屋，听着外头的说话声。\n家里人替你应了半炷香，来人走了。\n门帘掀开的时候，谁也没看你。', log:'避见债主' }) }
  ]},

{ id:'H05', name:'家人劝你', place:'home', once:false, w:9, cd:8,
  cond:s=>s.family && s.family.some(f=>f.alive),
  text:'家里人劝了你一回。\n说这条道看不到头，说你已经不小了，说家里养得起一个人。',
  opts:[
    { l:'留下来，陪他们住一年',
      run:s=>{ s.age+=1; s.attr.xin+=1;
        return { t:'你留了下来，陪他们住了一年。\n这一年你没有修行，丹田里那口气只是静静地待着。\n\n<span class="good">心性 +1　时间 -1 年</span>', log:'留下陪家人一年，心性 +1' }; } },
    { l:'把自己的打算说清楚',
      run:s=>({ t:'你把自己的打算说了。\n家里人听着，没有拦，也没有应。\n走的那天，门是开着的。', log:'和家人说清了打算' }) },
    { l:'不答，第二天天没亮就走',
      run:s=>{ s.attr.xin=Math.max(1,s.attr.xin-1);
        return { t:'你没答。第二天天没亮就走了。\n路上你想起灶上的火，昨晚烧得很小。\n\n<span class="bad">心性 -1</span>', log:'不辞而别，心性 -1' }; } }
  ]},

{ id:'H06', name:'先人祭日', place:'home', once:false, w:8, cd:10,
  cond:s=>s.family && s.family.some(f=>!f.alive),
  text:'到了先人的祭日。\n家里在空位上摆了一副碗筷，又多摆了一副。',
  opts:[
    { l:'陪着坐一炷香',
      run:s=>{ s.attr.xin+=1;

    { l:'去坟上看一眼',

{ id:'H07', name:'邻里争执', place:'home', once:false, w:8, cd:8,
  cond:s=>s.family && s.family.some(f=>f.alive),

    { l:'按着不动，去请里正',
      run:s=>({ t:'你去请了里正。里正来回看了那半尺地，说：各让一步。\n事情平了，也没平。', log:'请里正断邻里的地' }) },
    { l:'不出去，由他们吵',
      run:s=>({ t:'你没出去。外头吵了半个时辰，散了。\n晚上家里人给你盛饭，碗摆得很重。', log:'没管邻里的争执' }) }

{ id:'H08', name:'家人病重', place:'home', once:false, w:8, cd:12,
  cond:s=>s.family && s.family.some(f=>f.alive),
  text:'家里有人病了一冬。\n请来的郎中说，要用一味黄芪吊着；县城的药铺卖十五灵石一两。',
  opts:[

        return { t:'你在山里转了两天，在一处石缝里摸到了黄芪。\n药是自己采的，煎出来味道重，那人的气色竟真好了些。\n\n<span class="good">根骨 +1</span>', log:'为家人上山采药，根骨 +1' }; },

    { l:'抓不起，只能听天由命',
      run:s=>({ t:'你没抓那副药。\n那人的气短了一整个春天，谁也没有再提这件事。', log:'没为家人抓药' })

  ]},

{ id:'H09', name:'家中添丁', place:'home', once:false, w:7, cd:15,

/* --- 果：世界记得你。
       你帮过谁、得罪过谁，过些日子会以「事」的形式回来找你。
       这些事都有地点、有存续期，靠你自己去打听、去撞、去赶——
       和别的世事一样，去晚了就没了。账不立刻兑，这是「后果」与「奖励」的分界。 --- */
{ id:'E050', name:'故人相寻', place:'county', spot:'东街', once:false, w:8, cd:12,
  cond:s=>pendingRel(s,'恩').length>0,
  text:'你在县城落脚的客栈里，有人留话找你。来的是你旧日帮过的人，想当面谢你。',
  dyn:s=>{ const r=pendingRel(s,'恩')[0];
    return '你在县城落脚的客栈里，有人留话找你。\n来的是'+relDisp(r)+'——就是你'+r.note+'的那一位。\n柜上说他等了你两日，留下口信：想当面谢你，人就在南门外候着。'; },
  opts:[
    { l:'去南门外见他',
      run:s=>{ const r=pendingRel(s,'恩')[0]; const amt=20+Math.abs(r.v)*8;
        stoneChange(s,amt,'事件与修行'); rel(s, r.nid, -r.v, ''); addFame(s,'凡人','county',1);
        return { t:relDisp(r)+'备了一桌酒，说了许多话。\n走时塞给你一个包袱，说是早该还的情。\n\n<span class="good">灵石 +'+amt+'</span>', log:'受故人相谢，得 '+amt+' 灵石' }; } },
    { l:'传话说不必了，心意领了',
      run:s=>{ const r=pendingRel(s,'恩')[0]; s.attr.xin+=1; rel(s, r.nid, -r.v, '');
        return { t:'你请人带话：举手之劳，不必记挂。\n那人听说了，倒也没再勉强。只是往后你在县城，多了一个肯替你说话的人。\n\n<span class="good">心性 +1</span>', log:'婉谢故人相谢，心性 +1' }; } },
    { l:'没去——人各有命，不必相认',
      run:s=>({ t:'你在客栈多住了一夜，第二天一早便走了。\n有些情分，还了反而淡。', log:'没去赴故人之约' }) }
  ]},

{ id:'E051', name:'受人之托', place:'temple', spot:'山门', once:false, w:7, cd:14,
  cond:s=>pendingRel(s,'恩').length>0,
  text:'观里来了个面生的人，指名要见你。是你旧日帮过的人托来的，递上一样东西，说务必亲手交给你。',
  dyn:s=>{ const r=pendingRel(s,'恩')[0];
    return '观里来了个面生的人，指名要见你。\n是'+relDisp(r)+'托来的——当年你'+r.note+'，他一直记着。\n来人递上一样东西，说主家嘱咐，务必亲手交到你手里。'; },
  opts:[
    { l:'收下，问那人近况',

        s.cult+=amt; rel(s, r.nid, -r.v, ''); addFame(s,'修士','temple',1);
        return { t:'你收下东西，问了许久那人的近况。\n托付之物是一卷手抄的心得，字里行间都是这些年的体悟。\n\n<span class="good">修为 +'+amt+'</span>', log:'受故人所托，修为 +'+amt }; } },
    { l:'问清楚才敢收',
      run:s=>{ const r=pendingRel(s,'恩')[0]; rel(s, r.nid, -r.v, '');
        return { t:'你盘问了来路，又请人验过，才敢收下。\n这份小心，让来人也多了几分敬重。', log:'谨慎收下故人之托' }; } },
    { l:'婉言谢绝',
      run:s=>({ t:'你说无功不受禄，请来人原样带回。\n来人叹了口气，倒也没说什么。', log:'谢绝了故人所托' }) }
  ]},

{ id:'E052', name:'寻仇上门', place:'county', spot:'南门', once:false, w:9, cd:15,
  cond:s=>pendingRel(s,'怨').length>0,

  dyn:s=>{ const r=pendingRel(s,'怨')[0];
    return '县城里有消息：有人打听你的去向。\n是'+relDisp(r)+'——那年你'+r.note+'，这事他一直没放下。\n据说他纠了几个散修，在城门口盘桓了好几日，逢人便问你的行踪。'; },
  opts:[
    { l:'避一避风头，等他们散了',
      run:s=>{ const r=pendingRel(s,'怨')[0]; rel(s, r.nid, Math.min(0,r.v+1), '');
        return { t:'你在城外避了几日，托人打听着动静。\n过了些天，那些人等得不耐烦，也就散了。\n只是这一避，那点嫌隙又深了一层。', log:'避开了寻仇之人' }; } },
    { l:'主动去会一会，把话说开',
      chance:s=>0.4+(s.attr.xin-5)*0.04,
      ok:s=>{ const r=pendingRel(s,'怨')[0]; s.attr.xin+=1; rel(s, r.nid, 0, ''); addFame(s,'本地','county',1);
        return { t:'你找上门，把当年的事掰开揉碎讲了一遍。\n'+relDisp(r)+'听完，半晌没说话。末了他叹了口气，摆了摆手。\n\n<span class="good">心性 +1　这桩怨，就此揭过</span>', log:'当面了结了旧怨，心性 +1' }; },
      no:s=>{ const r=pendingRel(s,'怨')[0]; s.lifespan-=3; s.injured=Math.max(s.injured||0,2); rel(s, r.nid, r.v-2, '');
        return { t:'话没说到三句就动了手。\n你且战且退，落了一身伤才脱身。\n这一架，让那点旧怨又添了新的。\n\n<span class="bad">寿元 -3　受伤两年</span>', log:'了结旧怨不成，反受其害' }; } },
    { l:'不理会，由他去',
      run:s=>({ t:'你没理会。\n过了些日子，那些人没了耐心，也就走了。\n可你知道，有些账，欠着比还了更难。', log:'没理会寻仇之人' }) }
  ]},

{ id:'E053', name:'旧账重提', place:'market', spot:'修士集', once:false, w:8, cd:16,
  cond:s=>pendingRel(s,'怨').length>0,
  text:'坊市里有人认出了你。是你旧日得罪过的人，托人传话，要你在坊市外头做个了断。',
  dyn:s=>{ const r=pendingRel(s,'怨')[0];
    return '坊市里有人认出了你。\n是'+relDisp(r)+'的人——当年你'+r.note+'，如今他托人传话，要你在坊市外头做个了断。'; },
  opts:[
    { l:'去会一会，看他要什么',

        return { t:'你去了。那人倒也没喊打喊杀，只说要你给个说法。\n你赔了'+pay+'灵石，又陪了几句软话，这桩事才算压下去。\n\n<span class="bad">灵石 -'+pay+'</span>', log:'破财消了旧账，花 '+pay+' 灵石' }; } },
    { l:'不认这桩账',
      chance:s=>0.45+(s.attr.gen-5)*0.04,
      ok:s=>{ const r=pendingRel(s,'怨')[0]; rel(s, r.nid, Math.min(0,r.v+1), '');
        return { t:'你矢口不认，那人一时也拿不出实据。\n围观的人多了，他反倒下不来台，悻悻走了。', log:'赖掉了旧账' }; },
      no:s=>{ const r=pendingRel(s,'怨')[0]; stoneSet(s,Math.floor(s.stones*0.6),'事件与修行'); rel(s, r.nid, r.v-1, '');
        return { t:'你不认，那人便动了手。\n一番纠缠，你的储物袋被扯去了一小半。\n\n<span class="bad">灵石被抢去四成</span>', log:'不认旧账，反被抢' }; } },
    { l:'折身就走，避开这一场',
      run:s=>({ t:'你掉头就走，混进人流里。\n身后有人骂了几声，终究没追上来。', log:'避开了旧账重提' }) }
  ]},

/* --- 名声的门：有了名字，这些事才自己找上门。 ---
   不是奖励，是名气的「果」：做了对的事，名字传出去，
   才有人来请、来求、来探。做与不做，仍是你的选择。
   它们本身不再涨名——名涨不涨，看你往后还做不做对的事。 --- */

{ id:'E054', name:'有人引荐', place:'temple', spot:'山门', once:false, w:9, cd:20,
  cond:s=>fameReach(s,'修士','temple')>=1,
  text:'观里有人提起你的名字。一位云游至此的修士托人带话，说想与你论一论道，就约在山门外。',
  opts:[
    { l:'去会一会',
      chance:s=>0.45+(s.attr.wu-5)*0.05,
      ok:s=>{ s.cult+=60; s.attr.wu+=1;
        return { t:'你去了。那人只带了一壶茶，两个蒲团。\n从引气说到周天，你有一处想岔了，经他一点才通。\n\n<span class="good">修为 +60　悟性 +1</span>', log:'与人论道，修为 +60' }; },
      no:s=>{ s.attr.xin+=1;
        return { t:'那人道行远在你之上。你说得磕绊，他却听得认真。\n临别只说一句：「根基不虚，只是求快了。」\n\n<span class="good">心性 +1</span>', log:'论道受挫，心性 +1' }; } },
    { l:'婉拒，说身有要事',
      run:s=>({ t:'你请人带话，说改日再会。\n那人也不恼，只在山门外又坐了一日，便走了。', log:'婉拒了论道之约' }) }
  ]},

{ id:'E055', name:'乡人求上门', place:'village', spot:'村口', once:false, w:9, cd:18,

  ]},

{ id:'E056', name:'地头蛇攀交', place:'market', spot:'米市', once:false, w:9, cd:18,
  cond:s=>fameReach(s,'本地','market')>=1,
  text:'坊市里有人请你吃酒。是本地的一个掮客，说久闻你的名，想跟你交个朋友——他的朋友，都不太干净。',

  ]},

{ id:'E057', name:'县里挂名', place:'county', spot:'县衙', once:false, w:9, cd:20,

  ]},

/* --- 传承的关节：良缘。 ---
   为后代谋，不是等死抽奖，是趁在世时把一条好血脉引进门。
   这是「联姻换血脉」的入口：不是面板挑人，是听说有这一门亲，
   去不去、成不成，仍是「找」与「缘分」。 --- */
{ id:'E058', name:'良缘', place:'county', spot:'东街', once:true, w:8,
  cond:s=>s.realm>=1,
  text:'县城里有人替你牵线。是城南沈家的小女儿，年方及笄，听说灵根生得极好——比你这一支还高一截。\n只是沈家门第高，你一个散修出身，提这门亲，成与不成，两说。',
  opts:[
    { l:'备礼上门，试一试',
      chance:s=>0.35+(s.attr.xin-5)*0.04,
      ok:s=>{ const t=TIER_OF[s.root]||1;
        const up=Math.min(6, t+2);
        const mateRoot=TIER_ROOT[up];
        s.hasMate=true; s.mateRoot=mateRoot; s.attr.xin+=1;
        return { t:'沈家老爷打量你许久，竟点了头。\n那姑娘生得一双好眼睛，灵根是'+mateRoot+'——这一门血脉，从此进了你们家的门。\n\n<span class="good">已有道侣（'+mateRoot+'）　心性 +1</span>', log:'与沈家结亲，得道侣 '+mateRoot }; },
      no:s=>{ s.attr.xin+=1;

/* 存储：localStorage 可能被浏览器/内嵌预览禁用，禁了就退成内存，至少能玩一局 */
const MEM = {};
function sGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return (k in MEM)?MEM[k]:null; } }
function sSet(k,v){
  const value=String(v);
  try{
    window.localStorage.setItem(k,value);
    if(window.localStorage.getItem(k)!==value) return false;
    delete MEM[k];
    return true;
  }catch(e){ MEM[k]=value; return false; }
}
function sDel(k){ try{ window.localStorage.removeItem(k); }catch(e){ delete MEM[k]; } }
let G = null;

const CN_NUM = ['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三'];
const LAYER_NEED = (()=>{
  const raw=[]; let a=1;
  for(let i=0;i<CFG.layerCount;i++){ raw.push(a); a*=CFG.layerRatio; }
  const sum=raw.reduce((x,y)=>x+y,0);
  const out=raw.map(v=>Math.max(1,Math.round(v/sum*CFG.totalNeed)));
  const d=CFG.totalNeed-out.reduce((x,y)=>x+y,0);
  out[out.length-1]+=d;
  return out;

/* =========================================================
   境界抽象层
   ---------------------------------------------------------
   阶段 A：把「境界」从「炼气 13 层」的硬编码里抽出来，但不改变炼气段行为。
   G.realm 恒为 0（炼气）时，下面所有函数的结果与重构前逐位一致。

   needOf(layer)        当前境第 layer 层的修为需求（阶段 A 恒为炼气）
   realmInfo([r])       当前（或指定）境界的完整数据
   realmLayerCount([r]) 该境层数
   realmNeed(r, layer)  第 r 境第 layer 层的需求
   realmLife([r])       该境寿元
   realmLayerName(r, L) 该境第 L 阶的显示名（炼气→一层…，筑基→初/中/后/圆满）
   realmFull(s)         是否已到当前境圆满（层数已满）
   realmBrim(s)         是否「修为真的满了」（层满 + 修为攒满，冲关失败会掉下来）
   ========================================================= */
function realmOf(s){ s=s||G; return (s && s.realm!=null) ? (s.realm|0) : 0; }
function realmInfo(r){ return REALMS[Math.max(0,Math.min(REALMS.length-1, r==null ? realmOf() : r))]; }
function realmLayerCount(r){ return realmInfo(r).layers.length; }
function realmLife(r){ return realmInfo(r).life; }
function realmNeed(r, layer){
  if(r===0) return LAYER_NEED[Math.min(layer,CFG.layerCount)-1];
  const info=realmInfo(r);
  return info.layers[Math.min(layer, info.layers.length)-1];
}
function realmLayerName(r, L){
  return REALM_NAMES[Math.max(0,Math.min(REALMS.length-1, r==null?realmOf():r))] + realmInfo(r).stageName(L);
}
/* 当前境「层数已满」（不管修为是否还差）——阶段 A 恒等于 G.layer>=13 */
function realmFull(s){ s=s||G; return s.layer >= realmLayerCount(realmOf(s)); }
/* 当前境「修为真的满了」——层满且修为攒满。冲关失败掉修为后，层还在满，但 brim 变 false */
function realmBrim(s){ s=s||G; const r=realmOf(s); return realmFull(s) && s.cult >= realmNeed(r, realmLayerCount(r)); }

/* needOf(layer) = 当前境第 layer 层的需求。阶段 B 起 realm>0 时返回新境需求。
   炼气段（r===0）仍走 LAYER_NEED 快照，逐位不变。 */
function needOf(layer){
  const r=realmOf();
  if(r===0) return LAYER_NEED[Math.min(layer,CFG.layerCount)-1];
  return realmNeed(r, layer);
}
/* 当前境「圆满所需修为」（该境最后一层的需求） */
function realmFullNeed(s){ s=s||G; const r=realmOf(s); return realmNeed(r, realmLayerCount(r)); }
/* 当前境层数（炼气 13，其余各 4，渡劫 9） */
function curLayerCount(s){ return realmLayerCount(realmOf(s)); }
/* 当前境界显示名：炼气一层 / 筑基初 / 结丹后 / 渡劫九重 …（层满未突破时用「XX圆满」由调用方自行拼） */
function curRealmTxt(s){
  s=s||G; const r=realmOf(s);
  if(realmFull(s)) return REALM_NAMES[r]+'圆满';
  return realmLayerName(r, s.layer);
}
/* 按任意存档/祖先对象显示境界（不依赖全局 G）。旧档没有 realm 字段，按炼气算。 */
function objRealmTxt(o){
  if(!o) return '';
  const r=(o.realm!=null)?(o.realm|0):0;
  const info=REALMS[r];
  if(!info) return '炼气'+CN_NUM[o.layer]+'层';
  const lc=info.layers.length;
  if(o.layer>=lc) return REALM_NAMES[r]+'圆满';
  return REALM_NAMES[r]+info.stageName(o.layer);
}

/* 十二个月。正月起，腊月终。月是时间的计价单位，不是决策单位——
   修行可以一次推完，出门才需要一个月一个月地数。 */
const MONTH_CN=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
function monthName(m){ return MONTH_CN[Math.max(0,Math.min(11,m|0))]+'月'; }
/* 初一到三十。日子是真的以后，标题得让人看得见日子在走 */
function cnDay(d){
  d=Math.max(1,Math.min(30,d|0));
  if(d<=10) return '初'+CN_NUM[d];
  if(d<20)  return '十'+CN_NUM[d-10];
  if(d===20) return '二十';
  if(d<30)  return '廿'+CN_NUM[d-20];
  return '三十';
}
/* 纪年数字写汉字：三百一十二，不是「三一二」。族谱、碑文、开局正文共用 */
function cnYear(n){
  n=Math.max(0,n|0);
  if(n<=0) return '元年';
  const d='零一二三四五六七八九';
  let s='';
  const q=(n/1000)|0, b=((n/100)|0)%10, t=((n/10)|0)%10, g=n%10;
  if(q) s+=d[q]+'千';
  if(b) s+=d[b]+'百'; else if(q && (t||g)) s+='零';
  if(t){ if(t===1 && !q && !b) s+='十'; else s+=d[t]+'十'; }
  else if(b && g) s+='零';
  if(g) s+=d[g];
  return s;
}

/* =========================================================
   关系（后果链的账本）
   ---------------------------------------------------------
   你帮过谁、得罪过谁，都记在这张表里。账不立刻兑——
   过些日子，有恩的自会寻来报答，有怨的也会找上门来。
   记的是「净数」：恩为正，怨为负。不是好感度，是一笔待还的债。
   ========================================================= */
function rel(s, nid, dv, note, name){
  s=s||G; s.rel=s.rel||{};
  const r=s.rel[nid]||{v:0,note:'',name:name||'',at:s.age};
  r.v=(r.v||0)+dv;
  if(note) r.note=note;
  if(name) r.name=name;
  r.at=s.age;
  s.rel[nid]=r;
  if(r.v===0) delete s.rel[nid];       // 两清了，账就销了
  return r.v;
}
/* 有没有「没还的账」：有恩没报，或有怨未了。 */
function pendingRel(s, kind){
  s=s||G; s.rel=s.rel||{};
  const arr=[];
  for(const nid in s.rel){
    const r=s.rel[nid];
    if(!r) continue;
    if(kind==='恩' && r.v>0) arr.push({nid, v:r.v, note:r.note, name:r.name, at:r.at});
    if(kind==='怨' && r.v<0) arr.push({nid, v:r.v, note:r.note, name:r.name, at:r.at});
  }
  return arr;
}
function relName(nid){

  return n ? n.name : '故人';
}
